<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Us — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:720px">
      <h1 class="page-title" data-i18n="about_title">About Us</h1>
      <h2 class="about-motto" data-i18n="about_motto">Enjoy · Share · Protect · Develop</h2>
      <div class="about-body legal-prose" id="aboutBody"></div>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="contact">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.75rem" data-i18n="contact_title">Contact Us</h2>
        <p style="margin-bottom:0.4rem"><strong data-i18n="contact_email_label">Email</strong>: <a id="cEmail" href="#"></a></p>
        <p style="margin-bottom:0.4rem"><strong data-i18n="contact_phone_label">Phone</strong>: <span id="cPhone"></span></p>
        <p><strong data-i18n="contact_address_label">Address</strong>: <span id="cAddr"></span></p>
      </div>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="newsletter">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.5rem" data-i18n="footer_newsletter"></h2>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.85rem" data-i18n="about_newsletter_hint"></p>
        <form id="newsletterForm" style="display:flex;gap:0.5rem;flex-wrap:wrap">
          <input class="form-input" type="email" required placeholder="you@email.com" style="flex:1;min-width:200px" />
          <button type="submit" class="btn btn-primary" data-i18n="footer_newsletter_cta"></button>
        </form>
      </div>

      <div class="card" style="padding:1.35rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="feedback">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.35rem" data-i18n="feedback_title"></h2>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:1rem" data-i18n="feedback_sub"></p>
        <form id="feedbackForm">
          <div class="form-group">
            <label data-i18n="profile_name"></label>
            <input class="form-input" id="fbName" required />
          </div>
          <div class="form-group">
            <label data-i18n="profile_email"></label>
            <input class="form-input" id="fbEmail" type="email" required />
          </div>
          <div class="form-group">
            <label data-i18n="feedback_subject"></label>
            <input class="form-input" id="fbSubject" required />
          </div>
          <div class="form-group">
            <label data-i18n="feedback_message"></label>
            <textarea class="form-textarea" id="fbMessage" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="feedback_cta"></button>
        </form>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("about");
    const zh = TW.getLang() === "zh";
    const paras = [
      TW.t("about_p1"),
      TW.t("about_p2"),
      TW.t("about_p3"),
      TW.t("about_p4"),
    ];
    document.getElementById("aboutBody").innerHTML = paras
      .map((p) => `<p>${p}</p>`)
      .join("");
    const c = typeof TW.getSiteContent === "function" ? TW.getSiteContent() : {};
    const email = c.contactEmail || "info@trailwatch.hk";
    document.getElementById("cEmail").textContent = email;
    document.getElementById("cEmail").href = "mailto:" + email;
    document.getElementById("cPhone").textContent = c.contactPhone || "—";
    document.getElementById("cAddr").textContent = zh
      ? c.contactAddressZh || c.contactAddress || "—"
      : c.contactAddress || "—";

    document.getElementById("feedbackForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (typeof CMS !== "undefined" && CMS.submitFeedback) {
        CMS.submitFeedback({
          name: document.getElementById("fbName").value,
          email: document.getElementById("fbEmail").value,
          subject: document.getElementById("fbSubject").value,
          message: document.getElementById("fbMessage").value,
        });
      }
      showToast(TW.t("feedback_thanks"));
      e.target.reset();
    });
    const nl = document.getElementById("newsletterForm");
    if (nl)
      nl.addEventListener("submit", (e) => {
        e.preventDefault();
        showToast(TW.t("feedback_thanks"));
        e.target.reset();
      });
  </script>
</body>
</html>
