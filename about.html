<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Us — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:720px">
      <h1 class="page-title" data-i18n="about_title">About Us</h1>
      <p class="page-sub" id="aboutBody"></p>

      <div class="about-progs">
        <article class="card" style="padding:1.1rem">
          <h2 style="font-size:1.05rem;color:var(--green-900);margin:0 0 0.4rem" data-i18n="footer_ctc_title"></h2>
          <p class="page-sub" style="margin:0" data-i18n="footer_ctc_body"></p>
        </article>
        <article class="card" style="padding:1.1rem">
          <h2 style="font-size:1.05rem;color:var(--green-900);margin:0 0 0.4rem" data-i18n="footer_mytree_title"></h2>
          <p class="page-sub" style="margin:0" data-i18n="footer_mytree_body"></p>
        </article>
        <article class="card" style="padding:1.1rem">
          <h2 style="font-size:1.05rem;color:var(--green-900);margin:0 0 0.4rem" data-i18n="footer_backyard_title"></h2>
          <p class="page-sub" style="margin:0" data-i18n="footer_backyard_body"></p>
        </article>
      </div>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="premium">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.5rem" data-i18n="footer_premium"></h2>
        <p class="page-sub" style="margin-bottom:0.85rem" data-i18n="footer_premium_body"></p>
        <a class="btn btn-primary" href="get-app.html#premium" data-i18n="footer_premium_link"></a>
      </div>

      <p style="margin:1.25rem 0 0">
        <a class="btn btn-secondary" href="register.html" data-i18n="register_cta"></a>
      </p>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="contact">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.75rem" data-i18n="contact_title">Contact</h2>
        <p style="margin-bottom:0.4rem"><strong data-i18n="contact_email_label">Email</strong>: <a id="cEmail" href="#"></a></p>
        <p style="margin-bottom:0.4rem"><strong data-i18n="contact_phone_label">Phone</strong>: <span id="cPhone"></span></p>
        <p><strong data-i18n="contact_address_label">Address</strong>: <span id="cAddr"></span></p>
      </div>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem;scroll-margin-top:calc(var(--nav-h) + 1rem)" id="faq">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.75rem" data-i18n="footer_faq"></h2>
        <div id="faqList"></div>
      </div>

      <div class="card" style="padding:1.25rem;margin-top:1.5rem" id="newsletter">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.5rem" data-i18n="footer_newsletter"></h2>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.85rem">Get trail tips, events, and conservation news.</p>
        <form id="newsletterForm" style="display:flex;gap:0.5rem;flex-wrap:wrap">
          <input class="form-input" type="email" required placeholder="you@email.com" style="flex:1;min-width:200px" />
          <button type="submit" class="btn btn-primary" data-i18n="confirm"></button>
        </form>
      </div>

      <div class="card" style="padding:1.35rem;margin-top:1.5rem">
        <h2 style="font-size:1.1rem;color:var(--green-900);margin-bottom:0.35rem" data-i18n="feedback_title"></h2>
        <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:1rem" data-i18n="feedback_sub"></p>
        <form id="feedbackForm">
          <div class="form-group">
            <label data-i18n="profile_name"></label>
            <input class="form-input" id="fbName" required />
          </div>
          <div class="form-group">
            <label data-i18n="profile_email"></label>
            <input class="form-input" id="fbEmail" type="email" required />
          </div>
          <div class="form-group">
            <label data-i18n="feedback_subject"></label>
            <input class="form-input" id="fbSubject" required />
          </div>
          <div class="form-group">
            <label data-i18n="feedback_message"></label>
            <textarea class="form-textarea" id="fbMessage" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" data-i18n="feedback_cta"></button>
        </form>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("about");
    const c = TW.getSiteContent();
    document.getElementById("aboutBody").textContent =
      TW.getLang() === "zh" ? c.aboutZh : c.aboutEn;
    document.getElementById("cEmail").textContent = c.contactEmail;
    document.getElementById("cEmail").href = "mailto:" + c.contactEmail;
    document.getElementById("cPhone").textContent = c.contactPhone;
    document.getElementById("cAddr").textContent =
      TW.getLang() === "zh" ? c.contactAddressZh : c.contactAddress;
    document.getElementById("faqList").innerHTML = [1, 2, 3, 4]
      .map(
        (i) =>
          `<p class="faq-item"><strong>${TW.t("faq_" + i + "_q")}</strong><br/>${TW.t("faq_" + i + "_a")}</p>`
      )
      .join("");

    document.getElementById("feedbackForm").addEventListener("submit", (e) => {
      e.preventDefault();
      CMS.submitFeedback({
        name: document.getElementById("fbName").value,
        email: document.getElementById("fbEmail").value,
        subject: document.getElementById("fbSubject").value,
        message: document.getElementById("fbMessage").value,
      });
      showToast(TW.t("feedback_thanks"));
      e.target.reset();
    });
    const nl = document.getElementById("newsletterForm");
    if (nl) nl.addEventListener("submit", (e) => {
      e.preventDefault();
      showToast(TW.t("feedback_thanks"));
      e.target.reset();
    });
  </script>
</body>
</html>
