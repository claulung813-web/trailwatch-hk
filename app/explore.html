<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head {
      padding: 2.55rem 0.9rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-head h1 { font-size: 1.05rem; color: var(--green-900); margin: 0; }
    .tabs {
      display: flex; gap: 0.35rem; padding: 0.55rem 0.9rem 0.35rem; background: #fff;
      border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .tabs button {
      border: none; border-radius: 999px; padding: 0.4rem 0.8rem;
      font-size: 0.75rem; font-weight: 700; background: var(--green-50); color: var(--green-900);
      white-space: nowrap; cursor: pointer;
    }
    .tabs button.active { background: var(--green-900); color: #fff; }
    .subfilters { padding: 0.5rem 0.9rem; background: #fff; border-bottom: 1px solid var(--border); }
    .search-mini {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 0.45rem 0.7rem; font-size: 0.8rem; margin-bottom: 0.45rem; background: #f7faf7;
    }
    .route-card {
      display: flex; gap: 0.75rem; background: #fff; border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; margin-bottom: 0.65rem; text-decoration: none; color: inherit;
    }
    .route-card img { width: 84px; height: 84px; object-fit: cover; flex-shrink: 0; background: var(--green-100); }
    .route-card .meta { padding: 0.5rem 0.5rem 0.5rem 0; min-width: 0; }
    .route-card strong { display: block; font-size: 0.85rem; color: var(--green-900); }
    .route-card p { font-size: 0.7rem; color: var(--text-muted); margin: 0.2rem 0 0; }
    .route-card .follow-cta {
      display: inline-block; margin-top: 0.35rem; font-size: 0.72rem; font-weight: 800; color: var(--green-800);
    }
    .record-row {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.7rem 0.8rem; margin-bottom: 0.55rem;
    }
    .record-row strong { display: block; color: var(--green-900); font-size: 0.85rem; }
    .inc-form { background:#fff; border:1px solid var(--border); border-radius:12px; padding:0.75rem; margin-bottom:0.85rem; }
    .inc-form .form-group { margin-bottom:0.5rem; }
    .inc-form label { display:block; font-size:0.72rem; font-weight:700; color:var(--green-900); margin-bottom:0.2rem; }
    .filter-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.35rem; margin-top:0.4rem; }
    .filter-grid label { font-size:0.62rem; font-weight:700; color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="../get-app.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-head app-head-brand">
          <span data-app-logo aria-hidden="true"></span>
          <h1 id="pageTitle">Explore</h1>
        </div>
        <div class="tabs" id="tabs">
          <button type="button" class="active" data-tab="routes" id="tabRoutes">Routes</button>
          <button type="button" data-tab="records" id="tabRecords">Records</button>
          <button type="button" data-tab="incidents" id="tabIncidents">Incidents</button>
        </div>
        <div class="subfilters" id="subfilters"></div>
        <div class="phone-body" id="list"></div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/hikes.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = t("app_back_web");
    document.getElementById("pageTitle").textContent = t("nav_explore");
    document.getElementById("tabRoutes").textContent = lang === "zh" ? "路線" : "Routes";
    document.getElementById("tabRecords").textContent = lang === "zh" ? "記錄" : "Records";
    document.getElementById("tabIncidents").textContent = lang === "zh" ? "事故" : "Incidents";
    twMountAppNav("explore");

    const trails = (typeof TW.getPublishedTrails === "function" ? TW.getPublishedTrails() : null) || TW.trails || [];
    const records = TW.records || [];
    const list = document.getElementById("list");
    const sub = document.getElementById("subfilters");
    let tab = new URLSearchParams(location.search).get("tab") || "routes";
    if (!["routes", "records", "incidents"].includes(tab)) tab = "routes";
    let routeFilter = "editors"; // default Editor's Choice
    let recQ = "";
    let recFriends = false;
    let recDur = "all";
    let recFrom = "";
    let recTo = "";
    let recTag = "";

    document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));

    function editorsChoice() {
      return trails.filter((tr, i) => tr.monthly || i < 4);
    }

    function renderSub() {
      if (tab === "routes") {
        sub.innerHTML = `
          <div class="app-chip-row" id="routeChips">
            <button type="button" data-rf="all" class="${routeFilter === "all" ? "active" : ""}">${t("app_routes_all")}</button>
            <button type="button" data-rf="editors" class="${routeFilter === "editors" ? "active" : ""}">${t("app_editors_choice")}</button>
            <button type="button" data-rf="categories" class="${routeFilter === "categories" ? "active" : ""}">${t("app_routes_categories")}</button>
          </div>
          <p style="margin:0.4rem 0 0;font-size:0.65rem"><span class="app-tbd">${t("app_tbd_official")}</span></p>`;
        document.getElementById("routeChips").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-rf]");
          if (!btn) return;
          routeFilter = btn.dataset.rf;
          render();
        });
      } else if (tab === "records") {
        const tags = TW.DEFAULT_ACTIVITY_TAGS || [];
        const tagBtns = `<button type="button" data-tag="" class="${!recTag ? "active" : ""}">${t("filter_all")}</button>` +
          tags.map((tg) => {
            const label = lang === "zh" ? tg.labelZh : tg.label;
            return `<button type="button" data-tag="${tg.id}" class="${recTag === tg.id ? "active" : ""}">${label}</button>`;
          }).join("");
        sub.innerHTML = `
          <input class="search-mini" id="recSearch" type="search" placeholder="${t("app_filter_keyword")}…" value="${recQ}" />
          <div class="app-chip-row" id="recChips">
            <button type="button" data-rf="friends" class="${recFriends ? "active" : ""}">${t("app_filter_friends")}</button>
            <button type="button" data-dur="all" class="${recDur === "all" ? "active" : ""}">${t("filter_all")}</button>
            <button type="button" data-dur="under1" class="${recDur === "under1" ? "active" : ""}">${t("app_dur_under1")}</button>
            <button type="button" data-dur="1to3" class="${recDur === "1to3" ? "active" : ""}">${t("app_dur_1to3")}</button>
            <button type="button" data-dur="over3" class="${recDur === "over3" ? "active" : ""}">${t("app_dur_over3")}</button>
          </div>
          <div class="filter-grid">
            <div><label>${t("app_filter_from")}</label><input class="search-mini" style="margin:0" type="date" id="recFrom" value="${recFrom}" /></div>
            <div><label>${t("app_filter_to")}</label><input class="search-mini" style="margin:0" type="date" id="recTo" value="${recTo}" /></div>
          </div>
          <p style="margin:0.45rem 0 0.25rem;font-size:0.68rem;font-weight:800;color:var(--green-900)">${t("app_filter_tags")}</p>
          <div class="app-chip-row" id="recTags" style="flex-wrap:wrap">${tagBtns}</div>`;
        document.getElementById("recSearch").addEventListener("input", (e) => {
          recQ = e.target.value.trim().toLowerCase();
          renderListOnly();
        });
        document.getElementById("recChips").addEventListener("click", (e) => {
          const friendBtn = e.target.closest("button[data-rf]");
          const durBtn = e.target.closest("button[data-dur]");
          if (friendBtn) {
            recFriends = !recFriends;
            friendBtn.classList.toggle("active", recFriends);
          }
          if (durBtn) {
            recDur = durBtn.dataset.dur;
            document.querySelectorAll("#recChips [data-dur]").forEach((b) => b.classList.toggle("active", b === durBtn));
          }
          renderListOnly();
        });
        document.getElementById("recFrom").addEventListener("change", (e) => { recFrom = e.target.value; renderListOnly(); });
        document.getElementById("recTo").addEventListener("change", (e) => { recTo = e.target.value; renderListOnly(); });
        document.getElementById("recTags").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-tag]");
          if (!btn) return;
          recTag = btn.dataset.tag || "";
          document.querySelectorAll("#recTags button").forEach((b) => b.classList.toggle("active", b === btn));
          renderListOnly();
        });
      } else {
        sub.innerHTML = `<p style="margin:0;font-size:0.75rem;color:var(--text-muted)">${t("app_incidents_hint")}</p>`;
      }
    }

    function routeCards(rows) {
      return rows.length
        ? rows.map((tr) => {
            const name = lang === "zh" ? (tr.nameZh || tr.titleZh || tr.name || tr.title) : (tr.name || tr.title);
            const dist = tr.distanceKm != null ? tr.distanceKm + " km" : (tr.distance || "");
            const img = tr.image || "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=200&q=60";
            const href = "route-detail.html?id=" + encodeURIComponent(tr.id || "");
            return `<a class="route-card" href="${href}">
              <img src="${img}" alt="" />
              <div class="meta">
                <strong>${name || "Trail"}</strong>
                <p>${dist}${tr.duration ? " · " + tr.duration : ""}</p>
                <span class="follow-cta">${t("app_save_to_plans")} →</span>
              </div>
            </a>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:2rem 1rem">${lang === "zh" ? "暫無路線" : "No routes yet"}</p>`;
    }

    function renderListOnly() {
      if (tab === "routes") {
        let rows = trails.slice();
        if (routeFilter === "editors") rows = editorsChoice();
        else if (routeFilter === "categories") {
          const chips = (TW.trailFilters || []).map((f) =>
            `<button type="button" class="app-chip" data-cat="${f.id}">${t(f.labelKey)}</button>`
          ).join("");
          list.innerHTML = `
            <div class="app-chip-row" id="catChips" style="margin-bottom:0.75rem;flex-wrap:wrap">${chips}</div>
            <div id="catRoutes">${routeCards(trails.slice(0, 8))}</div>`;
          document.getElementById("catChips").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-cat]");
            if (!btn) return;
            document.querySelectorAll("#catChips button").forEach((b) => b.classList.toggle("active", b === btn));
            const cat = btn.dataset.cat;
            const filtered = cat === "all"
              ? trails
              : trails.filter((tr) => (tr.tags || []).includes(cat));
            document.getElementById("catRoutes").innerHTML = routeCards(filtered.slice(0, 10));
          });
          return;
        }
        list.innerHTML = routeCards(rows.slice(0, 10));
      } else if (tab === "records") {
        let rows = records.slice();
        if (recQ) {
          rows = rows.filter((r) => {
            const tags = (r.activityTags || []).map((id) => TW.activityTagLabel ? TW.activityTagLabel(id) : id).join(" ");
            const text = ((r.title || "") + " " + (r.titleZh || "") + " " + (r.user || "") + " " + tags).toLowerCase();
            return text.includes(recQ);
          });
        }
        if (recFriends) rows = rows.filter((r) => TW.recordIsFriend(r));
        if (recDur !== "all") {
          rows = rows.filter((r) => {
            const m = TW.recordDurationMinutes(r);
            if (recDur === "under1") return m > 0 && m < 60;
            if (recDur === "1to3") return m >= 60 && m <= 180;
            if (recDur === "over3") return m > 180;
            return true;
          });
        }
        if (recFrom || recTo) {
          rows = rows.filter((r) => {
            const d = TW.recordDateValue(r);
            if (!d) return true;
            const iso = d.toISOString().slice(0, 10);
            if (recFrom && iso < recFrom) return false;
            if (recTo && iso > recTo) return false;
            return true;
          });
        }
        if (recTag) {
          rows = rows.filter((r) => (r.activityTags || []).indexOf(recTag) >= 0);
        }
        list.innerHTML = rows.length
          ? rows.map((r) => {
              const title = TW.tt(r, "title") || r.title;
              const href = "record-detail.html?id=" + encodeURIComponent(r.id || "");
              const tags = typeof TW.activityTagsHtml === "function" ? TW.activityTagsHtml(r.activityTags) : "";
              return `<a class="record-row" href="${href}" style="text-decoration:none;color:inherit;display:block">
                <strong>${title}</strong>
                <p>${r.user || ""} · ${r.distance || ""} · ${r.duration || ""}</p>
                <p>★ ${r.rating != null ? r.rating : "—"} · ${r.elev || (r.elevGain != null ? r.elevGain + " m" : "")}</p>
                ${tags}
              </a>`;
            }).join("")
          : `<p style="text-align:center;color:var(--text-muted);padding:2rem 1rem">${t("hikes_empty")}</p>`;
      } else {
        const reports = (typeof TW.getCommunityReports === "function" ? TW.getCommunityReports({ dateRange: "all" }) : TW.reports || []).slice(0, 12);
        const now = new Date();
        const dateStr = String(now.getDate()).padStart(2, "0") + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear();
        const timeStr = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
        list.innerHTML = `
          <div class="inc-form" id="incForm">
            <strong style="display:block;color:var(--green-900);margin-bottom:0.45rem">${t("report_modal_title")}</strong>
            <p style="font-size:0.72rem;color:var(--text-muted);margin:0 0 0.5rem">${t("app_incidents_hint")}</p>
            <div class="form-group">
              <label>${t("report_photos")}</label>
              <p style="font-size:0.7rem;color:var(--text-muted);margin:0 0 0.3rem">${t("report_photos_hint")}</p>
              <button type="button" class="btn btn-amber btn-block" id="incPhotos">${t("add_photos")}</button>
            </div>
            <div class="filter-grid">
              <div class="form-group"><label>${t("date")}</label><input class="form-input" id="incDate" value="${dateStr}" /></div>
              <div class="form-group"><label>${t("time")}</label><input class="form-input" id="incTime" value="${timeStr}" /></div>
            </div>
            <div class="form-group">
              <label>${t("category")}</label>
              <select class="form-select" id="incCat">
                <option value="waste">${t("cat_waste")}</option>
                <option value="tree">${t("cat_tree")}</option>
                <option value="vandalism">${t("cat_vandalism")}</option>
                <option value="obstruction">${t("cat_obstruction")}</option>
              </select>
            </div>
            <div class="form-group">
              <label>${t("location")}</label>
              <input class="form-input" id="incLoc" value="${lang === "zh" ? "香港" : "Hong Kong"}" />
              <a href="index.html" style="display:inline-block;margin-top:0.35rem;font-size:0.72rem;font-weight:800;color:var(--green-800)">${t("pick_on_map")}</a>
            </div>
            <div class="form-group">
              <label>${t("title_label")}</label>
              <input class="form-input" id="incTitle" placeholder="${t("add_title")}" />
            </div>
            <div class="form-group">
              <label>${t("description")}</label>
              <textarea class="form-textarea" id="incDesc" rows="2" placeholder="${t("tell_more")}"></textarea>
            </div>
            <button type="button" class="btn btn-primary btn-block" id="incSubmit">${t("confirm")}</button>
          </div>
          ${reports.map(renderReportItem).join("") || `<p style="text-align:center;color:var(--text-muted)">${t("no_trails")}</p>`}`;
        document.getElementById("incPhotos").addEventListener("click", () => showToast("📷"));
        document.getElementById("incSubmit").addEventListener("click", () => {
          if (typeof CMS !== "undefined" && CMS.submitIncident) {
            CMS.submitIncident({
              title: document.getElementById("incTitle").value.trim() || t("report_modal_title"),
              desc: document.getElementById("incDesc").value.trim(),
              category: document.getElementById("incCat").value,
              date: document.getElementById("incDate").value + " " + document.getElementById("incTime").value,
              coords: document.getElementById("incLoc").value,
              reporter: (TW.user && TW.user.name) || "",
            });
          }
          showToast(t("toast_report"));
          renderListOnly();
        });
      }
    }

    function render() {
      renderSub();
      renderListOnly();
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tab]");
      if (!btn) return;
      tab = btn.dataset.tab;
      document.querySelectorAll(".tabs button").forEach((c) => c.classList.toggle("active", c === btn));
      try {
        const u = new URL(location.href);
        u.searchParams.set("tab", tab);
        history.replaceState(null, "", u.pathname + u.search);
      } catch (e) {}
      render();
    });

    render();
  </script>
</body>
</html>
