<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body {
      flex: 1; overflow-y: auto; background: #f7faf7; min-height: 0;
      padding: 0.85rem 0.95rem calc(1rem + env(safe-area-inset-bottom, 0px));
    }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .app-detail-bar h1 { flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111; }
    .app-detail-bar .ib {
      width: 36px; height: 36px; text-decoration: none; color: #111;
      display: grid; place-items: center; font-size: 1.25rem;
    }
    .auth-card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem 0.95rem 1.15rem;
    }
    .auth-card .page-title { font-size: 1.2rem; margin: 0 0 0.35rem; }
    .auth-card .page-sub { font-size: 0.8rem; margin: 0 0 0.85rem; color: var(--text-muted); }
    .auth-switch { text-align: center; font-size: 0.8rem; margin: 0.85rem 0 0; }
    .auth-switch a { font-weight: 700; color: var(--green-800); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="login.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="login.html">‹</a>
          <h1 id="barTitle"></h1>
          <span class="ib" aria-hidden="true"></span>
        </div>
        <div class="phone-body">
          <div class="auth-card">
            <h1 class="page-title" id="forgotTitle"></h1>
            <p class="page-sub" id="forgotSub"></p>
            <form id="forgotForm">
              <div class="form-group">
                <label for="forgotEmail" id="forgotEmailLabel"></label>
                <input class="form-input" id="forgotEmail" name="email" type="email" required autocomplete="email" />
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="forgotCta"></button>
              <p class="auth-switch"><a href="login.html" id="forgotBack"></a></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    const zh = lang === "zh";
    const copy = zh
      ? {
          title: "重設密碼",
          bar: "忘記密碼？",
          sub: "輸入帳戶電郵，我們會寄出重設連結。",
          email: "電郵",
          cta: "寄出重設連結",
          back: "返回登入",
          thanks: "若此電郵已有帳戶，重設連結即將寄出。",
          ph: "you@email.com",
          login: "登入",
        }
      : {
          title: "Reset your password",
          bar: "Forgot password?",
          sub: "Enter the email for your account and we’ll send a reset link.",
          email: "Email",
          cta: "Send reset link",
          back: "Back to log in",
          thanks: "If an account exists for that email, a reset link is on its way.",
          ph: "you@email.com",
          login: "Log in",
        };
    document.getElementById("backWeb").textContent = "‹ " + copy.login;
    document.getElementById("barTitle").textContent = copy.bar;
    document.getElementById("forgotTitle").textContent = copy.title;
    document.getElementById("forgotSub").textContent = copy.sub;
    document.getElementById("forgotEmailLabel").textContent = copy.email;
    document.getElementById("forgotCta").textContent = copy.cta;
    document.getElementById("forgotBack").textContent = copy.back;
    document.getElementById("forgotEmail").placeholder = copy.ph;
    const next = new URLSearchParams(location.search).get("next");
    if (next) document.getElementById("forgotBack").href = "login.html?next=" + encodeURIComponent(next);
    document.getElementById("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value;
      if (typeof CMS !== "undefined" && CMS.recordAuthEvent) {
        CMS.recordAuthEvent({ type: "forgot", email: email, source: "app" });
      }
      showToast(copy.thanks);
      const dest = "login.html" + (next ? "?next=" + encodeURIComponent(next) : "");
      setTimeout(() => { location.href = dest; }, 900);
    });
  </script>
</body>
</html>
