<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head { padding: 2.4rem 0.9rem 0.65rem; background: #fff; border-bottom: 1px solid var(--border); text-align: center; }
    .app-head h1 { font-size: 1.05rem; color: var(--green-900); margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
    .grid div { aspect-ratio: 1; border-radius: 10px; background-size: cover; background-position: center; }
    .limit-note {
      font-size: 0.72rem; margin-bottom: 0.55rem; display: flex; align-items: center; justify-content: space-between;
      background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.7rem;
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-head"><h1 id="pageTitle"></h1></div>
        <div class="phone-body">
          <div class="limit-note">
            <span id="photoLimit"></span>
            <span class="app-premium-pill" id="photoPrem"></span>
          </div>
          <div class="grid" id="grid"></div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("app_profile");
    document.getElementById("pageTitle").textContent = t("app_my_gallery");
    document.getElementById("photoLimit").textContent = lang === "zh" ? "免費額度 20 張（按時間排序）" : "Free limit 20 photos · chronological";
    document.getElementById("photoPrem").textContent = t("app_unlimited_photos");
    twMountAppNav("profile");
    const imgs = [
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=60",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&q=60",
      "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=400&q=60",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&q=60",
      "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=400&q=60",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400&q=60",
    ];
    document.getElementById("grid").innerHTML = imgs.map((src) =>
      `<div style="background-image:url('${src}')"></div>`
    ).join("");
    document.querySelector(".limit-note").addEventListener("click", () => showToast(t("app_upgrade")));
  </script>
</body>
</html>
