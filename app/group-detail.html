<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Group Hike Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-screen { display: flex; flex-direction: column; height: 100%; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.45rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
    }
    .join-dock {
      padding: 0.7rem 0.9rem 1.05rem; background: #fff; border-top: 1px solid var(--border);
    }
    .stage-tabs {
      display: flex; gap: 0.35rem; padding: 0.55rem 0.9rem; background: #fff;
      border-bottom: 1px solid var(--border); overflow-x: auto; flex-wrap: nowrap;
      mask-image: linear-gradient(90deg, #000 88%, transparent);
    }
    .hero { height: 140px; background: center/cover no-repeat; position: relative; }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.45));
    }
    .stage-tabs button {
      border: none; border-radius: 999px; padding: 0.35rem 0.7rem;
      font-size: 0.7rem; font-weight: 700; background: var(--green-50); color: var(--green-900); cursor: pointer;
    }
    .stage-tabs button.active { background: var(--green-900); color: #fff; }
    .block {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem 0.85rem; margin-bottom: 0.65rem;
    }
    .block h3 { margin: 0 0 0.35rem; font-size: 0.82rem; color: var(--green-900); }
    .block p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
    .who { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.45rem; }
    .who span {
      width: 32px; height: 32px; border-radius: 50%; background: var(--green-100);
      display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; color: var(--green-900);
    }
    .msg {
      padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: 0.75rem;
    }
    .msg strong { color: var(--green-900); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="hikes.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="hikes.html" id="backInline" aria-label="Back">‹</a>
          <span style="flex:1"></span>
        </div>
        <div class="hero" id="hero"></div>
        <div style="padding:0.75rem 0.9rem 0.35rem;background:#fff;border-bottom:1px solid var(--border)">
          <h1 style="font-size:1.05rem;color:var(--green-900);margin:0" id="title"></h1>
          <p style="font-size:0.72rem;color:var(--text-muted);margin:0.25rem 0 0" id="meta"></p>
          <p style="margin:0.4rem 0 0"><span class="app-tbd" id="orgBadge"></span> · <span class="app-tbd" id="visBadge"></span></p>
        </div>
        <div class="stage-tabs" id="stages"></div>
        <div class="phone-body" id="content"></div>
        <div class="join-dock" id="joinDock" hidden></div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("groups_title");
    twMountAppNav("home");

    const params = new URLSearchParams(location.search);
    const id = Number(params.get("id") || 0);
    const meetup = (TW.meetups || [])[id] || (TW.meetups || [])[0];
    let stage = params.get("stage") || "recruiting";

    document.getElementById("hero").style.backgroundImage =
      `url("${(meetup && meetup.image) || "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=800&q=60"}")`;
    document.getElementById("title").textContent = meetup ? TW.tt(meetup, "title") : "Group hike";
    document.getElementById("meta").textContent = meetup
      ? `${TW.tt(meetup, "date")} · ${TW.tt(meetup, "place")}`
      : "";
    document.getElementById("orgBadge").textContent = id === 0 ? t("app_org_tw") : t("app_org_user");
    document.getElementById("visBadge").textContent = t("app_group_private_mvp");

    const stageList = [
      { id: "recruiting", key: "app_stage_recruiting" },
      { id: "joined", key: "app_stage_joined" },
      { id: "completed", key: "app_stage_completed" },
    ];
    document.getElementById("stages").innerHTML = stageList.map((s) =>
      `<button type="button" class="${s.id === stage ? "active" : ""}" data-s="${s.id}">${t(s.key)}</button>`
    ).join("");

    function render() {
      const joinedPeople = ["AC", "SW", "JL", "MK", "YT"];
      const vis = id === 0 ? t("groups_badge_public") : t("groups_badge_private");
      document.getElementById("visBadge").textContent = vis;
      let html = `
        <div class="block">
          <h3>${t("app_hike_details")}</h3>
          <p>${meetup ? TW.tt(meetup, "date") + " · " + TW.tt(meetup, "place") : ""}</p>
        </div>
        <div class="block">
          <h3>${t("groups_description")}</h3>
          <p>${lang === "zh" ? "中等步速聯誼。請自備水與頭燈。" : "Moderate-pace group hike. Bring water and a headlamp."}</p>
        </div>
        <div class="block">
          <h3>${t("groups_route")}</h3>
          <p>${meetup ? TW.tt(meetup, "title") : "—"} · ~8 km</p>
          ${stage !== "recruiting" ? `<p style="margin:0.35rem 0 0.55rem;font-size:0.72rem">${t("app_track_follow_group")}</p>
          <a class="btn btn-primary btn-block" href="index.html?follow=group" style="padding:0.5rem;font-size:0.82rem">${t("app_track_follow")}</a>` : ""}
        </div>
        <div class="block">
          <h3>${t("groups_who_joined")}</h3>
          <div class="who">${joinedPeople.map((n) => `<span>${n}</span>`).join("")}</div>
        </div>`;

      if (stage === "joined" || stage === "completed") {
        html += `
          <div class="block">
            <h3>${t("groups_detail_links")}</h3>
            <p>${lang === "zh" ? "主辦可加入 WhatsApp 等外部連結。" : "Organizer can add external URLs such as a WhatsApp group."}</p>
            <p style="margin-top:0.4rem"><a href="#" onclick="showToast('WhatsApp');return false">chat.whatsapp.com/demo</a></p>
          </div>
          <div class="block">
            <h3>${t("groups_discussion")}</h3>
            <div class="msg"><strong>Alex</strong> — ${lang === "zh" ? "早上 5:15 地鐵會合？" : "Meet at MTR 5:15am?"}</div>
            <div class="msg"><strong>Sam</strong> — ${lang === "zh" ? "好，我會帶備用電池。" : "Sounds good — bringing spare batteries."}</div>
            ${stage === "completed" ? `<p style="margin-top:0.55rem;font-size:0.72rem;color:var(--green-800)">${t("app_discussion_days").replace("{n}", "7")}</p>` : ""}
          </div>`;
      }
      if (stage === "completed") {
        html += `
          <div class="block">
            <h3>${t("groups_recorded")}</h3>
            <p style="margin-bottom:0.45rem">${t("groups_recorded_privacy")}</p>
            <a href="record-detail.html" style="font-size:0.75rem;font-weight:700;color:var(--green-800)">${lang === "zh" ? "Alex 的路線" : "Alex’s route"} →</a>
          </div>
          <div class="block">
            <h3>${t("groups_photos")}</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;margin-top:0.4rem">
              <div style="height:72px;border-radius:8px;background:url(https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300&q=60) center/cover"></div>
              <div style="height:72px;border-radius:8px;background:url(https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=300&q=60) center/cover"></div>
            </div>
          </div>`;
      }
      if (stage === "recruiting") {
        document.getElementById("joinDock").hidden = false;
        document.getElementById("joinDock").innerHTML =
          `<button type="button" class="btn btn-primary btn-block" id="btnJoin">${t("groups_join_cta")}</button>`;
      } else {
        document.getElementById("joinDock").hidden = true;
        document.getElementById("joinDock").innerHTML = "";
      }
      document.getElementById("content").innerHTML = html;
      const joinBtn = document.getElementById("btnJoin");
      if (joinBtn) joinBtn.addEventListener("click", () => {
        showToast(t("toast_joined"));
        stage = "joined";
        document.querySelectorAll("#stages button").forEach((b) => b.classList.toggle("active", b.dataset.s === "joined"));
        render();
      });
    }

    document.getElementById("stages").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-s]");
      if (!btn) return;
      stage = btn.dataset.s;
      document.querySelectorAll("#stages button").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });
    render();
  </script>
</body>
</html>
