<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Hike Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; background: #f3f4f6; min-height: 0; }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-detail-bar h1 {
      flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
      flex-shrink: 0;
    }
    #detailMap { height: 210px; width: 100%; }
    .map-wrap { position: relative; background: #e8ece8; }
    .map-expand {
      position: absolute; top: 0.55rem; right: 0.55rem; z-index: 500;
      width: 34px; height: 34px; border: none; border-radius: 8px; background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer;
    }
    .rec-card {
      margin: 0.65rem 0.7rem 0.85rem; background: #fff; border-radius: 14px;
      padding: 0.85rem 0.9rem 1rem; box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .rec-user-row { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.85rem; }
    .rec-user-row .avatar-sm, .rec-user-row .avatar-fallback { width: 42px; height: 42px; flex-shrink: 0; }
    .rec-user-meta { flex: 1; min-width: 0; }
    .rec-user-meta .name { font-weight: 800; font-size: 0.9rem; color: #111; }
    .rec-user-meta .date { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; }
    .rec-rating { font-weight: 700; font-size: 0.9rem; }
    .rec-rating .star { color: #e8b923; }
    .rec-stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem 0.35rem; }
    .rec-stat .ico { font-size: 0.8rem; color: #9ca3af; margin-bottom: 0.1rem; }
    .rec-stat .val { font-size: 0.88rem; font-weight: 800; color: #111; }
    .rec-stat .lbl { font-size: 0.62rem; color: var(--text-muted); font-weight: 600; margin-top: 0.08rem; }
    .photos-block { padding: 0 0.7rem 1.25rem; }
    .photos-block h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: var(--green-900); }
    .photo-strip { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.25rem; }
    .photo-strip img {
      width: 112px; height: 112px; object-fit: cover; border-radius: 10px;
      flex-shrink: 0; background: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="records.html" id="backList"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="records.html" id="backInline">‹</a>
          <h1 id="hikeTitle">—</h1>
          <button type="button" class="ib" id="btnShare">↗</button>
        </div>
        <div class="phone-body">
          <div class="map-wrap">
            <div id="detailMap"></div>
            <button type="button" class="map-expand" id="btnExpandMap">⛶</button>
          </div>
          <div class="rec-card">
            <div class="rec-user-row">
              <div id="recAvatar"></div>
              <div class="rec-user-meta">
                <div class="name" id="recUser">—</div>
                <div class="date" id="hikeDate">—</div>
              </div>
              <div class="rec-rating" id="ratingWrap"><span class="star">★</span> <span id="recRating">—</span></div>
            </div>
            <div class="rec-stats-grid" id="recStats"></div>
            <div id="hikeTags"></div>
          </div>
          <div class="photos-block">
            <h2 id="photosHeading">Photos</h2>
            <div class="photo-strip" id="photoGrid"></div>
            <p id="photoEmpty" style="display:none;color:var(--text-muted);font-size:0.78rem;margin:0.35rem 0 0"></p>
          </div>
          <div class="route-actions" style="display:grid;gap:0.45rem;padding:0 0.7rem 1.25rem">
            <button type="button" class="btn btn-primary btn-block" id="btnBookmarkFoot"></button>
            <button type="button" class="btn btn-secondary btn-block" id="btnExportGpx"></button>
          </div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/hikes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backList").textContent = TW.t("hikes_back_list");
    document.getElementById("photosHeading").textContent = t("rec_photos");
    document.getElementById("photoEmpty").textContent = t("rec_no_photos");
    twMountAppNav("profile");

    TW.ensureDemoHike();
    const id = new URLSearchParams(location.search).get("id");
    const hike = TW.getHike(id) || TW.getHikes()[0];
    if (!hike) {
      location.href = "records.html";
    } else {
      const title = TW.getLang() === "zh" ? hike.titleZh || hike.title : hike.title;
      const user = hike.user || (TW.user && TW.user.name) || "Hiker";
      const avatar = hike.avatar != null ? hike.avatar : (TW.user && TW.user.avatar);
      document.getElementById("hikeTitle").textContent = title;
      document.getElementById("hikeDate").textContent = TW.formatHikeDate(hike.endedAt || hike.startedAt);
      document.getElementById("recUser").textContent = user;
      document.getElementById("recAvatar").innerHTML = twAvatarHtml(avatar, "avatar-sm", "", user);
      if (hike.rating != null) {
        document.getElementById("recRating").textContent = hike.rating;
      } else {
        document.getElementById("ratingWrap").style.visibility = "hidden";
      }

      const cal = hike.calories != null ? hike.calories : TW.estimateCalories(hike.seconds, hike.distanceKm, hike.elevGain);
      const pace = hike.pace || TW.formatPace(hike.seconds, hike.distanceKm);
      const stats = [
        { ico: "📏", val: hike.distanceKm + " km", lbl: t("app_distance") },
        { ico: "⏱", val: TW.formatDurationShort(hike.seconds), lbl: t("app_duration") },
        { ico: "〰", val: hike.elevGain + " m", lbl: t("rec_elev_gain") },
        { ico: "🔥", val: cal + " kcal", lbl: t("rec_calories") },
        { ico: "◔", val: pace, lbl: t("rec_avg_pace") },
        { ico: "▶", val: TW.formatClock(hike.startedAt), lbl: t("rec_started") },
        { ico: "⚑", val: TW.formatClock(hike.endedAt), lbl: t("rec_finished") },
      ];
      document.getElementById("recStats").innerHTML = stats.map((s) =>
        `<div class="rec-stat"><div class="ico">${s.ico}</div><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`
      ).join("");
      document.getElementById("hikeTags").innerHTML = TW.activityTagsHtml(hike.activityTags) || "";

      const photos = hike.photos || [];
      if (photos.length) {
        document.getElementById("photoGrid").innerHTML = photos.map((p) =>
          `<img src="${TW.recordPhotoSrc(p)}" alt="" loading="lazy" onerror="this.remove()" />`
        ).join("");
      } else {
        document.getElementById("photoEmpty").style.display = "block";
      }

      const path = hike.path && hike.path.length ? hike.path : [[22.35, 114.25]];
      const map = L.map("detailMap", { zoomControl: false }).setView(path[0], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
      const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
      TW.addRouteEndpoints(map, path);
      setTimeout(() => { map.invalidateSize(); map.fitBounds(line.getBounds().pad(0.25)); }, 100);
      document.getElementById("btnExpandMap").addEventListener("click", () => {
        map.invalidateSize();
        map.fitBounds(line.getBounds().pad(0.15));
      });
    }
    document.getElementById("btnBookmarkFoot").textContent = t("rec_bookmark");
    document.getElementById("btnExportGpx").textContent = t("app_export_gpx");
    document.getElementById("btnBookmarkFoot").addEventListener("click", () => showToast(t("rec_bookmark")));
    document.getElementById("btnExportGpx").addEventListener("click", () => showToast(t("app_gpx_exported")));
    document.getElementById("btnShare").addEventListener("click", () => showToast(t("rec_share")));
  </script>
</body>
</html>
