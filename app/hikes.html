<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — My Hikes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 1rem 0.9rem 0.5rem; background: var(--mint); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="../my-hikes.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div style="padding:2.5rem 1rem 0.75rem;background:white;border-bottom:1px solid var(--border)">
          <h1 style="font-size:1.2rem;color:var(--green-900);margin:0" id="pageTitle"></h1>
          <p style="font-size:0.8rem;color:var(--text-muted);margin:0.35rem 0 0" id="pageSub"></p>
        </div>
        <div class="phone-body">
          <div class="record-list" id="hikeList"></div>
        </div>
        <nav class="app-bottom-nav">
          <a href="../index.html"><span class="ico">🏠</span><span id="nHome"></span></a>
          <a href="hikes.html" class="active"><span class="ico">🗺</span><span id="nHikes"></span></a>
          <a href="index.html"><span class="ico">✈</span><span id="nTrack"></span></a>
          <a href="donate.html"><span class="ico">💚</span><span id="nDonate"></span></a>
          <a href="../profile.html"><span class="ico">👤</span><span id="nDash"></span></a>
        </nav>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/hikes.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = TW.t("app_back_web");
    document.getElementById("pageTitle").textContent = TW.t("hikes_title");
    document.getElementById("pageSub").textContent = TW.t("hikes_sub");
    document.getElementById("nHome").textContent = TW.t("app_home");
    document.getElementById("nHikes").textContent = TW.t("nav_hikes");
    document.getElementById("nTrack").textContent = TW.t("app_track");
    document.getElementById("nDonate").textContent = TW.t("nav_donate");
    document.getElementById("nDash").textContent = TW.t("app_dashboard");

    TW.ensureDemoHike();
    const list = TW.getHikes();
    document.getElementById("hikeList").innerHTML = list.length
      ? list.map((h) => TW.renderHikeListItem(h, "hike-detail.html?id=" + encodeURIComponent(h.id))).join("")
      : `<p style="text-align:center;color:var(--text-muted);padding:2rem 1rem">${TW.t("hikes_empty")}</p>
         <a class="btn btn-primary btn-block" href="index.html">${TW.t("hikes_open_app")}</a>`;
  </script>
</body>
</html>
