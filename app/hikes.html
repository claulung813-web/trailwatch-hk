<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Group Hikes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head {
      padding: 2.4rem 0.9rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-head h1 { font-size: 1.05rem; color: var(--green-900); margin: 0; text-align: center; }
    .app-head p { font-size: 0.72rem; color: var(--text-muted); margin: 0.3rem 0 0; text-align: center; }
    .search-mini {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 0.45rem 0.7rem; font-size: 0.8rem; margin-bottom: 0.5rem; background: #fff;
    }
    .hike-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; margin-bottom: 0.7rem; text-decoration: none; color: inherit; display: block;
    }
    .hike-card img { width: 100%; height: 110px; object-fit: cover; background: var(--green-100); }
    .hike-card .body { padding: 0.7rem 0.8rem 0.85rem; }
    .hike-card strong { display: block; color: var(--green-900); font-size: 0.9rem; }
    .hike-card .meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem; }
    .org-badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 0.12rem 0.4rem;
      border-radius: 4px; margin-top: 0.4rem;
    }
    .org-tw { background: #ecfdf5; color: #047857; }
    .org-user { background: #eff6ff; color: #1d4ed8; }
    .fab-add {
      position: absolute; right: 1rem; bottom: 4.5rem; z-index: 20;
      border: none; border-radius: 999px; padding: 0.55rem 0.9rem;
      background: var(--green-900); color: #fff; font-weight: 700; font-size: 0.75rem;
      box-shadow: 0 4px 14px rgba(11,66,26,0.35); cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="home.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen" style="position:relative">
        <div class="app-head">
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <div id="communityTabs"></div>
        <div class="phone-body">
          <input class="search-mini" id="groupSearch" type="search" />
          <div class="app-chip-row" id="groupFilters" style="margin-bottom:0.45rem"></div>
          <div class="app-date-row">
            <input type="date" id="groupDateFrom" />
            <input type="date" id="groupDateTo" />
          </div>
          <div id="groupList"></div>
        </div>
        <button type="button" class="fab-add" id="btnAdd"></button>
        <div data-app-nav></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Organizer demo form -->
  <div id="orgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:80;align-items:flex-end;justify-content:center">
    <div style="background:#fff;width:100%;max-width:390px;border-radius:16px 16px 0 0;padding:1.1rem 1.15rem 1.4rem;max-height:85%;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.65rem">
        <strong id="orgTitle" style="color:var(--green-900)"></strong>
        <button type="button" id="closeOrg">✕</button>
      </div>
      <label style="font-size:0.75rem;font-weight:700;color:var(--green-900)" id="lblOrgName"></label>
      <input class="form-input" id="orgName" style="margin:0.25rem 0 0.65rem;width:100%" />
      <p style="font-size:0.75rem;font-weight:700;color:var(--green-900);margin:0 0 0.35rem" id="lblVis"></p>
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.5rem">
        <label style="font-size:0.78rem"><input type="radio" name="appVis" value="private" checked /> <span id="lblPriv"></span></label>
        <label style="font-size:0.78rem"><input type="radio" name="appVis" value="public" id="appVisPublic" /> <span id="lblPub"></span></label>
      </div>
      <p style="font-size:0.68rem;color:var(--text-muted);margin:0 0 0.55rem" id="visHint"></p>
      <button type="button" class="btn btn-secondary btn-block" style="margin-bottom:0.45rem;padding:0.45rem" id="btnPickRoute"></button>
      <button type="button" class="btn btn-secondary btn-block" style="margin-bottom:0.45rem;padding:0.45rem" id="btnInvite"></button>
      <p style="font-size:0.72rem;margin:0 0 0.55rem"><span class="app-premium-pill" id="orgPremium"></span></p>
      <p style="font-size:0.68rem;color:var(--text-muted);margin:0 0 0.65rem" id="approveNote"></p>
      <button type="button" class="btn btn-primary btn-block" id="submitOrg"></button>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("app_community");
    document.getElementById("pageTitle").textContent = t("home_feat_groups");
    document.getElementById("pageSub").textContent = t("groups_sub");
    document.getElementById("groupSearch").placeholder = t("groups_search_ph");
    document.getElementById("btnAdd").textContent = "+ " + t("app_group_add");
    document.getElementById("orgTitle").textContent = t("app_group_add");
    document.getElementById("lblOrgName").textContent = t("app_hike_title");
    document.getElementById("lblVis").textContent = t("groups_visibility");
    document.getElementById("lblPriv").textContent = t("groups_private");
    document.getElementById("lblPub").textContent = t("groups_public");
    document.getElementById("btnPickRoute").textContent = t("app_pick_route");
    document.getElementById("btnInvite").textContent = t("app_invite_friends");
    document.getElementById("orgPremium").textContent = t("app_group_organize_premium");
    document.getElementById("approveNote").textContent = t("groups_premium_private_note");
    document.getElementById("submitOrg").textContent = t("confirm");
    twMountAppNav("home");
    document.getElementById("communityTabs").innerHTML = twAppCommunityTabs("groups");

    function syncAppVis() {
      const canPublic = typeof TW.canOrganizePublicGroup === "function" && TW.canOrganizePublicGroup();
      const pub = document.getElementById("appVisPublic");
      const status = typeof TW.getPublicGroupOrganizeStatus === "function" ? TW.getPublicGroupOrganizeStatus() : { minHosted: 2, hosted: 0 };
      pub.disabled = !canPublic;
      if (!canPublic) {
        pub.checked = false;
        const priv = document.querySelector('input[name="appVis"][value="private"]');
        if (priv) priv.checked = true;
        document.getElementById("visHint").textContent = t("groups_public_phase2_hint")
          .replace("{n}", String(status.minHosted))
          .replace("{have}", String(status.hosted));
      } else {
        document.getElementById("visHint").textContent = t("groups_public_unlocked");
      }
    }
    syncAppVis();

    const demo = (TW.meetups || []).map((m, i) => ({
      ...m,
      id: i,
      visibility: i === 0 ? "public" : "private",
      org: i === 0 ? "tw" : "user",
      status: i === 2 ? "past" : (i === 1 ? "joined" : "upcoming"),
      invited: i !== 1,
      friendOrg: i !== 1,
      dateISO: ["2026-09-06", "2026-09-07", "2026-05-21"][i] || "2026-08-01",
      stage: i === 1 ? "joined" : (i === 2 ? "completed" : "recruiting"),
    }));

    let filter = "all";
    let q = "";
    const chips = [
      { id: "all", key: "groups_filter_all" },
      { id: "joined", key: "groups_joined" },
      { id: "upcoming", key: "groups_upcoming" },
      { id: "past", key: "groups_past" },
      { id: "friend", key: "groups_filter_friend" },
      { id: "invited", key: "groups_filter_invited" },
    ];
    document.getElementById("groupFilters").innerHTML = chips.map((c, i) =>
      `<button type="button" class="${i === 0 ? "active" : ""}" data-f="${c.id}">${t(c.key)}</button>`
    ).join("");

    function hikeDate(m) {
      if (m.dateISO) {
        const ts = Date.parse(m.dateISO);
        if (Number.isFinite(ts)) return ts;
      }
      return 0;
    }

    function render() {
      const from = document.getElementById("groupDateFrom").value;
      const to = document.getElementById("groupDateTo").value;
      const list = demo.filter((m) => {
        const title = ((TW.tt(m, "title") || "") + " " + (TW.tt(m, "place") || "")).toLowerCase();
        const okQ = !q || title.includes(q);
        if (!okQ) return false;
        if (filter === "past") return m.status === "past" || m.stage === "completed";
        if (filter === "joined") return m.status === "joined" || m.stage === "joined" || m.stage === "completed";
        if (filter === "invited") return m.invited && m.visibility === "private";
        if (filter === "friend") return m.friendOrg;
        if (filter === "upcoming") return m.status !== "past" && m.stage !== "completed";
        const ts = hikeDate(m);
        if (from && ts && ts < Date.parse(from)) return false;
        if (to && ts && ts > Date.parse(to) + 86400000 - 1) return false;
        if ((from || to) && !ts) return false;
        return true;
      });
      document.getElementById("groupList").innerHTML = list.length
        ? list.map((m) => {
            const title = TW.tt(m, "title");
            const place = TW.tt(m, "place");
            const date = TW.tt(m, "date");
            const vis = m.visibility === "private" ? t("groups_badge_private") : t("groups_badge_public");
            const visCls = m.visibility === "private" ? "org-user" : "org-tw";
            const extra = m.invited && m.visibility === "private" ? t("groups_badge_invited") : (m.friendOrg ? t("groups_filter_friend") : "");
            return `<a class="hike-card" href="group-detail.html?id=${m.id}&stage=${m.stage}">
              <img src="${m.image}" alt="" />
              <div class="body">
                <strong>${title}</strong>
                <div class="meta">${date} · ${place}</div>
                <span class="org-badge ${visCls}">${vis}</span>
                ${extra ? `<span class="org-badge org-user" style="margin-left:0.3rem">${extra}</span>` : ""}
              </div>
            </a>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:2rem 0">${t("groups_empty")}</p>`;
    }

    document.getElementById("groupFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll("#groupFilters button").forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    document.getElementById("groupSearch").addEventListener("input", (e) => {
      q = e.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById("groupDateFrom").addEventListener("change", render);
    document.getElementById("groupDateTo").addEventListener("change", render);

    const modal = document.getElementById("orgModal");
    document.getElementById("btnAdd").addEventListener("click", () => {
      if (typeof TW.isLoggedIn === "function" && !TW.isLoggedIn()) {
        showToast(t("login_to_organize"));
        setTimeout(() => { location.href = "../login.html?next=" + encodeURIComponent("app/hikes.html"); }, 900);
        return;
      }
      if (typeof TW.canOrganizePrivateGroup === "function" && !TW.canOrganizePrivateGroup()) {
        showToast(t("groups_premium_required"));
        setTimeout(() => { location.href = "../get-app.html#premium"; }, 900);
        return;
      }
      syncAppVis();
      modal.style.display = "flex";
    });
    document.getElementById("closeOrg").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("btnPickRoute").addEventListener("click", () => {
      showToast(t("app_pick_route") + " → Map");
      setTimeout(() => (location.href = "index.html?mode=plan"), 600);
    });
    document.getElementById("btnInvite").addEventListener("click", () => showToast(t("app_invite_friends")));
    document.getElementById("submitOrg").addEventListener("click", () => {
      if (typeof TW.canOrganizePrivateGroup === "function" && !TW.canOrganizePrivateGroup()) {
        showToast(t("groups_premium_required"));
        return;
      }
      let vis = (document.querySelector('input[name="appVis"]:checked') || {}).value || "private";
      if (vis === "public" && typeof TW.canOrganizePublicGroup === "function" && !TW.canOrganizePublicGroup()) {
        showToast(t("groups_public_locked"));
        vis = "private";
      }
      modal.style.display = "none";
      showToast(t("groups_created") + " · " + (vis === "public" ? t("groups_badge_public") : t("app_group_private_mvp")));
    });
    document.getElementById("orgPremium").addEventListener("click", () => {
      location.href = "../get-app.html#premium";
    });

    render();
  </script>
</body>
</html>
