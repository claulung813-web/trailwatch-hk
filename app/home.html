<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 2.55rem 0.9rem 0.65rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-head h1 { flex: 1; font-size: 1.05rem; color: var(--green-900); margin: 0; text-align: center; }
    .app-head .app-brand-mark { width: 30px; height: 30px; }
    .head-link {
      font-size: 0.72rem; font-weight: 700; color: var(--green-800); text-decoration: none; white-space: nowrap;
    }
    .search-mini {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 0.45rem 0.7rem; font-size: 0.8rem; margin-bottom: 0.5rem; background: #fff;
    }
    .feed-card {
      background: #fff; border-radius: 12px; border: 1px solid var(--border);
      padding: 0.85rem; margin-bottom: 0.7rem;
    }
    .feed-card .top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.45rem; }
    .feed-card .name { font-size: 0.8rem; font-weight: 700; color: var(--green-900); }
    .feed-card .time { font-size: 0.65rem; color: var(--text-muted); }
    .feed-card strong { color: var(--green-900); display: block; margin-bottom: 0.25rem; font-size: 0.88rem; }
    .feed-card p { font-size: 0.78rem; color: var(--text-muted); margin: 0; }
    .feed-card .expand-body { display: none; margin-top: 0.5rem; font-size: 0.75rem; color: var(--text); }
    .feed-card.expanded .expand-body { display: block; }
    .tag {
      display: inline-block; font-size: 0.62rem; font-weight: 700; padding: 0.15rem 0.4rem;
      border-radius: 6px; background: var(--green-100); color: var(--green-800); margin-left: auto;
    }
    .expand-btn {
      border: none; background: none; color: var(--green-700); font-size: 0.7rem;
      font-weight: 700; padding: 0.35rem 0 0; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="../get-app.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-head">
          <span data-app-logo aria-hidden="true"></span>
          <h1 id="pageTitle">Trail Feed</h1>
          <span style="width:30px"></span>
        </div>
        <div id="communityTabs"></div>
        <div class="phone-body">
          <div class="feed-compose">
            <textarea id="storyText" maxlength="400"></textarea>
            <div class="feed-compose-actions">
              <button type="button" class="btn btn-primary" style="padding:0.35rem 0.7rem;font-size:0.72rem" id="btnStory"></button>
              <button type="button" class="btn btn-secondary" style="padding:0.35rem 0.55rem;font-size:0.68rem" data-share="record"></button>
              <button type="button" class="btn btn-secondary" style="padding:0.35rem 0.55rem;font-size:0.68rem" data-share="plan"></button>
              <button type="button" class="btn btn-secondary" style="padding:0.35rem 0.55rem;font-size:0.68rem" data-share="incident"></button>
            </div>
          </div>
          <input class="search-mini" id="feedSearch" type="search" />
          <div class="app-chip-row" id="feedFilters" style="margin-bottom:0.35rem;flex-wrap:wrap"></div>
          <div class="app-date-row">
            <input type="date" id="feedDateFrom" />
            <input type="date" id="feedDateTo" />
          </div>
          <div id="feed"></div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/hikes.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = t("app_back_web");
    document.getElementById("pageTitle").textContent = t("app_community");
    document.getElementById("communityTabs").innerHTML = twAppCommunityTabs("feed");
    document.getElementById("feedSearch").placeholder = t("feed_search_ph");
    document.getElementById("storyText").placeholder = t("feed_compose_ph");
    document.getElementById("btnStory").textContent = t("feed_post_story");
    document.querySelector("[data-share='record']").textContent = t("feed_share_record");
    document.querySelector("[data-share='plan']").textContent = t("feed_share_plan");
    document.querySelector("[data-share='incident']").textContent = t("feed_share_incident");
    twMountAppNav("home");

    let filter = "all";
    let q = "";
    const filters = [
      { id: "all", key: "feed_filter_all" },
      { id: "record", key: "feed_filter_records" },
      { id: "route", key: "feed_filter_routes" },
      { id: "incident", key: "feed_filter_incidents" },
      { id: "group", key: "feed_filter_groups" },
      { id: "announcement", key: "feed_filter_announce" },
      { id: "promo", key: "feed_filter_promo" },
    ];
    document.getElementById("feedFilters").innerHTML = filters.map((f, i) =>
      `<button type="button" class="${i === 0 ? "active" : ""}" data-f="${f.id}">${t(f.key)}</button>`
    ).join("");

    function typeOf(p) {
      if (p.type) return p.type;
      const tag = p.tag || "";
      if (/Record/i.test(tag)) return "record";
      if (/Route|Plan/i.test(tag)) return "route";
      if (/Incident/i.test(tag)) return "incident";
      if (/Group/i.test(tag)) return "group";
      if (/Announcement/i.test(tag)) return "announcement";
      if (/Sponsored|Promo|Ad|PnT/i.test(tag)) return "promo";
      return "community";
    }
    function feedDate(p) {
      if (p.dateISO) {
        const ts = Date.parse(p.dateISO);
        if (Number.isFinite(ts)) return ts;
      }
      return 0;
    }
    function matches(p) {
      const typ = typeOf(p);
      let okF = true;
      if (filter === "promo") okF = typ === "promo" || typ === "ad" || p.channel === "ad";
      else if (filter !== "all") okF = typ === filter;
      const text = ((p.title || "") + " " + (p.titleZh || "") + " " + (p.body || "") + " " + (p.bodyZh || "") + " " + (p.user || "") + " " + (p.tag || "")).toLowerCase();
      const okQ = !q || text.includes(q);
      const from = document.getElementById("feedDateFrom").value;
      const to = document.getElementById("feedDateTo").value;
      const ts = feedDate(p);
      let okD = true;
      if (from && ts && ts < Date.parse(from)) okD = false;
      if (to && ts && ts > Date.parse(to) + 86400000 - 1) okD = false;
      if ((from || to) && !ts) okD = false;
      return okF && okQ && okD;
    }

    function render() {
      const items = (TW.allFeedPosts ? TW.allFeedPosts() : TW.feed || []).filter(matches);
      document.getElementById("feed").innerHTML = items.length
        ? items.map(renderFeedCard).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:2rem 0">${t("feed_empty")}</p>`;
      bindLikes();
    }

    document.getElementById("feedFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll("#feedFilters button").forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    document.getElementById("feedSearch").addEventListener("input", (e) => {
      q = e.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById("feedDateFrom").addEventListener("change", render);
    document.getElementById("feedDateTo").addEventListener("change", render);

    function share(kind) {
      const posted = TW.demoShareToFeed(kind, document.getElementById("storyText").value);
      if (!posted) {
        showToast(t("feed_compose_ph"));
        return;
      }
      document.getElementById("storyText").value = "";
      showToast(t("feed_posted"));
      render();
    }
    document.getElementById("btnStory").addEventListener("click", () => share("story"));
    document.querySelectorAll("[data-share]").forEach((btn) => {
      btn.addEventListener("click", () => share(btn.dataset.share));
    });
    render();
  </script>
</body>
</html>
