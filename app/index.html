<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="icon" href="../assets/brand/icon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; }
    .site-header, .site-footer { display: none !important; }
    #appMap { width: 100%; height: 100%; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    .phone-topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 2.4rem 0.75rem 0.5rem; pointer-events: none; gap: 0.4rem;
    }
    .phone-topbar > * { pointer-events: auto; }
    .mode-toggle {
      display: flex; background: #fff; border-radius: 999px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); padding: 0.15rem; gap: 0.1rem;
    }
    .mode-toggle button {
      border: none; background: transparent; border-radius: 999px;
      padding: 0.35rem 0.7rem; font-size: 0.72rem; font-weight: 800;
      color: var(--text-muted); cursor: pointer;
    }
    .mode-toggle button.active { background: var(--green-900); color: #fff; }
    .round-btn {
      width: 42px; height: 42px; border-radius: 50%; background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,.2); display: grid; place-items: center;
      color: #111; text-decoration: none; z-index: 30; position: relative;
      border: none; cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .round-btn svg {
      width: 20px; height: 20px; stroke: #111; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .gps-pill {
      background: white; border-radius: 999px; padding: 0.35rem 0.65rem;
      font-size: 0.68rem; font-weight: 700; color: var(--green-900);
      box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; gap: 0.3rem;
    }
    .gps-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-500); }
    .figma-map-controls { top: auto !important; bottom: 10.5rem; right: 0.75rem; }
    .phone-screen.track-focus .app-bottom-nav { display: grid; }
    .figma-start-bar {
      padding: 0.75rem 1.1rem 1.1rem !important;
      align-items: flex-end; gap: 0.5rem; background: #fff; border-radius: 0;
    }
    .start-bar-spacer { width: 56px; flex-shrink: 0; }
    .figma-start {
      flex-direction: column; gap: 0.35rem; background: transparent !important;
      color: #1a1a1a !important; max-width: none; padding: 0; font-size: 0.8rem; font-weight: 600;
    }
    .figma-start-pill {
      width: 88px; height: 52px; border-radius: 999px; background: var(--green-900);
      display: grid; place-items: center; box-shadow: 0 4px 14px rgba(11, 66, 26, 0.35);
    }
    .figma-start:hover .figma-start-pill { background: var(--green-800); }
    .figma-sheet {
      padding: 0.45rem 1.1rem 1rem !important; max-height: 38%; overflow-y: auto;
      transition: max-height 0.25s ease;
    }
    .figma-sheet.expanded { max-height: 72% !important; }
    .figma-pause-sheet { max-height: 70% !important; }
    .sheet-handle {
      width: 36px; height: 4px; border-radius: 999px;
      background: #d1d5db; margin: 0 auto 0.65rem; cursor: pointer;
    }
    .figma-actions { gap: 2.4rem !important; margin-bottom: 0.55rem !important; }
    .action-circle { color: #1a1a1a !important; font-weight: 600; }
    .action-circle .circle {
      width: 54px; height: 54px; box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }
    .action-circle .circle.red { background: #e84a3c; }
    .action-circle .circle.amber { background: #f0a020; }
    .action-circle .circle.blue { background: #4a90c8; }
    .action-circle .circle.green { background: #1f8f4a; }
    .figma-live-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem;
      padding-top: 0.15rem; border-top: 1px solid #eee;
    }
    .live-stat, .p-stat {
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
      font-size: 0.82rem; font-weight: 700; color: #1a1a1a; padding: 0.5rem 0.15rem;
    }
    .live-stat + .live-stat { border-left: 1px solid #e5e7eb; }
    .drawer-extra { display: none; margin-top: 0.15rem; }
    .figma-sheet.expanded .drawer-extra { display: block; }
    .figma-sheet.expanded .figma-live-stats-compact { display: none; }
    .figma-open-stats {
      display: grid; gap: 0.15rem; margin-bottom: 0.55rem;
      border-top: 1px solid #eee; padding-top: 0.25rem;
    }
    .figma-open-stats .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
    }
    .figma-open-stats .stats-row.cols-2 {
      grid-template-columns: 1fr 1fr 1fr;
    }
    .figma-open-stats .live-stat {
      justify-content: flex-start; padding: 0.45rem 0.2rem;
      font-size: 0.8rem;
    }
    .figma-open-stats .live-stat + .live-stat { border-left: none; }
    .elev-pace-chart {
      margin-top: 0.25rem; padding: 0.35rem 0 0.15rem;
    }
    .elev-pace-chart .chart-heads {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.62rem; font-weight: 800; letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }
    .elev-pace-chart .chart-heads .elev { color: #7cb342; }
    .elev-pace-chart .chart-heads .pace { color: #7eb6d9; }
    .elev-pace-chart svg { width: 100%; height: auto; display: block; }
    .drawer-toggle-btn {
      display: block; width: 100%; border: none; background: none; cursor: pointer;
      font-size: 0.7rem; font-weight: 700; color: var(--green-700); padding: 0.35rem;
    }
    .figma-pause-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.15rem 0; margin-bottom: 0.75rem;
    }
    .p-stat { font-size: 0.78rem; }
    .cleanup-link, .follow-hint {
      display: block; width: 100%; text-align: center; margin-top: 0.25rem; padding: 0.3rem;
      font-size: 0.72rem; font-weight: 600; color: var(--green-700); background: none; border: none; cursor: pointer;
    }
    .follow-banner {
      display: none; margin: 0 0.75rem; padding: 0.45rem 0.65rem; border-radius: 10px;
      background: rgba(255,255,255,0.95); box-shadow: 0 2px 10px rgba(0,0,0,.1);
      font-size: 0.72rem; font-weight: 600; color: var(--green-900); z-index: 22;
      position: absolute; left: 0; right: 0; top: 5.6rem;
    }
    .follow-banner.show { display: block; }
    .ico-clock::before, .ico-pin::before, .ico-elev::before,
    .ico-elev-up::before, .ico-elev-down::before, .ico-pace::before, .ico-alt::before {
      font-size: 0.8rem; opacity: 0.85;
    }
    .ico-clock::before { content: "⏱"; color: #7cb342; }
    .ico-pin::before { content: "📍"; color: #4a90c8; }
    .ico-elev::before, .ico-elev-up::before { content: "〰"; color: #7cb342; font-weight: 800; }
    .ico-elev-down::before { content: "〰"; color: #7cb342; }
    .ico-pace::before { content: "◔"; color: #4a90c8; }
    .ico-alt::before { content: "▴"; color: #0b421a; }
    .figma-field { margin-bottom: 0.65rem; }
    .figma-field-label {
      display: block; font-size: 0.8rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.3rem;
    }
    .figma-input {
      background: #eef7f0 !important; border: 1px solid #d5e6da !important; border-radius: 10px !important;
    }
    .privacy-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.55rem;
    }
    .privacy-grid label {
      display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; font-weight: 600;
      padding: 0.4rem 0.5rem; border: 1px solid #d5e6da; border-radius: 8px; background: #f7faf7;
      cursor: pointer; color: var(--green-900);
    }
    .privacy-grid input { accent-color: var(--green-700); }
    .report-fab {
      position: absolute; left: 0.75rem; bottom: 10.5rem; z-index: 28;
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
      background: #e84a3c; color: #fff; box-shadow: 0 4px 14px rgba(232,74,60,0.4);
      display: grid; place-items: center; font-size: 1.1rem; font-weight: 800;
    }
    .report-fab span { font-size: 0.55rem; font-weight: 700; position: absolute; bottom: -1.05rem; color: var(--green-900); width: 64px; text-align: center; left: 50%; transform: translateX(-50%); text-shadow: 0 0 4px #fff; }
    .plan-panel {
      display: none; background: #fff; padding: 0.75rem 1rem 1rem; border-top: 1px solid var(--border);
    }
    .plan-panel.show { display: block; }
    .plan-row { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.45rem; font-size: 0.78rem; }
    .plan-row strong { color: var(--green-900); }
    .plan-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; margin: 0.55rem 0;
    }
    .plan-stat {
      text-align: center; background: #f7faf7; border-radius: 10px; padding: 0.45rem 0.2rem;
    }
    .plan-stat .val { font-weight: 800; color: var(--green-900); font-size: 0.85rem; }
    .plan-stat .lbl { font-size: 0.62rem; color: var(--text-muted); }
    .env-modal {
      position: absolute; inset: 0; z-index: 45; display: none;
      background: rgba(0,0,0,0.35); align-items: flex-end;
    }
    .env-modal.open { display: flex; }
    .env-modal-sheet {
      background: white; border-radius: 20px 20px 0 0; padding: 1.15rem 1.2rem 1.35rem;
      width: 100%; max-height: 70%; overflow-y: auto;
    }
    .figma-photo-modal .env-modal-sheet { max-height: 92%; padding: 0; border-radius: 0; }
    .figma-photo-sheet { display: flex; flex-direction: column; min-height: 100%; }
    .figma-photo-head {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 1rem; border-bottom: 1px solid #eee;
    }
    .figma-photo-head strong { flex: 1; text-align: center; color: var(--green-900); margin-right: 2rem; }
    .figma-back {
      width: 36px; height: 36px; border: none; background: none;
      font-size: 1.5rem; color: var(--green-900); cursor: pointer;
    }
    .figma-photo-preview {
      height: 160px; background:
        linear-gradient(160deg, rgba(11,66,26,0.25), rgba(0,0,0,0.15)),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&q=80") center/cover;
      position: relative;
    }
    .figma-photo-add {
      font-size: 0.85rem; font-weight: 700; color: var(--green-900);
      padding: 0.85rem 1.1rem 0.35rem; margin: 0;
    }
    .figma-photo-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.65rem 1.1rem; border-bottom: 1px solid #eee;
      font-size: 0.85rem; color: var(--text-muted);
    }
    .figma-photo-val { color: var(--green-900); font-weight: 700; }
    .figma-icon-pick { display: flex !important; gap: 0.35rem; margin: 0 !important; }
    .figma-icon-pick button { padding: 0.35rem 0.55rem !important; font-size: 0.7rem !important; }
    .figma-photo-sheet .figma-field { padding: 0 1.1rem; }
    .figma-photo-sheet .btn { margin: 1rem 1.1rem 1.25rem; width: calc(100% - 2.2rem); }
    .figma-photo-modal.open { align-items: stretch; background: #fff; }
    .share-url {
      font-size: 0.72rem; word-break: break-all; background: #f3f4f6;
      padding: 0.55rem 0.65rem; border-radius: 8px; margin: 0.65rem 0; color: var(--green-900);
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="../get-app.html" id="backWeb"></a>
      <p style="font-size:0.8rem;opacity:0.8;margin-top:0.5rem" id="appNote"></p>
      <div id="envPillWrap" style="margin-top:0.5rem"></div>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen track-focus">
        <div class="map-shell">
          <div id="appMap"></div>
          <div class="phone-topbar">
            <a class="round-btn" href="home.html" id="trackBack" title="Back" aria-label="Back">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <div class="mode-toggle" id="modeToggle" role="group">
              <button type="button" class="active" data-mode="track" id="modeTrack">Track</button>
              <button type="button" data-mode="plan" id="modePlan">Plan</button>
            </div>
            <div class="gps-pill figma-gps">
              <span class="gps-label">GPS</span>
              <span class="dot"></span>
              <span id="gpsText"></span>
            </div>
          </div>
          <div class="follow-banner" id="followBanner"></div>
          <div class="map-controls figma-map-controls">
            <button class="ctrl" id="btnLocate" type="button" aria-label="Locate">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </button>
            <button class="ctrl" type="button" id="btnLiveShare" aria-label="Live share">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
            <button class="ctrl" type="button" id="btnLayers" aria-label="Layers">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </button>
          </div>
          <button type="button" class="report-fab" id="fabReport" aria-label="Report">!<span id="fabReportLbl"></span></button>
        </div>

        <!-- Idle Track -->
        <div class="start-bar figma-start-bar" id="idleBar">
          <button class="action-circle" type="button" id="idleReport">
            <span class="circle red" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3L2 21h20L12 3z" fill="white"/><path d="M12 10v5M12 17.5v.5" stroke="#d64545" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span id="lblReport1"></span>
          </button>
          <button class="btn-start figma-start" id="btnStart" type="button">
            <span class="figma-start-pill" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </span>
            <span id="lblStart"></span>
          </button>
          <button class="action-circle" type="button" id="btnFollow" title="Track and follow">
            <span class="circle blue" aria-hidden="true">👥</span>
            <span id="lblFollow" style="font-size:0.65rem"></span>
          </button>
        </div>

        <!-- Plan panel -->
        <div class="plan-panel" id="planPanel">
          <div class="plan-row"><span id="lblPlanStart"></span><strong id="planStartVal">—</strong></div>
          <div class="plan-row"><span id="lblPlanEnd"></span><strong id="planEndVal">—</strong></div>
          <button type="button" class="btn btn-secondary btn-block" style="margin-bottom:0.45rem;padding:0.45rem;font-size:0.8rem" id="btnAddPoi"></button>
          <div class="plan-stats">
            <div class="plan-stat"><div class="val" id="planDist">—</div><div class="lbl" id="planDistLbl"></div></div>
            <div class="plan-stat"><div class="val" id="planDur">—</div><div class="lbl" id="planDurLbl"></div></div>
            <div class="plan-stat"><div class="val" id="planGain">—</div><div class="lbl" id="planGainLbl"></div></div>
          </div>
          <p style="font-size:0.7rem;color:var(--text-muted);margin:0 0 0.5rem" id="planHint"></p>
          <button type="button" class="btn btn-primary btn-block" id="btnPlanTrack" style="padding:0.55rem;font-size:0.85rem"></button>
        </div>

        <!-- Live tracking drawer -->
        <div class="track-sheet figma-sheet hidden" id="activeSheet">
          <div class="sheet-handle" id="sheetHandle" aria-hidden="true"></div>
          <div class="track-actions figma-actions">
            <button class="action-circle" type="button" id="activeReport">
              <span class="circle red" aria-hidden="true">!</span>
              <span id="lblReport2"></span>
            </button>
            <button class="action-circle" type="button" id="btnPause">
              <span class="circle amber" aria-hidden="true">❚❚</span>
              <span id="lblPause"></span>
            </button>
            <button class="action-circle" type="button" id="btnPhoto">
              <span class="circle blue" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </span>
              <span id="lblPhoto"></span>
            </button>
          </div>
          <!-- Collapsed: Time · Distance · Elev gain -->
          <div class="figma-live-stats figma-live-stats-compact">
            <div class="live-stat"><span class="ico-clock"></span><span id="mTime">00:00:00</span></div>
            <div class="live-stat"><span class="ico-pin"></span><span id="mDist">0.00 km</span></div>
            <div class="live-stat"><span class="ico-elev-up"></span><span id="mGainCompact">0 m</span></div>
          </div>
          <!-- Open drawer (Figma): full stats + elev/pace chart — no calories -->
          <div class="drawer-extra">
            <div class="figma-open-stats">
              <div class="stats-row">
                <div class="live-stat"><span class="ico-clock"></span><span id="mTimeOpen">00:00:00</span></div>
                <div class="live-stat"><span class="ico-pin"></span><span id="mDistOpen">0.00 km</span></div>
                <div class="live-stat"><span class="ico-elev-up"></span><span id="mGain">0 m</span></div>
              </div>
              <div class="stats-row cols-2">
                <div class="live-stat"><span class="ico-pace"></span><span id="mPace">— /km</span></div>
                <div class="live-stat"><span class="ico-elev-down"></span><span id="mLoss">0 m</span></div>
                <div class="live-stat" aria-hidden="true"></div>
              </div>
            </div>
            <div class="elev-pace-chart" aria-hidden="true">
              <div class="chart-heads">
                <span class="elev" id="lblElevAxis">ELEVATION (M)</span>
                <span class="pace" id="lblPaceAxis">PACE (MIN/KM)</span>
              </div>
              <svg viewBox="0 0 320 148" role="img">
                <!-- grid -->
                <g stroke="#e8ece8" stroke-width="1">
                  <line x1="36" y1="12" x2="284" y2="12" />
                  <line x1="36" y1="36" x2="284" y2="36" />
                  <line x1="36" y1="60" x2="284" y2="60" />
                  <line x1="36" y1="84" x2="284" y2="84" />
                  <line x1="36" y1="108" x2="284" y2="108" />
                </g>
                <!-- elevation area + line -->
                <path d="M36,100 L70,88 L110,70 L150,52 L190,28 L230,42 L284,56 L284,108 L36,108 Z"
                  fill="rgba(124,179,66,0.22)" />
                <path d="M36,100 L70,88 L110,70 L150,52 L190,28 L230,42 L284,56"
                  fill="none" stroke="#7cb342" stroke-width="2.5" stroke-linejoin="round" />
                <!-- left elev axis -->
                <g fill="#9aa39a" font-size="9" font-family="system-ui,sans-serif" text-anchor="end">
                  <text x="30" y="16">1000</text>
                  <text x="30" y="40">750</text>
                  <text x="30" y="64">500</text>
                  <text x="30" y="88">250</text>
                  <text x="30" y="112">0</text>
                </g>
                <!-- right pace axis -->
                <g fill="#9aa39a" font-size="9" font-family="system-ui,sans-serif" text-anchor="start">
                  <text x="290" y="16">20</text>
                  <text x="290" y="40">15</text>
                  <text x="290" y="64">10</text>
                  <text x="290" y="88">5</text>
                  <text x="290" y="112">0</text>
                </g>
                <!-- x labels -->
                <g fill="#9aa39a" font-size="9" font-family="system-ui,sans-serif" text-anchor="middle">
                  <text x="36" y="130">0:00</text>
                  <text x="160" y="130">30:00</text>
                  <text x="284" y="130">1:00:00</text>
                </g>
              </svg>
            </div>
          </div>
          <button type="button" class="drawer-toggle-btn" id="btnExpandDrawer"></button>
          <button type="button" class="cleanup-link" id="btnCleanup"><span id="lblCleanup">Cleanup</span></button>
          <span class="sr-only" id="lTime"></span>
          <span class="sr-only" id="lDist"></span>
          <span class="sr-only" id="lPace"></span>
          <span class="sr-only" id="lGain"></span>
          <span class="sr-only" id="lLoss"></span>
          <span class="sr-only" id="mAlt">142</span>
        </div>

        <!-- Pause / Save -->

  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });

    const hikeId = "hike_" + Date.now();
    let hikeStarted = false;
    let photoType = "landscape";
    let cleanupBefore = false;
    let cleanupAfter = false;
    let drawerOpen = false;
    let mapMode = "track";
    let planStart = null;
    let planEnd = null;
    let planPois = [];
    let altitude = 142;
    let following = false;

    function refreshEnvPill() {
      const st = TW.getEnvState();
      const L = TW.getEnvLevel(st);
      document.getElementById("envPillWrap").innerHTML =
        `<span class="env-mini-pill" style="background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.35);color:#fff">🌿 L${L} · A${st.A} B${st.B} C${st.C} D${st.D} E${st.E}</span>`;
    }

    function notifyAct(result, toastKey) {
      if (!result.ok) {
        if (result.reason === "per_hike_cap") showToast(TW.t("env_toast_cap"));
        else if (result.reason === "quota_full") showToast(TW.t("env_toast_quota"));
        return false;
      }
      showToast(TW.t(toastKey));
      if (result.leveledUp) {
        setTimeout(() => showToast(TW.t("env_toast_level").replace("{n}", String(result.leveledUp))), 900);
      }
      refreshEnvPill();
      return true;
    }

    function fillPrivacyOptions(sel) {
      const map = {
        public: "app_privacy_public",
        private: "app_privacy_private",
        friends: "app_privacy_friends",
        participants: "app_privacy_participants",
      };
      Array.from(sel.options).forEach((o) => { o.text = TW.t(map[o.value] || o.value); });
    }

    function i18nUI() {
      const t = TW.t;
      document.getElementById("backWeb").textContent = t("app_back_web");
      document.getElementById("appNote").textContent = t("app_tracking_note");
      document.getElementById("gpsText").textContent = t("app_gps_ready");
      document.getElementById("modeTrack").textContent = t("app_mode_track");
      document.getElementById("modePlan").textContent = t("app_mode_plan");
      document.getElementById("lblStart").textContent = t("app_start");
      document.getElementById("lblReport1").textContent = t("app_report");
      document.getElementById("lblReport2").textContent = t("app_report");
      document.getElementById("fabReportLbl").textContent = t("app_report");
      document.getElementById("lblPause").textContent = t("app_pause");
      document.getElementById("lblPhoto").textContent = t("app_photo");
      document.getElementById("lblFollow").textContent = t("app_track_follow");
      document.getElementById("lblCleanup").textContent = t("env_act_d_short");
      document.getElementById("lblDiscard").textContent = t("app_discard");
      document.getElementById("lblResume").textContent = t("app_resume");
      document.getElementById("lblSave").textContent = t("app_save");
      document.getElementById("lTime").textContent = t("app_duration");
      document.getElementById("lDist").textContent = t("app_distance");
      document.getElementById("lPace").textContent = t("app_avg_pace");
      document.getElementById("lGain").textContent = t("app_elev_gain");
      document.getElementById("lLoss").textContent = t("app_elev_loss");
      document.getElementById("lblElevAxis").textContent = t("app_elev_axis");
      document.getElementById("lblPaceAxis").textContent = t("app_pace_axis");
      document.getElementById("btnExpandDrawer").textContent = t("app_drawer_more");
      document.getElementById("lblTitle").textContent = t("app_hike_title");
      document.getElementById("lblPrivacy").textContent = t("app_privacy");
      document.getElementById("lblPhotoPrivacy").textContent = t("app_photo_privacy");
      document.getElementById("lblPhotoPrivModal").textContent = t("app_photo_privacy");
      document.getElementById("privPublic").textContent = t("app_privacy_public");
      document.getElementById("privPrivate").textContent = t("app_privacy_private");
      document.getElementById("privFriends").textContent = t("app_privacy_friends");
      document.getElementById("privParticipants").textContent = t("app_privacy_participants");
      fillPrivacyOptions(document.getElementById("photoPrivacy"));
      fillPrivacyOptions(document.getElementById("photoPrivModal"));
      document.getElementById("lblDetails").textContent = t("app_hike_details");
      document.getElementById("hikeTitle").placeholder = t("app_title_ph");
      document.getElementById("hikeDetails").placeholder = t("app_details_ph");
      document.getElementById("reportTitle").textContent = t("app_report_while");
      document.getElementById("reportLive").textContent = t("app_report_live") + " · " + t("env_act_c_short");
      document.getElementById("reportMapHint").textContent = t("map_hint");
      document.getElementById("lblCat").textContent = t("category");
      document.getElementById("appAddPhotos").textContent = t("add_photos");
      document.getElementById("submitAppReport").textContent = t("confirm");
      const cat = document.getElementById("appCat");
      cat.options[0].text = t("cat_waste");
      cat.options[1].text = t("cat_tree");
      cat.options[2].text = t("cat_vandalism");
      cat.options[3].text = t("cat_obstruction");
      document.getElementById("lblPlanStart").textContent = t("app_plan_start");
      document.getElementById("lblPlanEnd").textContent = t("app_plan_end");
      document.getElementById("btnAddPoi").textContent = "+ " + t("app_plan_poi");
      document.getElementById("planDistLbl").textContent = t("app_distance");
      document.getElementById("planDurLbl").textContent = t("app_duration");
      document.getElementById("planGainLbl").textContent = t("app_elev_gain");
      document.getElementById("planHint").textContent = t("app_plan_set_start");
      document.getElementById("btnPlanTrack").textContent = t("app_track_follow");
      document.getElementById("followBanner").textContent = t("app_track_follow_hint");
      document.getElementById("shareTitle").textContent = t("app_live_share_title");
      document.getElementById("shareBody").textContent = t("app_live_share_body");
      document.getElementById("sharePremium").textContent = t("app_live_share_premium");
      document.getElementById("copyShare").textContent = t("app_live_share_copy");
      document.getElementById("shareUrl").textContent = location.origin + "/app/index.html?live=" + hikeId;
      twMountAppNav("track");

      document.getElementById("aTitle").textContent = t("env_start_title");
      document.getElementById("aHint").textContent = t("env_start_hint");
      document.getElementById("aLabel").textContent = t("env_act_a_label");
      document.getElementById("skipA").textContent = t("env_skip");
      document.getElementById("confirmA").textContent = t("env_continue");
      document.getElementById("eTitle").textContent = t("env_stop_title");
      document.getElementById("eHint").textContent = t("env_stop_hint");
      document.getElementById("eLabel").textContent = t("env_act_e_label");
      document.getElementById("skipE").textContent = t("env_skip");
      document.getElementById("confirmE").textContent = t("app_save");
      document.getElementById("bTitle").textContent = t("app_photo");
      document.getElementById("bHint").textContent = lang === "zh" ? "新增資訊（可選）" : "Add Info (Optional)";
      document.getElementById("ptL").textContent = t("env_photo_landscape");
      document.getElementById("ptA").textContent = t("env_photo_animal");
      document.getElementById("ptP").textContent = t("env_photo_plant");
      document.getElementById("submitB").textContent = t("app_save");
      document.getElementById("dTitle").textContent = t("env_cleanup_title");
      document.getElementById("dHint").textContent = t("env_cleanup_hint");
      document.getElementById("dBefore").textContent = t("env_cleanup_before");
      document.getElementById("dAfter").textContent = t("env_cleanup_after");
      document.getElementById("submitD").textContent = t("env_cleanup_submit");
      document.getElementById("dBackLbl").textContent = t("env_back");
    }
    i18nUI();
    refreshEnvPill();

    document.getElementById("trackBack").addEventListener("click", (e) => {
      if (history.length > 1) { e.preventDefault(); history.back(); }
    });

    const route = [
      [22.348, 114.242], [22.350, 114.248], [22.353, 114.252],
      [22.357, 114.255], [22.360, 114.258], [22.363, 114.262], [22.365, 114.268],
    ];
    const map = L.map("appMap", { zoomControl: false }).setView(route[0], 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OSM", maxZoom: 18 }).addTo(map);
    const plannedRoute = L.polyline([[22.345, 114.24], [22.355, 114.25], [22.368, 114.27]], { color: "#f5a623", weight: 2, dashArray: "6 6", opacity: 0.7 }).addTo(map);
    let pathLine = null;
    let planLine = null;
    let planMarkers = [];
    let recordedPath = [route[0]];
    let hikeStartedAt = null;
    let marker = L.circleMarker(route[0], { radius: 8, color: "#fff", weight: 3, fillColor: "#0b421a", fillOpacity: 1 }).addTo(map);

    let state = "idle";
    let seconds = 0, dist = 0, gain = 0, loss = 0, routeIdx = 0, timer = null;
    const idleBar = document.getElementById("idleBar");
    const activeSheet = document.getElementById("activeSheet");
    const pauseSheet = document.getElementById("pauseSheet");
    const planPanel = document.getElementById("planPanel");

    function showState(s) {
      state = s;
      idleBar.classList.toggle("hidden", s !== "idle" || mapMode === "plan");
      activeSheet.classList.toggle("hidden", s !== "active");
      pauseSheet.classList.toggle("hidden", s !== "paused");
      document.getElementById("gpsText").textContent =
        s === "idle" ? TW.t("app_gps_ready") : s === "active" ? TW.t("app_gps_good") : TW.t("app_gps_paused");
      document.getElementById("fabReport").style.display = (s === "idle" && mapMode === "track") ? "grid" : "none";
    }

    function setDrawer(open) {
      drawerOpen = open;
      activeSheet.classList.toggle("expanded", open);
      document.getElementById("btnExpandDrawer").textContent = TW.t(open ? "app_drawer_less" : "app_drawer_more");
    }

    function fmtTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return h + ":" + m + ":" + s;
    }
    function paceStr() {
      if (dist < 0.1) return "— /km";
      const minPerKm = seconds / 60 / dist;
      const m = Math.floor(minPerKm);
      const s = Math.round((minPerKm - m) * 60);
      return m + ":" + String(s).padStart(2, "0") + " /km";
    }
    function tick() {
      seconds += 1;
      dist += 0.012 + Math.random() * 0.008;
      const elevDelta = (Math.random() - 0.45) * 8;
      if (elevDelta > 0) gain += elevDelta; else loss += -elevDelta;
      altitude = Math.max(20, Math.round(altitude + elevDelta * 0.4));
      if (routeIdx < route.length - 1 && seconds % 8 === 0) {
        routeIdx++;
        recordedPath = route.slice(0, routeIdx + 1);
        if (pathLine) map.removeLayer(pathLine);
        pathLine = L.polyline(recordedPath, { color: "#2563eb", weight: 5 }).addTo(map);
        marker.setLatLng(route[routeIdx]);
        map.panTo(route[routeIdx]);
      }
      const tStr = fmtTime(seconds);
      const dStr = dist.toFixed(2) + " km";
      const gStr = Math.round(gain) + " m";
      document.getElementById("mTime").textContent = tStr;
      document.getElementById("mDist").textContent = dStr;
      document.getElementById("mGainCompact").textContent = gStr;
      document.getElementById("mTimeOpen").textContent = tStr;
      document.getElementById("mDistOpen").textContent = dStr;
      document.getElementById("mGain").textContent = gStr;
      document.getElementById("mLoss").textContent = Math.round(loss) + " m";
      document.getElementById("mPace").textContent = paceStr();
      document.getElementById("mAlt").textContent = altitude + " m";
    }

    function beginTracking() {
      hikeStarted = true;
      hikeStartedAt = new Date().toISOString();
      recordedPath = [route[0]];
      setDrawer(false);
      showState("active");
      if (!timer) timer = setInterval(tick, 1000);
      if (!pathLine) pathLine = L.polyline([route[0]], { color: "#2563eb", weight: 5 }).addTo(map);
      showToast(lang === "zh" ? "已開始追蹤" : "Tracking started");
    }

    function finishSave() {
      clearInterval(timer); timer = null;
      const titleInput = document.getElementById("hikeTitle").value.trim();
      const privacy = (document.querySelector('input[name="privacy"]:checked') || {}).value || "public";
      const photoPriv = document.getElementById("photoPrivacy").value;
      const saved = TW.saveHike({
        id: hikeId,
        title: titleInput || TW.t("hikes_untitled"),
        titleZh: titleInput || TW.t("hikes_untitled"),
        seconds,
        distanceKm: dist,
        elevGain: gain,
        elevLoss: loss,
        calories: TW.estimateCalories(seconds, dist, gain),
        pace: paceStr(),
        privacy,
        photoPrivacy: photoPriv,
        path: recordedPath.length > 1 ? recordedPath : route.slice(0, Math.max(2, routeIdx + 1)),
        startedAt: hikeStartedAt || new Date().toISOString(),
        endedAt: new Date().toISOString(),
      });
      showToast(TW.t("toast_saved") + " · " + TW.t("app_privacy_" + privacy));
      setTimeout(() => (location.href = "hike-detail.html?id=" + encodeURIComponent(saved.id)), 800);
    }

    function setMapMode(mode) {
      mapMode = mode;
      document.querySelectorAll("#modeToggle button").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
      planPanel.classList.toggle("show", mode === "plan");
      if (mode === "plan") {
        idleBar.classList.add("hidden");
        activeSheet.classList.add("hidden");
        pauseSheet.classList.add("hidden");
        document.getElementById("fabReport").style.display = "none";
        document.getElementById("planHint").textContent = TW.t("app_plan_set_start");
      } else {
        showState(state === "active" || state === "paused" ? state : "idle");
      }
    }

    document.getElementById("modeToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      if (state === "active" || state === "paused") {
        showToast(lang === "zh" ? "請先結束追蹤" : "End tracking first");
        return;
      }
      setMapMode(btn.dataset.mode);
    });

    map.on("click", (e) => {
      if (mapMode !== "plan") return;
      if (!planStart) {
        planStart = e.latlng;
        planMarkers.push(L.circleMarker(e.latlng, { radius: 7, color: "#fff", weight: 2, fillColor: "#2d8a45", fillOpacity: 1 }).addTo(map));
        document.getElementById("planStartVal").textContent = e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
        document.getElementById("planHint").textContent = TW.t("app_plan_set_end");
      } else if (!planEnd) {
        planEnd = e.latlng;
        planMarkers.push(L.circleMarker(e.latlng, { radius: 7, color: "#fff", weight: 2, fillColor: "#d64545", fillOpacity: 1 }).addTo(map));
        document.getElementById("planEndVal").textContent = e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
        if (planLine) map.removeLayer(planLine);
        planLine = L.polyline([planStart, ...planPois, planEnd], { color: "#2563eb", weight: 4 }).addTo(map);
        document.getElementById("planDist").textContent = "6.2 km";
        document.getElementById("planDur").textContent = "2h 10m";
        document.getElementById("planGain").textContent = "380 m";
        document.getElementById("planHint").textContent = TW.t("app_plan_done");
      }
    });

    document.getElementById("btnAddPoi").addEventListener("click", () => {
      if (!planStart || !planEnd) {
        showToast(TW.t("app_plan_set_start"));
        return;
      }
      const mid = L.latLng(
        (planStart.lat + planEnd.lat) / 2 + 0.004,
        (planStart.lng + planEnd.lng) / 2
      );
      planPois.push(mid);
      planMarkers.push(L.circleMarker(mid, { radius: 6, color: "#fff", weight: 2, fillColor: "#f5a623", fillOpacity: 1 }).addTo(map));
      if (planLine) map.removeLayer(planLine);
      planLine = L.polyline([planStart, ...planPois, planEnd], { color: "#2563eb", weight: 4 }).addTo(map);
      document.getElementById("planDist").textContent = "6.8 km";
      showToast("+ POI");
    });

    document.getElementById("btnPlanTrack").addEventListener("click", () => {
      following = true;
      document.getElementById("followBanner").classList.add("show");
      setMapMode("track");
      showToast(TW.t("app_track_follow"));
    });

    document.getElementById("btnFollow").addEventListener("click", () => {
      following = !following;
      document.getElementById("followBanner").classList.toggle("show", following);
      showToast(TW.t("app_track_follow_hint"));
    });

    function doPause() {
      clearInterval(timer); timer = null;
      document.getElementById("pTime").textContent = fmtTime(seconds);
      document.getElementById("pDist").textContent = dist.toFixed(2) + " km";
      document.getElementById("pAlt").textContent = altitude + " m";
      document.getElementById("pPace").textContent = paceStr();
      document.getElementById("pGain").textContent = Math.round(gain) + " m";
      document.getElementById("pLoss").textContent = Math.round(loss) + " m";
      showState("paused");
    }

    document.getElementById("btnStart").addEventListener("click", () => {
      document.getElementById("checkA").checked = false;
      document.getElementById("modalA").classList.add("open");
    });
    document.getElementById("confirmA").addEventListener("click", () => {
      document.getElementById("modalA").classList.remove("open");
      if (document.getElementById("checkA").checked) notifyAct(TW.recordEnvAct("A", { hikeId }), "env_toast_a");
      beginTracking();
    });
    document.getElementById("skipA").addEventListener("click", () => {
      document.getElementById("modalA").classList.remove("open");
      beginTracking();
    });

    document.getElementById("btnPause").addEventListener("click", doPause);
    document.getElementById("sheetHandle").addEventListener("click", () => setDrawer(!drawerOpen));
    document.getElementById("btnExpandDrawer").addEventListener("click", () => setDrawer(!drawerOpen));

    document.getElementById("btnResume").addEventListener("click", () => {
      showState("active");
      if (!timer) timer = setInterval(tick, 1000);
    });
    document.getElementById("btnDiscard").addEventListener("click", () => {
      clearInterval(timer); timer = null;
      seconds = dist = gain = loss = routeIdx = 0;
      altitude = 142;
      hikeStarted = false;
      if (pathLine) { map.removeLayer(pathLine); pathLine = null; }
      marker.setLatLng(route[0]);
      showState("idle");
      showToast(lang === "zh" ? "已捨棄行程" : "Hike discarded");
    });
    document.getElementById("btnSave").addEventListener("click", () => {
      document.getElementById("checkE").checked = false;
      document.getElementById("modalE").classList.add("open");
    });
    document.getElementById("confirmE").addEventListener("click", () => {
      document.getElementById("modalE").classList.remove("open");
      if (document.getElementById("checkE").checked) notifyAct(TW.recordEnvAct("E", { hikeId }), "env_toast_e");
      finishSave();
    });
    document.getElementById("skipE").addEventListener("click", () => {
      document.getElementById("modalE").classList.remove("open");
      finishSave();
    });

    document.getElementById("btnPhoto").addEventListener("click", () => {
      if (state !== "active") {
        showToast(lang === "zh" ? "請在追蹤中拍攝" : "Take photos during active tracking");
        return;
      }
      document.getElementById("modalB").classList.add("open");
    });
    document.querySelectorAll(".photo-type-grid button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".photo-type-grid button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        photoType = btn.dataset.ptype;
      });
    });
    document.getElementById("closeB").addEventListener("click", () => document.getElementById("modalB").classList.remove("open"));
    document.getElementById("submitB").addEventListener("click", () => {
      const result = TW.recordEnvAct("B", {
        hikeId, duringTrack: state === "active", photoType: "nature_" + photoType, note: photoType,
      });
      document.getElementById("modalB").classList.remove("open");
      notifyAct(result, "env_toast_b");
    });

    function updateCleanupSubmit() {
      document.getElementById("submitD").disabled = !(cleanupBefore || cleanupAfter);
    }
    document.getElementById("btnCleanup").addEventListener("click", () => {
      cleanupBefore = cleanupAfter = false;
      document.getElementById("slotBefore").classList.remove("filled");
      document.getElementById("slotAfter").classList.remove("filled");
      updateCleanupSubmit();
      document.getElementById("modalD").classList.add("open");
    });
    document.getElementById("slotBefore").addEventListener("click", () => {
      cleanupBefore = true; document.getElementById("slotBefore").classList.add("filled"); updateCleanupSubmit();
    });
    document.getElementById("slotAfter").addEventListener("click", () => {
      cleanupAfter = true; document.getElementById("slotAfter").classList.add("filled"); updateCleanupSubmit();
    });
    document.getElementById("closeD").addEventListener("click", () => document.getElementById("modalD").classList.remove("open"));
    document.getElementById("backD").addEventListener("click", () => document.getElementById("modalD").classList.remove("open"));
    document.getElementById("submitD").addEventListener("click", () => {
      const n = (cleanupBefore ? 1 : 0) + (cleanupAfter ? 1 : 0);
      const result = TW.recordEnvAct("D", { hikeId, photoCount: n, photoType: "cleanup", note: (cleanupBefore ? "before" : "") + (cleanupAfter ? "+after" : "") });
      document.getElementById("modalD").classList.remove("open");
      notifyAct(result, "env_toast_d");
    });

    document.getElementById("btnLocate").addEventListener("click", () => {
      map.setView(route[Math.min(routeIdx, route.length - 1)], 14);
    });

    document.getElementById("btnLiveShare").addEventListener("click", () => {
      document.getElementById("modalShare").classList.add("open");
    });
    document.getElementById("closeShare").addEventListener("click", () => document.getElementById("modalShare").classList.remove("open"));
    document.getElementById("copyShare").addEventListener("click", () => {
      const url = document.getElementById("shareUrl").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).catch(() => {});
      }
      document.getElementById("modalShare").classList.remove("open");
      showToast(TW.t("app_live_share_copied"));
    });

    let reportMap, reportMarker;
    const reportSheet = document.getElementById("reportSheet");
    function openReport() {
      const pos = marker.getLatLng();
      document.getElementById("liveCoords").textContent = "📍 " + pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6);
      reportSheet.classList.add("open");
      setTimeout(() => {
        if (!reportMap) {
          reportMap = L.map("reportMiniMap", { zoomControl: false }).setView(pos, 15);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(reportMap);
          reportMarker = L.marker(pos, { draggable: true }).addTo(reportMap);
          reportMarker.on("dragend", () => {
            const p = reportMarker.getLatLng();
            document.getElementById("liveCoords").textContent = "📍 " + p.lat.toFixed(6) + ", " + p.lng.toFixed(6);
          });
          reportMap.on("click", (e) => {
            reportMarker.setLatLng(e.latlng);
            document.getElementById("liveCoords").textContent = "📍 " + e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6);
          });
        } else {
          reportMap.setView(pos, 15);
          reportMarker.setLatLng(pos);
          reportMap.invalidateSize();
        }
        reportMap.invalidateSize();
      }, 60);
    }
    document.getElementById("idleReport").addEventListener("click", openReport);
    document.getElementById("activeReport").addEventListener("click", openReport);
    document.getElementById("fabReport").addEventListener("click", openReport);
    document.getElementById("closeAppReport").addEventListener("click", () => reportSheet.classList.remove("open"));
    document.getElementById("submitAppReport").addEventListener("click", () => {
      reportSheet.classList.remove("open");
      const result = TW.recordEnvAct("C", { hikeId, note: "incident" });
      if (result.ok) {
        showToast(TW.t("env_toast_c") + " · " + TW.t("toast_report"));
        if (result.leveledUp) setTimeout(() => showToast(TW.t("env_toast_level").replace("{n}", String(result.leveledUp))), 900);
        refreshEnvPill();
      } else showToast(TW.t("toast_report"));
    });
    document.getElementById("appAddPhotos").addEventListener("click", () => showToast("📷"));

    const params = new URLSearchParams(location.search);
    const trailId = params.get("trail");
    if (trailId) {
      const trail = TW.trails.find((x) => x.id === trailId);
      if (trail) document.getElementById("hikeTitle").value = TW.tt(trail, "title");
    }
    if (params.get("mode") === "plan") setMapMode("plan");
    if (params.get("follow") === "1") {
      following = true;
      document.getElementById("followBanner").classList.add("show");
    }
  </script>
</body>
</html>
