<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1.25rem; background: #f7faf7; min-height: 0; }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .app-detail-bar h1 {
      flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
      flex-shrink: 0;
    }
    .info-content { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0.85rem 0.9rem; }
    .info-content h2 { font-size: 0.95rem; color: var(--green-900); margin: 1rem 0 0.45rem; }
    .info-content h2:first-child { margin-top: 0; }
    .info-content p, .info-content li { font-size: 0.82rem; line-height: 1.55; color: var(--text); }
    .info-content .about-motto { font-size: 1rem; font-weight: 700; color: var(--green-800); margin: 0 0 0.75rem; }
    .faq-list { display: grid; gap: 0.45rem; }
    .faq-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .faq-summary {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      padding: 0.65rem 0.75rem; cursor: pointer; list-style: none; font-weight: 700;
      font-size: 0.82rem; color: var(--green-900);
    }
    .faq-summary::-webkit-details-marker { display: none; }
    .faq-answer { padding: 0 0.75rem 0.75rem; font-size: 0.8rem; line-height: 1.55; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="profile.html#settings" id="backInline">‹</a>
          <h1 id="pageTitle">—</h1>
          <span class="ib" aria-hidden="true"></span>
        </div>
        <div class="phone-body">
          <div class="info-content" id="infoContent"></div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    const zh = lang === "zh";
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    twMountAppNav("profile");

    const page = new URLSearchParams(location.search).get("page") || "about";
    const titles = {
      about: t("about_title"),
      faq: t("footer_faq"),
      "map-credits": t("footer_map_credits"),
      terms: t("footer_terms"),
      privacy: t("footer_privacy"),
    };
    const title = titles[page] || t("app_more");
    document.title = "TrailWatch App — " + title;
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("backWeb").textContent = "‹ " + t("app_settings");
    document.getElementById("backInline").href = "profile.html#settings";

    function faqEsc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatFaqAnswer(raw) {
      const text = String(raw || "").trim();
      if (!text) return "";
      const linkify = (s) =>
        faqEsc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return text
        .split(/\n\n+/)
        .map((block) => {
          const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every((l) => /^[•\-–—]/.test(l))) {
            return "<ul>" + lines.map((l) => "<li>" + linkify(l.replace(/^[•\-–—]\s*/, "")) + "</li>").join("") + "</ul>";
          }
          return "<p>" + linkify(block).replace(/\n/g, "<br>") + "</p>";
        })
        .join("");
    }

    function loadLegalPage(file, kind) {
      fetch("../" + file)
        .then((r) => r.text())
        .then((html) => {
          const doc = new DOMParser().parseFromString(html, "text/html");
          const prose = doc.querySelector('.legal-prose[data-legal="' + kind + '"]') || doc.querySelector(".legal-prose");
          el.innerHTML = prose ? prose.innerHTML : `<p>${faqEsc(title)}</p>`;
          el.className = "info-content legal-prose";
          el.setAttribute("data-legal", kind);
          if (typeof TW.applyCmsCopy === "function") TW.applyCmsCopy();
        })
        .catch(() => {
          el.innerHTML = `<p>${faqEsc(title)}</p>`;
        });
    }

    const el = document.getElementById("infoContent");
    if (page === "about") {
      el.innerHTML =
        `<h2 class="about-motto">${faqEsc(t("about_motto"))}</h2>` +
        [t("about_p1"), t("about_p2"), t("about_p3"), t("about_p4")]
          .map((p) => `<p>${faqEsc(p)}</p>`)
          .join("") +
        `<h2>${faqEsc(t("contact_title"))}</h2>` +
        (() => {
          const c = typeof TW.getSiteContent === "function" ? TW.getSiteContent() : {};
          const email = c.contactEmail || "info@trailwatch.hk";
          const phone = c.contactPhone || "+852 8100 3888";
          const addr = zh ? c.contactAddressZh || c.contactAddressEn : c.contactAddressEn || c.contactAddressZh;
          return `<p><strong>${faqEsc(t("contact_email_label"))}</strong>: <a href="mailto:${faqEsc(email)}">${faqEsc(email)}</a></p>
            <p><strong>${faqEsc(t("contact_phone_label"))}</strong>: ${faqEsc(phone)}</p>
            <p><strong>${faqEsc(t("contact_address_label"))}</strong>: ${faqEsc(addr || "")}</p>`;
        })();
    } else if (page === "faq") {
      const items = typeof TW.getFaqItems === "function" ? TW.getFaqItems() : [];
      el.innerHTML =
        `<div class="faq-list">` +
        items.map((it) => {
          const q = zh ? it.qZh || it.qEn : it.qEn || it.qZh;
          const a = zh ? it.aZh || it.aEn : it.aEn || it.aZh;
          if (!q) return "";
          return `<details class="faq-item">
            <summary class="faq-summary"><span>${faqEsc(q)}</span><span>›</span></summary>
            <div class="faq-answer">${formatFaqAnswer(a)}</div>
          </details>`;
        }).join("") +
        `</div>`;
    } else if (page === "map-credits") {
      loadLegalPage("map-credits.html", "mapCredits");
    } else if (page === "terms") {
      loadLegalPage("terms.html", "terms");
    } else if (page === "privacy") {
      loadLegalPage("privacy.html", "privacy");
    } else {
      location.href = "profile.html#settings";
    }
  </script>
</body>
</html>
