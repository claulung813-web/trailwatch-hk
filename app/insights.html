<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Insights</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head { padding: 2.4rem 0.9rem 0.65rem; background: #fff; border-bottom: 1px solid var(--border); text-align: center; }
    .app-head h1 { font-size: 1.05rem; color: var(--green-900); margin: 0; }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.85rem; margin-bottom: 0.65rem;
    }
    .card h3 { margin: 0 0 0.35rem; font-size: 0.85rem; color: var(--green-900); }
    .card p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }
    .lock-overlay {
      position: relative; filter: blur(1.5px); opacity: 0.7; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-head"><h1 id="pageTitle"></h1></div>
        <div class="phone-body">
          <div class="card">
            <h3 id="basicTitle"></h3>
            <p id="basicBody"></p>
          </div>
          <div class="card" style="position:relative">
            <div class="lock-overlay">
              <h3 id="detailTitle"></h3>
              <p id="detailBody"></p>
              <div style="height:80px;margin-top:0.5rem;border-radius:8px;background:linear-gradient(90deg,#d1fae5,#a7f3d0,#6ee7b7)"></div>
            </div>
            <div style="position:absolute;inset:0;display:grid;place-items:center">
              <button type="button" class="btn btn-primary" id="upgradeBtn" style="padding:0.45rem 0.9rem;font-size:0.8rem"></button>
            </div>
          </div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("app_profile");
    document.getElementById("pageTitle").textContent = t("app_insights");
    document.getElementById("basicTitle").textContent = lang === "zh" ? "本月概覽（免費）" : "This month (free)";
    document.getElementById("basicBody").textContent = lang === "zh" ? "12.4 km · 4 次記錄 · 2 次舉報" : "12.4 km · 4 records · 2 reports";
    document.getElementById("detailTitle").textContent = t("app_detailed_insights");
    document.getElementById("detailBody").textContent = lang === "zh" ? "配速趨勢、區域熱點與年度比較" : "Pace trends, district heatmaps & yearly compare";
    document.getElementById("upgradeBtn").textContent = t("app_upgrade");
    twMountAppNav("profile");
    document.getElementById("upgradeBtn").addEventListener("click", () => showToast(t("app_free_trial")));
  </script>
</body>
</html>
