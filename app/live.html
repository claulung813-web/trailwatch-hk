<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch — Live location</title>
  <meta http-equiv="refresh" content="0;url=../live.html" />
  <script>
    (function () {
      var q = location.search || "";
      location.replace("../live.html" + q);
    })();
  </script>
</head>
<body>
  <p><a id="fallback" href="../live.html">Open live location on website</a></p>
  <script>
    document.getElementById("fallback").href = "../live.html" + (location.search || "");
  </script>
</body>
</html>
