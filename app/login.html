<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body {
      flex: 1; overflow-y: auto; background: #f7faf7; min-height: 0;
      padding: 0.85rem 0.95rem calc(1rem + env(safe-area-inset-bottom, 0px));
    }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .app-detail-bar h1 {
      flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111;
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
      flex-shrink: 0;
    }
    .auth-card {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem 0.95rem 1.15rem;
    }
    .auth-card .page-title { font-size: 1.2rem; margin: 0 0 0.35rem; }
    .auth-card .page-sub { font-size: 0.8rem; margin: 0 0 0.85rem; color: var(--text-muted); }
    .auth-switch { text-align: center; font-size: 0.8rem; margin: 0.85rem 0 0; }
    .auth-switch a { font-weight: 700; color: var(--green-800); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="profile.html">‹</a>
          <h1 id="barTitle">Log in</h1>
          <span class="ib" aria-hidden="true"></span>
        </div>
        <div class="phone-body">
          <div class="auth-card">
            <h1 class="page-title" id="loginTitle"></h1>
            <p class="page-sub" id="loginSub"></p>
            <form id="loginForm">
              <div class="form-group">
                <label for="loginEmail" id="loginEmailLabel"></label>
                <input class="form-input" id="loginEmail" name="email" type="email" required autocomplete="email" />
              </div>
              <div class="form-group">
                <label for="loginPassword" id="loginPasswordLabel"></label>
                <input class="form-input" id="loginPassword" name="password" type="password" required autocomplete="current-password" />
              </div>
              <p style="margin:-0.25rem 0 0.75rem;text-align:right">
                <a href="forgot-password.html" id="loginForgot" style="font-size:0.78rem;font-weight:700;color:var(--green-800)"></a>
              </p>
              <button type="submit" class="btn btn-primary btn-block" id="loginCta"></button>
              <p style="font-size:0.72rem;color:var(--text-muted);margin:0.65rem 0 0;text-align:center" id="loginNote"></p>
              <p class="auth-switch">
                <span id="loginNoAccount"></span>
                <a href="register.html" id="loginRegisterLink"></a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("app_profile");
    document.getElementById("barTitle").textContent = t("nav_login");
    document.getElementById("loginTitle").textContent = t("login_title");
    document.getElementById("loginSub").textContent = t("login_sub");
    document.getElementById("loginEmailLabel").textContent = t("login_email");
    document.getElementById("loginPasswordLabel").textContent = t("login_password");
    const forgotLabel = t("login_forgot");
    document.getElementById("loginForgot").textContent = forgotLabel === "login_forgot" ? (lang === "zh" ? "忘記密碼？" : "Forgot password?") : forgotLabel;
    document.getElementById("loginCta").textContent = t("login_cta");
    document.getElementById("loginNote").textContent = t("login_note");
    document.getElementById("loginNoAccount").textContent = t("login_no_account");
    document.getElementById("loginRegisterLink").textContent = t("nav_signup");
    document.getElementById("loginEmail").placeholder = t("login_email_placeholder");
    document.getElementById("loginPassword").placeholder = t("login_password_placeholder");

    const nextParam = new URLSearchParams(location.search).get("next");
    if (nextParam) {
      document.getElementById("loginRegisterLink").href = "register.html?next=" + encodeURIComponent(nextParam);
      document.getElementById("loginForgot").href = "forgot-password.html?next=" + encodeURIComponent(nextParam);
    }

    function resolveLoginName(email) {
      const e = (email || "").trim().toLowerCase();
      try {
        const store = CMS.getStore();
        const fromUsers = (store.users || []).find((u) => String(u.email || "").toLowerCase() === e);
        if (fromUsers && fromUsers.name) return fromUsers.name;
        const fromMembers = (store.members || []).find((m) => String(m.email || "").toLowerCase() === e);
        if (fromMembers && fromMembers.name) return fromMembers.name;
      } catch (err) {}
      if (TW.user && TW.user.email && String(TW.user.email).toLowerCase() === e) return TW.user.name || "";
      return e.split("@")[0] || t("nav_member");
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const name = resolveLoginName(email);
      if (typeof CMS !== "undefined" && CMS.recordAuthEvent) {
        CMS.recordAuthEvent({ type: "login", email: email, name: name, password: password, source: "app" });
      }
      TW.loginMember({ name: name, email: email });
      showToast(t("login_thanks"));
      const dest = typeof TW.authNextUrl === "function" ? TW.authNextUrl("profile.html") : "profile.html";
      setTimeout(() => { location.href = dest; }, 700);
    });
  </script>
</body>
</html>
