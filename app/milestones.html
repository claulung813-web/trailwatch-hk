<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Milestones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; }
    .app-head { padding: 2.4rem 0.9rem 0.65rem; background: #fff; border-bottom: 1px solid var(--border); text-align: center; }
    .app-head h1 { font-size: 1.05rem; color: var(--green-900); margin: 0; }
    .badge-item {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem; margin-bottom: 0.5rem; display: flex; gap: 0.65rem; align-items: center; cursor: pointer;
    }
    .badge-item.locked { opacity: 0.45; filter: grayscale(1); }
    .badge-item strong { display: block; color: var(--green-900); font-size: 0.85rem; }
    .badge-item span { font-size: 0.7rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-head"><h1 id="pageTitle"></h1></div>
        <div class="phone-body" id="list"></div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("app_profile");
    document.getElementById("pageTitle").textContent = t("app_milestones");
    twMountAppNav("profile");
    const items = [
      { ico: "🥾", title: lang === "zh" ? "首 10 km" : "First 10 km", crit: lang === "zh" ? "累積行山 10 km" : "Log 10 km total", locked: false },
      { ico: "⛰", title: lang === "zh" ? "高峰挑戰" : "Peak challenge", crit: lang === "zh" ? "完成一座 800m+ 山峰" : "Complete an 800m+ peak", locked: false },
      { ico: "🌿", title: lang === "zh" ? "生態打卡 ×5" : "Nature check-ins ×5", crit: lang === "zh" ? "完成 5 次 Act B" : "Complete 5 Act B photos", locked: true },
      { ico: "🧹", title: lang === "zh" ? "清潔英雄" : "Cleanup hero", crit: lang === "zh" ? "完成 3 次清潔" : "Complete 3 cleanups", locked: true },
    ];
    document.getElementById("list").innerHTML = `
      <p style="font-size:0.72rem;font-weight:700;color:var(--green-800)">${t("app_badge_hiking")} / ${t("app_badge_env")}</p>` +
      items.map((b) => `
        <div class="badge-item ${b.locked ? "locked" : ""}" data-c="${b.crit}">
          <span style="font-size:1.4rem">${b.ico}</span>
          <div><strong>${b.title}</strong><span>${b.crit}</span></div>
        </div>`).join("");
    document.getElementById("list").addEventListener("click", (e) => {
      const el = e.target.closest(".badge-item");
      if (el) showToast(el.dataset.c);
    });
  </script>
</body>
</html>
