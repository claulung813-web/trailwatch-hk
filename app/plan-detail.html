<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/styles.css?v=20260830a" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; background: #f3f4f6; min-height: 0; padding-bottom: 0.5rem; }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-detail-bar h1 {
      flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
      flex-shrink: 0;
    }
    .route-detail-content { padding: 0.75rem 0.85rem 0.25rem; }
    .route-share-map { height: 200px; border-radius: 12px; margin-bottom: 0.75rem; border: 1px solid var(--border); }
    .route-share-story { font-size: 0.82rem; line-height: 1.55; margin: 0 0 0.65rem; white-space: pre-wrap; }
    .plan-meta { font-size: 0.72rem; color: var(--text-muted); margin: 0 0 0.75rem; }
    .route-share-block { margin-bottom: 1rem; }
    .route-share-block h2 { font-size: 0.88rem; color: var(--green-900); margin: 0 0 0.55rem; }
    .route-share-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
    .route-share-stats div { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.35rem; text-align: center; }
    .route-share-stats strong { display: block; font-size: 0.92rem; }
    .route-share-stats span { font-size: 0.62rem; color: var(--text-muted); }
    .route-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem;
      padding: 0.65rem 0.85rem calc(0.85rem + env(safe-area-inset-bottom, 0px));
      background: #fff; border-top: 1px solid var(--border);
    }
    .route-actions .btn-block.full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="profile.html#profile&type=plans" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="profile.html#profile&type=plans" id="backInline">‹</a>
          <h1 id="planTitle">—</h1>
          <span class="ib" aria-hidden="true"></span>
        </div>
        <div class="phone-body">
          <div class="route-detail-content">
            <div id="planMap" class="route-share-map"></div>
            <p class="plan-meta" id="planMeta"></p>
            <p class="route-share-story" id="planDesc"></p>
            <section class="route-share-block">
              <h2 id="lblPlanData"></h2>
              <div class="route-share-stats" id="planStats"></div>
            </section>
          </div>
          <div class="route-actions">
            <a class="btn btn-secondary btn-block full" id="btnEditPlan" href="#"></a>
            <a class="btn btn-primary btn-block full" id="btnFollow" href="#"></a>
          </div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("nav_my_plans");
    document.getElementById("lblPlanData").textContent = t("rec_planned_data");
    twMountAppNav("profile");

    const id = new URLSearchParams(location.search).get("id");
    const draft = id && TW.getRouteDraft ? TW.getRouteDraft(id) : null;
    if (!draft) {
      location.href = "profile.html#profile&type=plans";
    } else {
      const title = TW.tt(draft, "name") || draft.name || (lang === "zh" ? "我的規劃路線" : "My planned route");
      document.getElementById("planTitle").textContent = title;
      document.getElementById("planDesc").textContent = draft.notes || draft.description || "";
      const priv = draft.privacy || "private";
      document.getElementById("planMeta").textContent = t("app_privacy") + ": " + t("app_privacy_" + priv);

      const path = (draft.path || []).map((p) => [Number(p[0]), Number(p[1])]);
      const km = TW.pathDistanceKm(path);
      const gainEst = (TW.estimateElevFallback(km) || {}).gain || 0;
      const hrs = TW.estimateDurationHours(km, gainEst);
      document.getElementById("planStats").innerHTML = [
        [hrs ? TW.formatHours(hrs) : "—", t("rec_duration_lbl")],
        [km ? km.toFixed(2) + " km" : "—", t("rec_distance_km")],
        [km ? Math.round(gainEst) + " m" : "—", t("rec_elev_changes")],
      ].map((s) => `<div><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("");

      document.getElementById("btnEditPlan").textContent = t("plan_edit_draft");
      document.getElementById("btnEditPlan").href = "index.html?mode=plan&draft=" + encodeURIComponent(draft.id);
      document.getElementById("btnFollow").textContent = t("app_track_follow");
      document.getElementById("btnFollow").href = "index.html?follow=plan&draft=" + encodeURIComponent(draft.id);

      if (path.length >= 2) {
        const map = L.map("planMap", { zoomControl: false }).setView(path[0], 13);
        TW.addMapTiles(map, { maxZoom: 18 });
        const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
        if (typeof TW.addRouteEndpoints === "function") TW.addRouteEndpoints(map, path);
        setTimeout(() => { map.invalidateSize(); map.fitBounds(line.getBounds().pad(0.18)); }, 80);
      }
    }
  </script>
</body>
</html>
