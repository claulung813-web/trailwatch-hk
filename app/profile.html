<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1rem; background: #f7faf7; min-height: 0; }
    .app-head {
      padding: 2.45rem 0.9rem 0.65rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .profile-hero-row {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .profile-avatar-app {
      width: 56px; height: 56px; border-radius: 50%; background: var(--green-100);
      overflow: hidden; flex-shrink: 0;
    }
    .profile-hero-main { flex: 1; min-width: 0; }
    .profile-hero-main h1 {
      font-size: 1.05rem; color: var(--green-900); margin: 0 0 0.35rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-hero-actions {
      display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0;
    }
    .profile-icon-btn {
      position: relative; width: 2.35rem; height: 2.35rem; border-radius: 999px;
      border: 1px solid var(--border); background: #fff; color: var(--green-800);
      display: grid; place-items: center; cursor: pointer; padding: 0;
    }
    .profile-icon-btn.active { background: var(--green-50); border-color: var(--green-300); }
    .profile-notif-dot {
      position: absolute; top: 0.35rem; right: 0.38rem; width: 7px; height: 7px;
      border-radius: 50%; background: #e84a3c; border: 1.5px solid #fff;
    }
    .profile-premium-btn {
      font-size: 0.72rem; padding: 0.28rem 0.65rem; display: inline-block;
    }
    .profile-badge-strip {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem 0.85rem; margin-bottom: 0.75rem;
    }
    .profile-badge-strip-label {
      font-size: 0.65rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.35rem;
    }
    .profile-badge-strip-row {
      display: flex; align-items: center; gap: 0.55rem;
    }
    .profile-badge-strip-row strong {
      flex: 1; min-width: 0; color: var(--green-900); font-size: 0.9rem;
      display: flex; align-items: center;
    }
    .profile-preview-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; margin: 0.85rem 0 0.45rem;
    }
    .profile-preview-head h2 {
      font-size: 0.82rem; font-weight: 800; color: var(--green-900); margin: 0;
    }
    .profile-preview-head a {
      font-size: 0.72rem; font-weight: 700; color: var(--green-800); text-decoration: none;
    }
    .profile-preview-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem;
      margin-bottom: 0.65rem;
    }
    .profile-preview-tile {
      display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
    }
    .profile-preview-tile img, .profile-preview-thumb {
      width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block;
    }
    .profile-preview-thumb {
      background: linear-gradient(135deg, #c8e6c9, #81c784);
      display: grid; place-items: center; font-size: 1.35rem;
    }
    .profile-preview-tile-body { padding: 0.45rem 0.55rem 0.55rem; }
    .profile-preview-tile-body strong {
      display: block; font-size: 0.75rem; color: var(--green-900);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .profile-preview-tile-body .meta {
      display: block; font-size: 0.62rem; color: var(--text-muted); margin-top: 0.12rem;
    }
    .profile-preview-empty, .profile-friends-list {
      list-style: none; padding: 0; margin: 0 0 0.65rem;
    }
    .profile-preview-empty {
      font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.85rem 0;
    }
    .profile-friend-row {
      display: flex; align-items: center; gap: 0.55rem; background: #fff;
      border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.65rem;
      margin-bottom: 0.35rem;
    }
    .profile-friend-name { font-size: 0.8rem; font-weight: 700; color: var(--green-900); }
    .hub-tabs {
      display: flex; gap: 0.3rem; padding: 0.45rem 0.65rem; background: #fff;
      border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .hub-tabs button {
      border: none; border-radius: 999px; padding: 0.38rem 0.7rem; white-space: nowrap;
      font-size: 0.72rem; font-weight: 700; background: var(--green-50); color: var(--green-900); cursor: pointer;
    }
    .hub-tabs button.active { background: var(--green-900); color: #fff; }
    .hub-tabs button .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e84a3c;
      margin-left: 0.25rem; vertical-align: middle;
    }
    .life-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-bottom: 0.75rem; }
    .life-box {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.65rem 0.35rem; text-align: center;
    }
    .life-box .val { font-size: 0.95rem; font-weight: 800; color: var(--green-900); }
    .life-box .lbl { font-size: 0.6rem; color: var(--text-muted); font-weight: 600; }
    .badge-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem 0.85rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.65rem;
    }
    .section-label {
      font-size: 0.7rem; font-weight: 800; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin: 0.85rem 0 0.4rem;
    }
    .menu-list { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 0.75rem; }
    .menu-list a, .menu-list button {
      display: flex; align-items: center; gap: 0.65rem; width: 100%;
      padding: 0.75rem 0.85rem; border: none; border-bottom: 1px solid #f0f0f0;
      background: #fff; text-align: left; text-decoration: none; color: var(--green-900);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .menu-list a:last-child, .menu-list button:last-child { border-bottom: none; }
    .menu-list .chev { margin-left: auto; color: #9ca3af; font-weight: 400; }
    .menu-list .prem { margin-left: auto; }
    .friend-card, .bm-card, .notif-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.7rem 0.8rem; margin-bottom: 0.55rem; display: flex; align-items: center; gap: 0.55rem;
    }
    .friend-card strong, .bm-card strong, .notif-card strong { display: block; font-size: 0.85rem; color: var(--green-900); }
    .friend-card span, .bm-card span, .notif-card span { font-size: 0.68rem; color: var(--text-muted); }
    .app-record-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 0.55rem; overflow: hidden;
    }
    .app-record-main {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.65rem 0.75rem; text-decoration: none; color: inherit;
    }
    .app-record-thumb {
      width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #c8e6c9, #81c784);
      display: grid; place-items: center; font-size: 1.25rem;
    }
    .app-record-body { flex: 1; min-width: 0; }
    .app-record-body .top {
      display: flex; justify-content: space-between; gap: 0.35rem;
      font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0.15rem;
    }
    .app-record-body h4 {
      margin: 0 0 0.2rem; font-size: 0.88rem; color: var(--green-900);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-record-meta {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      font-size: 0.68rem; color: var(--text-muted);
    }
    .app-record-chev { color: #9ca3af; font-size: 1.1rem; flex-shrink: 0; }
    .rec-search-row { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.55rem; }
    .subchips { display: flex; gap: 0.3rem; flex-wrap: nowrap; overflow-x: auto; margin-bottom: 0.55rem;
      mask-image: linear-gradient(90deg, #000 88%, transparent); -webkit-overflow-scrolling: touch; }
    .subchips button {
      border: none; border-radius: 999px; padding: 0.32rem 0.65rem; font-size: 0.7rem; font-weight: 700;
      background: #fff; border: 1px solid var(--border); color: var(--green-900); cursor: pointer;
    }
    .subchips button.active { background: var(--green-900); color: #fff; border-color: var(--green-900); }
    .search-mini {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 0.45rem 0.7rem; font-size: 0.8rem; margin-bottom: 0.45rem; background: #fff; box-sizing: border-box;
    }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.45rem; }
    .filter-grid label { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); display: block; }
    .top-records { display: grid; gap: 0.45rem; margin-bottom: 0.75rem; }
    .top-record-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0.65rem 0.75rem;
    }
    .top-record-card .name { font-weight: 800; color: var(--green-900); font-size: 0.85rem; }
    .top-record-card .val { font-size: 1.05rem; font-weight: 800; color: #111; margin: 0.15rem 0; }
    .top-record-card .foot { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
    .highlight-list { list-style: none; padding: 0; margin: 0 0 0.75rem; }
    .highlight-list li {
      display: flex; align-items: center; gap: 0.45rem; background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 0.55rem 0.7rem; margin-bottom: 0.35rem; font-size: 0.78rem;
    }
    .highlight-list .hl-label { flex: 1; color: var(--text-muted); }
    .highlight-list .hl-val { font-weight: 800; color: var(--green-900); }
    .chart-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.75rem; margin-bottom: 0.65rem;
    }
    .chart-card h3 { margin: 0 0 0.45rem; font-size: 0.82rem; color: var(--green-900); }
    .chart-bars { display: flex; align-items: flex-end; gap: 0.25rem; height: 90px; }
    .chart-bars .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .chart-bars .bar { width: 100%; max-width: 18px; border-radius: 4px 4px 0 0; min-height: 4px; }
    .chart-bars .bar-label { font-size: 0.5rem; color: var(--text-muted); margin-top: 0.2rem; }
    .toggle-pills { display: flex; gap: 0.2rem; }
    .toggle-pills button {
      border: 1px solid var(--border); background: #fff; border-radius: 999px;
      padding: 0.2rem 0.55rem; font-size: 0.65rem; font-weight: 700; color: var(--green-900); cursor: pointer;
    }
    .toggle-pills button.active { background: var(--green-900); color: #fff; border-color: var(--green-900); }
    .pace-chart { width: 100%; height: auto; display: block; }
    .hub-panel[hidden] { display: none !important; }
    .info-pane[hidden] { display: none !important; }
    .form-group { margin-bottom: 0.65rem; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--green-900); margin-bottom: 0.25rem; }
    .app-sheet {
      display: none; position: fixed; inset: 0; z-index: 80;
      background: rgba(0,0,0,.4); align-items: flex-end; justify-content: center;
    }
    .app-sheet.open { display: flex; }
    .app-sheet-panel {
      width: min(420px, 100%); background: #fff; border-radius: 18px 18px 0 0;
      padding: 0.85rem 1rem 1.25rem; max-height: 78%; overflow: auto;
    }
    .app-sheet-head { display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.75rem; }
    .app-sheet-head strong { flex: 1; text-align: center; color: var(--green-900); margin-right: 1.5rem; }
    .ib-back { width: 36px; height: 36px; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--green-900); }
    .app-sheet-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .app-sheet-actions .btn { flex: 1; }
    .settings-card {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.85rem; margin-bottom: 0.75rem;
    }
    .settings-toggle {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.75rem; cursor: pointer;
    }
    .settings-toggle + .settings-toggle {
      margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #f0f0f0;
    }
    .settings-toggle strong {
      display: block; font-size: 0.82rem; color: var(--green-900); font-weight: 700;
    }
    .settings-toggle small {
      display: block; font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; line-height: 1.4;
    }
    .settings-toggle input { width: 18px; height: 18px; margin-top: 0.15rem; accent-color: var(--green-700); flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="../get-app.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen" style="position:relative">
        <div class="app-head">
          <div class="profile-hero-row">
            <div id="avatarWrap" class="profile-avatar-app"></div>
            <div class="profile-hero-main">
              <h1 id="userName"></h1>
              <div id="profilePremiumCta"></div>
            </div>
            <div class="profile-hero-actions">
              <button type="button" class="profile-icon-btn" id="openNotif" aria-haspopup="true">
                <span id="notifIcon"></span>
                <span class="profile-notif-dot" id="notifDot" hidden aria-hidden="true"></span>
              </button>
              <button type="button" class="profile-icon-btn" id="openSettings">
                <span id="settingsIcon"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="hub-tabs" id="hubTabs" role="tablist"></div>

        <div class="phone-body">
          <!-- Dashboard -->
          <section class="hub-panel" id="panelDashboard" data-hub="dashboard">
            <div class="profile-badge-strip">
              <div class="profile-badge-strip-label" id="lblSelBadge"></div>
              <div class="profile-badge-strip-row">
                <strong id="selBadge"></strong>
                <button type="button" style="border:none;background:none;font-size:0.72rem;font-weight:700;color:var(--green-800);cursor:pointer;flex-shrink:0" id="linkBadges"></button>
              </div>
            </div>
            <div class="section-label" id="lblLifetime"></div>
            <div class="life-grid">
              <div class="life-box"><div class="val" id="lifeKm">—</div><div class="lbl" id="lblKm"></div></div>
              <div class="life-box"><div class="val" id="lifeRec">—</div><div class="lbl" id="lblRec"></div></div>
              <div class="life-box"><div class="val" id="lifeElev">—</div><div class="lbl" id="lblElev"></div></div>
            </div>
            <div id="dashMoreGate"></div>
            <button type="button" class="btn btn-primary btn-block" id="dashMoreBtn" hidden style="margin-bottom:0.75rem"></button>
            <div id="dashPremiumMore" hidden>
              <div class="section-label" id="lblTopRec"></div>
              <div class="top-records" id="dashTopRecords"></div>
              <div class="section-label" id="lblHighlights"></div>
              <ul class="highlight-list" id="milHighlights"></ul>
              <div class="section-label" id="lblInsights"></div>
              <div class="chart-card">
                <h3 id="lblPace"></h3>
                <svg class="pace-chart" viewBox="0 0 320 120" preserveAspectRatio="none">
                  <path fill="rgba(61,168,85,0.2)" d="M20,70 L60,66 L100,74 L140,62 L180,68 L220,58 L300,60 L300,110 L20,110 Z"/>
                  <path fill="none" stroke="#3da855" stroke-width="2.5" d="M20,70 L60,66 L100,74 L140,62 L180,68 L220,58 L300,60"/>
                  <path fill="none" stroke="#4a90c8" stroke-width="2.5" d="M20,85 L60,78 L100,82 L140,55 L180,66 L220,42 L300,48"/>
                </svg>
                <div style="display:flex;gap:0.75rem;font-size:0.68rem;color:var(--text-muted);margin-top:0.35rem">
                  <span><span style="color:#3da855">●</span> <span id="lblAvgPace"></span></span>
                  <span><span style="color:#4a90c8">●</span> <span id="lblBestPace"></span></span>
                </div>
              </div>
              <div class="chart-card">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:0.35rem;margin-bottom:0.35rem">
                  <h3 style="margin:0" id="lblActivity"></h3>
                  <div class="toggle-pills" id="activityToggle">
                    <button type="button" class="active" data-mode="yearly"></button>
                    <button type="button" data-mode="monthly"></button>
                  </div>
                </div>
                <div class="chart-bars" id="activityBars"></div>
              </div>
              <div class="chart-card">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:0.35rem;margin-bottom:0.35rem">
                  <h3 style="margin:0" id="lblDistTrend"></h3>
                  <div class="toggle-pills" id="distToggle">
                    <button type="button" class="active" data-mode="yearly"></button>
                    <button type="button" data-mode="monthly"></button>
                  </div>
                </div>
                <div class="chart-bars" id="distBars"></div>
              </div>
              <div class="chart-card">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:0.35rem;margin-bottom:0.35rem">
                  <h3 style="margin:0" id="lblElevTrend"></h3>
                  <div class="toggle-pills" id="elevToggle">
                    <button type="button" class="active" data-mode="yearly"></button>
                    <button type="button" data-mode="monthly"></button>
                  </div>
                </div>
                <div class="chart-bars" id="elevBars"></div>
              </div>
              <div class="chart-card">
                <h3 id="lblRegion"></h3>
                <div id="regionPie"></div>
              </div>
            </div>

            <div class="profile-preview-head">
              <h2 id="lblPlansPreview"></h2>
              <a href="#" id="linkPlansMore"></a>
            </div>
            <div class="profile-preview-grid" id="plansPreview"></div>

            <div class="profile-preview-head">
              <h2 id="lblFriendsPreview"></h2>
              <a href="#" id="linkFriendsMore"></a>
            </div>
            <ul class="profile-friends-list" id="friendsPreview"></ul>

            <div class="profile-preview-head">
              <h2 id="lblRecordsPreview"></h2>
              <a href="#" id="linkRecordsMore"></a>
            </div>
            <div class="profile-preview-grid" id="recordsPreview"></div>

            <div class="profile-preview-head">
              <h2 id="lblReportsPreview"></h2>
              <a href="#" id="linkReportsMore"></a>
            </div>
            <div class="profile-preview-grid" id="reportsPreview"></div>
          </section>

          <!-- My Info -->
          <section class="hub-panel" id="panelInfo" data-hub="info" hidden>
            <div class="subchips" id="infoChips"></div>
            <div class="info-pane" data-info="badges">
              <p style="font-size:0.72rem;color:var(--text-muted);margin:0 0 0.55rem" id="badgeHint"></p>
              <div id="badgePicker"></div>
            </div>
            <div class="info-pane" data-info="records" hidden>
              <div class="premium-row" id="footRow" style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:#fff;border:1px solid var(--border);border-radius:12px;padding:0.65rem 0.8rem;margin-bottom:0.55rem;font-size:0.78rem;font-weight:600;color:var(--green-900)">
                <span id="footLabel"></span><span class="app-premium-pill" id="footPrem"></span>
              </div>
              <div class="rec-search-row">
                <input class="search-mini" id="recSearch" type="search" style="margin:0;flex:1" />
                <button type="button" class="btn btn-secondary" id="btnRecFilters" style="width:auto;padding:0.45rem 0.7rem;font-size:0.75rem;white-space:nowrap"></button>
              </div>
              <div id="hikeList"></div>
            </div>
            <div class="info-pane" data-info="plans" hidden>
              <input class="search-mini" id="planSearch" type="search" />
              <div class="filter-grid">
                <div><label id="lblPlanFrom"></label><input class="search-mini" style="margin:0" type="date" id="planFrom" /></div>
                <div><label id="lblPlanTo"></label><input class="search-mini" style="margin:0" type="date" id="planTo" /></div>
              </div>
              <div id="planDistrictWrap" style="margin-bottom:0.45rem"></div>
              <button type="button" class="btn btn-secondary btn-block" style="margin-bottom:0.55rem;font-size:0.8rem" id="btnImportGpx"></button>
              <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" hidden />
              <div id="planList"></div>
            </div>
            <div class="info-pane" data-info="groups" hidden>
              <input class="search-mini" id="groupSearch" type="search" />
              <div class="subchips" id="groupWhen"></div>
              <div class="filter-grid">
                <div><label id="lblGroupFrom"></label><input class="search-mini" style="margin:0" type="date" id="groupFrom" /></div>
                <div><label id="lblGroupTo"></label><input class="search-mini" style="margin:0" type="date" id="groupTo" /></div>
              </div>
              <div id="groupList"></div>
            </div>
            <div class="info-pane" data-info="more" hidden>

  <div class="app-sheet" id="offlineSheet">

      <div class="app-sheet-head">
        <button type="button" class="ib-back" id="offlineBack" aria-label="Back">‹</button>
        <strong id="offlineTitle"></strong>
      </div>
      <p class="cms-muted" style="font-size:0.8rem;color:var(--text-muted);margin:0 0 0.75rem" id="offlineBody"></p>
      <span class="app-premium-pill" id="offlinePrem"></span>
      <a class="btn btn-primary btn-block" style="margin-top:0.85rem" href="../get-app.html#premium" id="offlineUpgrade"></a>

  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>

  <script src="../js/cms-store.js"></script>
  <script src="../js/env-badge.js"></script>
  <script src="../js/hikes.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    const zh = lang === "zh";
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = t("app_back_web");
    twMountAppNav("profile");

    const u = TW.user || { name: "Hiker", email: "hiker@example.com" };
    document.getElementById("avatarWrap").innerHTML = TW.avatarHtml(u.avatar, "", 'style="width:56px;height:56px;object-fit:cover"')
      || `<div style="width:56px;height:56px;display:grid;place-items:center;font-weight:800;color:var(--green-900)">${(u.name || "H")[0]}</div>`;
    document.getElementById("userName").textContent = u.name;
    document.getElementById("notifIcon").innerHTML = twIcon("bell");
    document.getElementById("settingsIcon").innerHTML = twIcon("settings");
    document.getElementById("openNotif").setAttribute("aria-label", t("app_notifications"));
    document.getElementById("openSettings").setAttribute("aria-label", t("app_settings"));

    function renderProfilePremiumCta() {
      const el = document.getElementById("profilePremiumCta");
      if (!el) return;
      const prem = TW.isMemberPremium && TW.isMemberPremium();
      if (prem) {
        el.innerHTML = `<span class="dash-premium-pill">${TW.escapeHtml(t("dash_premium_active"))}</span>`;
      } else {
        el.innerHTML = `<a href="../get-app.html#premium" class="btn btn-secondary profile-premium-btn">${TW.escapeHtml(t("dash_unlock"))}</a>`;
      }
    }
    renderProfilePremiumCta();

    const HUBS = [
      { id: "dashboard", label: t("app_sec_dashboard") },
      { id: "info", label: t("app_sec_my_info") },
      { id: "friends", label: t("app_my_friends") },
      { id: "bookmarks", label: t("app_bookmarks") },
      { id: "sync", label: t("app_sec_sync") },
    ];
    let hub = "dashboard";
    let infoTab = "badges";
    let friendTab = "list";
    let bmTab = "all";
    let groupWhen = "all";
    let recDur = "all";
    let recGroup = "all";

    function notifUnread() {
      try { return localStorage.getItem("tw_app_notif_read") !== "1"; } catch (e) { return true; }
    }

    function updateHeaderActions() {
      document.getElementById("notifDot").hidden = !notifUnread();
      document.getElementById("openNotif").classList.toggle("active", hub === "notifications");
      document.getElementById("openSettings").classList.toggle("active", hub === "settings");
    }

    function renderHubTabs() {
      document.getElementById("hubTabs").innerHTML = HUBS.map((h) =>
        `<button type="button" data-hub="${h.id}" class="${hub === h.id ? "active" : ""}">${h.label}</button>`
      ).join("");
      updateHeaderActions();
    }

    function showHub(id) {
      hub = id;
      if (id === "info") {
        /* keep infoTab; hash may set type */
      }
      document.querySelectorAll(".hub-panel").forEach((el) => {
        el.hidden = el.getAttribute("data-hub") !== id;
      });
      renderHubTabs();
      try {
        const u = new URL(location.href);
        let h = id === "dashboard" ? "overview" : id;
        if (id === "info") h = infoTab === "badges" ? "profile" : "profile&type=" + infoTab;
        u.hash = h;
        history.replaceState(null, "", u.pathname + u.search + u.hash);
      } catch (e) {}
      if (id === "info") showInfo(infoTab);
      if (id === "friends") renderFriends();
      if (id === "bookmarks") renderBookmarks();
      if (id === "notifications") renderNotifs();
      updateHeaderActions();
    }

    document.getElementById("openNotif").addEventListener("click", () => showHub("notifications"));
    document.getElementById("openSettings").addEventListener("click", () => showHub("settings"));

    document.getElementById("hubTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-hub]");
      if (btn) showHub(btn.dataset.hub);
    });

    /* —— Dashboard —— */
    TW.ensureDemoHike();
    document.getElementById("lblLifetime").textContent = t("dash_lifetime");
    const recCount = (TW.records || []).length + (TW.getHikes ? TW.getHikes().length : 0);
    document.getElementById("lifeKm").textContent = ((TW.stats && TW.stats.distanceKm) || 128).toLocaleString() + " km";
    document.getElementById("lifeRec").textContent = String((TW.stats && TW.stats.records) || recCount);
    document.getElementById("lifeElev").textContent = ((TW.stats && TW.stats.elevGain) || 8420).toLocaleString() + " m";
    document.getElementById("lblKm").textContent = t("km_hiked");
    document.getElementById("lblRec").textContent = t("records");
    document.getElementById("lblElev").textContent = t("profile_lifetime_elevation");
    document.getElementById("lblSelBadge").textContent = t("dash_selected_badge");
    document.getElementById("linkBadges").textContent = t("dash_change_badge");
    function refreshSelBadge() {
      TW.renderSelectedBadgeCard(null, document.getElementById("selBadge"));
    }
    refreshSelBadge();
    document.getElementById("linkBadges").addEventListener("click", () => {
      infoTab = "badges";
      showHub("info");
    });

    const isPrem = typeof TW.isMemberPremium === "function" && TW.isMemberPremium();
    TW.applyPremiumMoreGate();
    const moreBtn = document.getElementById("dashMoreBtn");
    moreBtn.textContent = t("dash_more");
    moreBtn.hidden = !isPrem;
    function setDashMore(open) {
      const panel = document.getElementById("dashPremiumMore");
      if (!isPrem) return;
      panel.hidden = !open;
      moreBtn.textContent = open ? t("dash_more_hide") : t("dash_more");
    }
    moreBtn.addEventListener("click", () => {
      const panel = document.getElementById("dashPremiumMore");
      setDashMore(panel.hidden);
    });

    document.getElementById("lblTopRec").textContent = t("mil_top_records");
    document.getElementById("lblHighlights").textContent = t("mil_highlights");
    document.getElementById("lblInsights").textContent = t("dash_insights");
    document.getElementById("lblPace").textContent = t("insights_pace");
    document.getElementById("lblAvgPace").textContent = t("insights_avg");
    document.getElementById("lblBestPace").textContent = t("insights_best");
    document.getElementById("lblActivity").textContent = t("insights_activity");
    document.getElementById("lblDistTrend").textContent = t("insights_distance");
    document.getElementById("lblElevTrend").textContent = t("insights_elevation");
    document.getElementById("lblRegion").textContent = t("insights_region");
    ["activityToggle", "distToggle", "elevToggle"].forEach((id) => {
      const el = document.getElementById(id);
      el.querySelector('[data-mode="yearly"]').textContent = t("insights_yearly");
      el.querySelector('[data-mode="monthly"]').textContent = t("insights_monthly");
    });

    const mil = TW.getMilestonesDemo();
    document.getElementById("dashTopRecords").innerHTML = mil.topRecords.map((r) =>
      `<div class="top-record-card"><div class="name">${r.title}</div><div class="val">${r.val}</div><div class="foot">${t(r.key)}</div></div>`
    ).join("");
    document.getElementById("milHighlights").innerHTML = mil.highlights.map((h) =>
      `<li><span>${h.icon}</span><span class="hl-label">${t(h.labelKey)}</span><span class="hl-val">${h.val}</span></li>`
    ).join("");
    TW.bindInsightToggle(document.getElementById("activityToggle"), document.getElementById("activityBars"), "activity");
    TW.bindInsightToggle(document.getElementById("distToggle"), document.getElementById("distBars"), "distance");
    TW.bindInsightToggle(document.getElementById("elevToggle"), document.getElementById("elevBars"), "elevation");
    TW.renderRegionPie(document.getElementById("regionPie"));

    document.getElementById("lblPlansPreview").textContent = t("nav_my_plans");
    document.getElementById("lblFriendsPreview").textContent = t("app_my_friends");
    document.getElementById("lblRecordsPreview").textContent = t("app_my_records");
    document.getElementById("lblReportsPreview").textContent = t("nav_my_reports");
    document.getElementById("linkPlansMore").textContent = t("profile_view_more");
    document.getElementById("linkFriendsMore").textContent = t("profile_view_more");
    document.getElementById("linkRecordsMore").textContent = t("profile_view_more");
    document.getElementById("linkReportsMore").textContent = t("profile_view_more");

    function renderProfilePreviewTile(title, meta, href, img, fallbackEmoji) {
      const thumb = img
        ? `<img src="${TW.escapeHtml(img)}" alt="" loading="lazy" />`
        : `<div class="profile-preview-thumb">${fallbackEmoji || "🗺"}</div>`;
      return `<a class="profile-preview-tile" href="${href}">
        ${thumb}
        <div class="profile-preview-tile-body">
          <strong>${TW.escapeHtml(title)}</strong>
          ${meta ? `<span class="meta">${TW.escapeHtml(meta)}</span>` : ""}
        </div>
      </a>`;
    }

    function allMyRecords() {
      const hikes = (TW.getHikes() || []).map((h) => Object.assign({}, h, { _kind: "hike" }));
      const recs = (TW.records || []).map((r) => Object.assign({}, r, { _kind: "record" }));
      return hikes.concat(recs);
    }

    function renderPlansPreview() {
      const drafts = ((TW.getRouteDrafts && TW.getRouteDrafts()) || []).slice(0, 2);
      const planned = (TW.getPlans() || [])
        .map((id) => TW.resolveTrailSource ? TW.resolveTrailSource(id) : (TW.trails || []).find((x) => x.id === id))
        .filter(Boolean)
        .slice(0, 4 - drafts.length);
      const rows = drafts.map((d) => ({
        title: TW.tt(d, "name") || d.name,
        meta: zh ? "草稿" : "Draft",
        href: "plan-detail.html?id=" + encodeURIComponent(d.id),
        image: d.image,
        emoji: "📝",
      })).concat(planned.map((tr) => ({
        title: TW.tt(tr, "title") || tr.title,
        meta: tr.distance || "",
        href: "route-detail.html?id=" + encodeURIComponent(tr.id),
        image: tr.image,
        emoji: "🗺",
      })));
      document.getElementById("plansPreview").innerHTML = rows.length
        ? rows.slice(0, 4).map((r) => renderProfilePreviewTile(r.title, r.meta, r.href, r.image, r.emoji)).join("")
        : `<p class="profile-preview-empty">${t("plan_empty")}</p>`;
    }

    function renderFriendsPreview() {
      const list = TW.demoFriends || [];
      document.getElementById("friendsPreview").innerHTML = list.length
        ? list.slice(0, 4).map((f) => `<li class="profile-friend-row">
            ${TW.avatarHtml(f.avatar, "avatar-sm")}
            <span class="profile-friend-name">${TW.escapeHtml(f.name)}</span>
          </li>`).join("")
        : `<li class="profile-preview-empty">${t("hikes_empty")}</li>`;
    }

    function renderRecordsPreview() {
      const list = allMyRecords().slice(0, 4);
      document.getElementById("recordsPreview").innerHTML = list.length
        ? list.map((item) => {
            const href = item._kind === "hike"
              ? "hike-detail.html?id=" + encodeURIComponent(item.id)
              : (typeof TW.recordDetailHref === "function" ? TW.recordDetailHref(item.id, { inApp: true }) : "record-detail.html?id=" + encodeURIComponent(item.id));
            const title = TW.tt(item, "title") || item.title || "";
            const meta = item._kind === "hike"
              ? (item.distanceKm != null ? item.distanceKm + " km" : "") + (item.seconds ? " · " + TW.formatDuration(item.seconds) : "")
              : [item.distance, item.duration].filter(Boolean).join(" · ");
            return renderProfilePreviewTile(title, meta, href, item.image, "🗺");
          }).join("")
        : `<p class="profile-preview-empty">${t("hikes_empty")}</p>`;
    }

    function renderReportsPreview() {
      const list = (TW.reports || []).slice(0, 4);
      document.getElementById("reportsPreview").innerHTML = list.length
        ? list.map((r) => {
            const href = "explore.html#incidents";
            const title = TW.tt(r, "title") || r.title || "";
            const catId = TW.normalizeReportCategory ? TW.normalizeReportCategory(r.category) : r.category;
            const catKey = "cat_" + catId;
            let catLabel = t(catKey);
            if (catLabel === catKey) catLabel = r.categoryLabel || r.category || "";
            const meta = [r.date, catLabel].filter(Boolean).join(" · ");
            return renderProfilePreviewTile(title, meta, href, r.image, "⚠️");
          }).join("")
        : `<p class="profile-preview-empty">${t("hikes_empty")}</p>`;
    }

    document.getElementById("linkPlansMore").addEventListener("click", (e) => {
      e.preventDefault();
      infoTab = "plans";
      showHub("info");
    });
    document.getElementById("linkFriendsMore").addEventListener("click", (e) => {
      e.preventDefault();
      showHub("friends");
    });
    document.getElementById("linkRecordsMore").addEventListener("click", (e) => {
      e.preventDefault();
      infoTab = "records";
      showHub("info");
    });
    document.getElementById("linkReportsMore").addEventListener("click", (e) => {
      e.preventDefault();
      location.href = "explore.html#incidents";
    });

    renderPlansPreview();
    renderFriendsPreview();
    renderRecordsPreview();
    renderReportsPreview();

    /* —— My Info —— */
    document.getElementById("infoChips").innerHTML = [
      { id: "badges", label: t("app_my_badges") },
      { id: "records", label: t("app_my_records") },
      { id: "plans", label: t("app_my_plans") },
      { id: "groups", label: t("app_my_groups") },
      { id: "more", label: t("app_more") },
    ].map((c) => `<button type="button" data-info="${c.id}" class="${infoTab === c.id ? "active" : ""}">${c.label}</button>`).join("");

    document.getElementById("badgeHint").textContent = t("app_badge_criteria");
    const badgePicker = document.getElementById("badgePicker");
    badgePicker.setAttribute("data-badge-picker", "1");
    TW.renderProfileBadgeGrid(badgePicker, () => refreshSelBadge(), { compact: true });
    TW.bindBadgeCatalogSync(() => refreshSelBadge());

    document.getElementById("footLabel").textContent = t("app_footprint_map");
    document.getElementById("footPrem").textContent = t("app_premium");
    document.getElementById("footRow").addEventListener("click", () => showToast(t("app_upgrade")));
    document.getElementById("recSearch").placeholder = t("me_search") + "…";
    document.getElementById("btnRecFilters").textContent = t("app_filters");
    document.getElementById("recFilterTitle").textContent = t("app_filters");
    document.getElementById("lblRecFrom").textContent = t("app_filter_from");
    document.getElementById("lblRecTo").textContent = t("app_filter_to");
    document.getElementById("recDistrictWrap").innerHTML = TW.districtSelectHtml("recDistrict");
    document.getElementById("btnRecApply").textContent = t("app_filter_apply");
    document.getElementById("btnRecReset").textContent = t("app_filter_reset");
    document.getElementById("recExtra").innerHTML = `
      <button type="button" data-dur="all" class="active">${t("filter_all")}</button>
      <button type="button" data-dur="under1">${t("app_dur_under1")}</button>
      <button type="button" data-dur="1to3">${t("app_dur_1to3")}</button>
      <button type="button" data-dur="over3">${t("app_dur_over3")}</button>
      <button type="button" data-grp="all" class="active">${t("filter_all")}</button>
      <button type="button" data-grp="group">${t("app_filter_group")}</button>
      <button type="button" data-grp="solo">${t("app_filter_solo")}</button>`;

    function allMyRecords() {
      const hikes = (TW.getHikes() || []).map((h) => Object.assign({}, h, { _kind: "hike" }));
      return hikes;
    }
    function renderRecords() {
      const opts = {
        q: document.getElementById("recSearch").value,
        district: (document.getElementById("recDistrict") || {}).value || "",
        from: document.getElementById("recFrom").value,
        to: document.getElementById("recTo").value,
      };
      let list = allMyRecords().filter((item) => TW.matchesProfileFilters(item, opts));
      if (recDur !== "all") {
        list = list.filter((r) => {
          const m = TW.recordDurationMinutes ? TW.recordDurationMinutes(r) : Math.round((r.seconds || 0) / 60);
          if (recDur === "under1") return m > 0 && m < 60;
          if (recDur === "1to3") return m >= 60 && m <= 180;
          if (recDur === "over3") return m > 180;
          return true;
        });
      }
      if (recGroup === "group") list = list.filter((r) => r.groupId);
      if (recGroup === "solo") list = list.filter((r) => !r.groupId);
      document.getElementById("hikeList").innerHTML = list.length
        ? list.map((h) => {
            const title = zh ? h.titleZh || h.title : h.title;
            const href = "hike-detail.html?id=" + encodeURIComponent(h.id);
            return `<article class="app-record-card">
              <a class="app-record-main" href="${href}">
                <div class="app-record-thumb" aria-hidden="true">🗺</div>
                <div class="app-record-body">
                  <div class="top"><span>${TW.formatHikeDate(h.endedAt || h.startedAt)}</span><span>📍 GPS</span></div>
                  <h4>${title}</h4>
                  <div class="app-record-meta">
                    <span>⏱ ${TW.formatDuration(h.seconds)}</span>
                    <span>📏 ${h.distanceKm} km</span>
                    <span>⬆ ${h.elevGain} m</span>
                  </div>
                </div>
                <span class="app-record-chev" aria-hidden="true">›</span>
              </a>
            </article>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${t("hikes_empty")}</p>`;
    }
    document.getElementById("recSearch").addEventListener("input", renderRecords);
    document.getElementById("btnRecFilters").addEventListener("click", () => {
      document.getElementById("recFilterSheet").classList.add("open");
    });
    document.getElementById("recFilterBack").addEventListener("click", () => {
      document.getElementById("recFilterSheet").classList.remove("open");
    });
    document.getElementById("btnRecApply").addEventListener("click", () => {
      document.getElementById("recFilterSheet").classList.remove("open");
      renderRecords();
    });
    document.getElementById("btnRecReset").addEventListener("click", () => {
      document.getElementById("recFrom").value = "";
      document.getElementById("recTo").value = "";
      const dist = document.getElementById("recDistrict");
      if (dist) dist.value = "";
      recDur = "all";
      recGroup = "all";
      document.querySelectorAll("#recExtra [data-dur]").forEach((b) => b.classList.toggle("active", b.dataset.dur === "all"));
      document.querySelectorAll("#recExtra [data-grp]").forEach((b) => b.classList.toggle("active", b.dataset.grp === "all"));
      renderRecords();
    });
    document.getElementById("recExtra").addEventListener("click", (e) => {
      const dur = e.target.closest("[data-dur]");
      const grp = e.target.closest("[data-grp]");
      if (dur) {
        recDur = dur.dataset.dur;
        document.querySelectorAll("#recExtra [data-dur]").forEach((b) => b.classList.toggle("active", b === dur));
      }
      if (grp) {
        recGroup = grp.dataset.grp;
        document.querySelectorAll("#recExtra [data-grp]").forEach((b) => b.classList.toggle("active", b === grp));
      }
    });

    document.getElementById("planSearch").placeholder = t("me_search") + "…";
    document.getElementById("lblPlanFrom").textContent = t("app_filter_from");
    document.getElementById("lblPlanTo").textContent = t("app_filter_to");
    document.getElementById("planDistrictWrap").innerHTML = TW.districtSelectHtml("planDistrict");
    document.getElementById("btnImportGpx").textContent = t("app_import_gpx");
    if (TW.ensureDemoPlans) TW.ensureDemoPlans();
    function renderPlans() {
      const q = document.getElementById("planSearch").value.trim().toLowerCase();
      const district = (document.getElementById("planDistrict") || {}).value || "";
      const drafts = (TW.getRouteDrafts && TW.getRouteDrafts()) || [];
      const planned = (TW.getPlans() || []).map((id) => TW.resolveTrailSource ? TW.resolveTrailSource(id) : (TW.trails || []).find((x) => x.id === id)).filter(Boolean);
      let rows = drafts.map((d) => ({ id: d.id, title: d.name, titleZh: d.nameZh, _draft: true, updatedAt: d.updatedAt })).concat(planned);
      rows = rows.filter((r) => {
        if (q) {
          const hay = ((r.title || "") + " " + (r.titleZh || "")).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (district && TW.guessDistrict(r) !== district) return false;
        return true;
      });
      document.getElementById("planList").innerHTML = rows.length
        ? rows.map((r) => {
            const name = TW.tt(r, "title") || r.title;
            const href = r._draft
              ? "plan-detail.html?id=" + encodeURIComponent(r.id)
              : "route-detail.html?id=" + encodeURIComponent(r.id);
            return `<a class="bm-card" href="${href}" style="text-decoration:none;color:inherit">
              <div style="flex:1"><strong>${name}</strong><span>${r._draft ? (zh ? "草稿" : "Draft") : (r.distance || "")}</span></div>
              <span class="chev">›</span>
            </a>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${t("plan_empty")}</p>
           <a class="btn btn-primary btn-block" href="explore.html">${t("plan_go_explore")}</a>`;
    }
    document.getElementById("btnImportGpx").addEventListener("click", () => document.getElementById("gpxFile").click());
    document.getElementById("gpxFile").addEventListener("change", () => {
      if (TW.newRouteDraft) {
        const d = TW.newRouteDraft({ name: zh ? "匯入的 GPX" : "Imported GPX" });
        showToast(t("app_gpx_imported"));
        setTimeout(() => { location.href = "index.html?mode=plan&draft=" + encodeURIComponent(d.id); }, 600);
      } else showToast(t("app_gpx_imported"));
    });
    ["planSearch", "planFrom", "planTo"].forEach((id) => {
      document.getElementById(id).addEventListener("input", renderPlans);
      document.getElementById(id).addEventListener("change", renderPlans);
    });
    document.getElementById("planDistrictWrap").addEventListener("change", renderPlans);

    document.getElementById("groupSearch").placeholder = t("me_search") + "…";
    document.getElementById("lblGroupFrom").textContent = t("app_filter_from");
    document.getElementById("lblGroupTo").textContent = t("app_filter_to");
    document.getElementById("groupWhen").innerHTML = `
      <button type="button" data-w="all" class="active">${t("groups_all_when") || t("filter_all")}</button>
      <button type="button" data-w="upcoming">${t("groups_upcoming") || (zh ? "即將舉行" : "Upcoming")}</button>
      <button type="button" data-w="past">${t("groups_past") || (zh ? "已結束" : "Past")}</button>`;
    function renderGroups() {
      const q = document.getElementById("groupSearch").value.trim().toLowerCase();
      let list = (TW.groupHikes || TW.meetups || []).slice();
      if (!list.length && TW.getPublishedGroupHikes) list = TW.getPublishedGroupHikes() || [];
      if (!list.length) {
        list = [
          { id: "gh1", title: "Dragon's Back sunrise", titleZh: "龍脊日出", date: "2026-09-12", when: "upcoming" },
          { id: "gh2", title: "Sai Kung family walk", titleZh: "西貢親子行", date: "2026-07-01", when: "past" },
        ];
      }
      list = list.filter((g) => {
        const name = ((g.title || "") + " " + (g.titleZh || "")).toLowerCase();
        if (q && !name.includes(q)) return false;
        const when = g.when || (Date.parse(g.date) < Date.now() ? "past" : "upcoming");
        if (groupWhen !== "all" && when !== groupWhen) return false;
        return true;
      });
      document.getElementById("groupList").innerHTML = list.length
        ? list.map((g) => {
            const name = TW.tt(g, "title") || g.title;
            return `<a class="bm-card" href="group-detail.html?id=${encodeURIComponent(g.id)}" style="text-decoration:none;color:inherit">
              <div style="flex:1"><strong>${name}</strong><span>${g.date || ""}</span></div><span>›</span>
            </a>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${zh ? "暫無聯誼" : "No group hikes yet"}</p>`;
    }
    document.getElementById("groupWhen").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-w]");
      if (!btn) return;
      groupWhen = btn.dataset.w;
      document.querySelectorAll("#groupWhen button").forEach((b) => b.classList.toggle("active", b === btn));
      renderGroups();
    });
    document.getElementById("groupSearch").addEventListener("input", renderGroups);

    function showInfo(tab) {
      infoTab = tab;
      document.querySelectorAll("#infoChips button").forEach((b) => b.classList.toggle("active", b.dataset.info === tab));
      document.querySelectorAll(".info-pane").forEach((el) => {
        el.hidden = el.getAttribute("data-info") !== tab;
      });
      try {
        const u = new URL(location.href);
        u.hash = tab === "badges" ? "profile" : "profile&type=" + tab;
        history.replaceState(null, "", u.pathname + u.search + u.hash);
      } catch (e) {}
      if (tab === "records") renderRecords();
      if (tab === "plans") renderPlans();
      if (tab === "groups") renderGroups();
    }
    document.getElementById("infoChips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-info]");
      if (btn) showInfo(btn.dataset.info);
    });

    /* —— Friends —— */
    const friends = [
      { name: "Sarah Chen", status: "friend", routes: 12 },
      { name: "Marcus Lee", status: "friend", routes: 8 },
      { name: "Alex Ng", status: "pending", routes: 0 },
    ];
    document.getElementById("friendTabs").innerHTML = `
      <button type="button" data-ft="list" class="active">${t("friends_list")}</button>
      <button type="button" data-ft="pending">${t("friends_pending")}</button>`;
    function renderFriends() {
      const rows = friendTab === "pending"
        ? friends.filter((f) => f.status === "pending")
        : friends.filter((f) => f.status === "friend");
      document.getElementById("friendList").innerHTML = rows.length
        ? rows.map((f) => `
          <div class="friend-card">
            <div style="width:36px;height:36px;border-radius:50%;background:var(--green-100);display:grid;place-items:center;font-weight:800;color:var(--green-900)">${f.name[0]}</div>
            <div style="flex:1"><strong>${f.name}</strong><span>${f.routes} ${zh ? "路線" : "routes"}</span></div>
            <button type="button" class="btn btn-secondary" style="padding:0.3rem 0.55rem;font-size:0.7rem" data-fact="${f.status}">${f.status === "pending" ? t("confirm") : (zh ? "查看" : "View")}</button>
          </div>`).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${zh ? "暫無項目" : "Nothing here"}</p>`;
    }
    document.getElementById("friendTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-ft]");
      if (!btn) return;
      friendTab = btn.dataset.ft;
      document.querySelectorAll("#friendTabs button").forEach((b) => b.classList.toggle("active", b === btn));
      renderFriends();
    });
    document.getElementById("friendList").addEventListener("click", (e) => {
      if (e.target.closest("[data-fact]")) showToast(t("confirm"));
    });

    /* —— Bookmarks —— */
    if (TW.ensureDemoBookmarks) TW.ensureDemoBookmarks();
    document.getElementById("bmTabs").innerHTML = `
      <button type="button" data-bm="all" class="active">${t("filter_all")}</button>
      <button type="button" data-bm="route">${t("app_bm_routes")}</button>
      <button type="button" data-bm="record">${t("app_bm_records")}</button>
      <button type="button" data-bm="event">${t("app_bm_events")}</button>`;
    function renderBookmarks() {
      let rows = typeof TW.resolveBookmarkItems === "function" ? TW.resolveBookmarkItems() : [];
      if (bmTab === "routes") bmTab = "route";
      if (bmTab === "records") bmTab = "record";
      if (bmTab === "events") bmTab = "event";
      if (bmTab !== "all") rows = rows.filter((r) => r.type === bmTab);
      const typeKey = { route: "app_bm_routes", record: "app_bm_records", event: "app_bm_events" };
      document.getElementById("bmList").innerHTML = rows.length
        ? rows.map((r) => {
            const href = r.href || "#";
            const icon = r.type === "event" ? "👥" : r.type === "record" ? "🗺" : "🥾";
            return `<a class="bm-card" href="${href}" style="text-decoration:none;color:inherit">
              <div style="width:44px;height:44px;border-radius:10px;background:var(--green-50);display:grid;place-items:center;flex-shrink:0;font-size:1.1rem">${icon}</div>
              <div style="flex:1;min-width:0"><strong>${r.title}</strong><span>${t(typeKey[r.type] || "") || r.type}${r.meta ? " · " + r.meta : ""}</span></div>
              <span class="chev">›</span>
            </a>`;
          }).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${t("bookmarks_empty")}</p>`;
    }
    document.getElementById("bmTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-bm]");
      if (!btn) return;
      bmTab = btn.dataset.bm;
      document.querySelectorAll("#bmTabs button").forEach((b) => b.classList.toggle("active", b === btn));
      renderBookmarks();
    });
    renderBookmarks();

    /* —— Settings —— */
    document.getElementById("lblEditProfile").textContent = t("app_edit_profile");
    document.getElementById("lblMapsSettings").textContent = t("app_maps_settings");
    document.getElementById("lblPrefs").textContent = t("app_prefs");
    document.getElementById("lblClearCache").textContent = t("app_clear_map_cache");
    document.getElementById("lblWifiPhotos").textContent = t("app_wifi_photos");
    document.getElementById("hintWifiPhotos").textContent = t("app_wifi_photos_hint");
    document.getElementById("setPremium").textContent = t("app_premium");
    document.getElementById("setPremPill").textContent = t("app_premium");
    document.getElementById("setOfflineLbl").textContent = t("app_offline_maps");
    document.getElementById("setOverseasLbl").textContent = t("app_overseas_maps");
    document.getElementById("offlineTitle").textContent = t("app_offline_maps");
    document.getElementById("offlineBody").textContent = t("app_offline_premium_body");
    document.getElementById("offlinePrem").textContent = t("app_premium");
    document.getElementById("offlineUpgrade").textContent = t("app_upgrade");
    function openOfflineSheet() {
      document.getElementById("offlineSheet").classList.add("open");
    }
    document.getElementById("setOffline").addEventListener("click", openOfflineSheet);
    document.getElementById("setOverseas").addEventListener("click", openOfflineSheet);
    document.getElementById("offlineBack").addEventListener("click", () => {
      document.getElementById("offlineSheet").classList.remove("open");
    });
    document.getElementById("btnClearCache").addEventListener("click", () => {
      const keys = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.indexOf("tw_map_") === 0 || k.indexOf("tw_offline_") === 0)) keys.push(k);
        }
        keys.forEach((k) => localStorage.removeItem(k));
      } catch (e) {}
      showToast(t("app_map_cache_cleared"));
    });
    document.getElementById("lblName").textContent = t("profile_name");
    document.getElementById("lblEmail").textContent = t("profile_email");
    document.getElementById("settingsName").value = u.name || "";
    document.getElementById("settingsEmail").value = u.email || "";
    document.getElementById("btnSaveProfile").textContent = t("profile_save");
    document.getElementById("btnSaveProfile").addEventListener("click", () => showToast(t("toast_saved")));
    document.getElementById("lblLanding").textContent = t("app_landing_page");
    document.getElementById("landingHint").textContent = t("app_landing_hint");
    let landing = "home";
    try { landing = localStorage.getItem("tw_app_landing") || "home"; } catch (e) {}
    let wifiPhotosOnly = false;
    try { wifiPhotosOnly = localStorage.getItem("tw_app_wifi_photos") === "1"; } catch (e) {}
    document.getElementById("wifiPhotosOnly").checked = wifiPhotosOnly;
    document.getElementById("wifiPhotosOnly").addEventListener("change", (e) => {
      try { localStorage.setItem("tw_app_wifi_photos", e.target.checked ? "1" : "0"); } catch (err) {}
      showToast(t("toast_saved"));
    });
    const landOpts = [
      { id: "home", label: t("app_landing_community") },
      { id: "explore", label: t("app_landing_explore") },
      { id: "track", label: t("app_landing_track") },
      { id: "profile", label: t("app_landing_profile") },
    ];
    function renderLanding() {
      document.getElementById("landingChips").innerHTML = landOpts.map((o) =>
        `<button type="button" data-land="${o.id}" class="${landing === o.id ? "active" : ""}">${o.label}</button>`
      ).join("");
    }
    renderLanding();
    document.getElementById("landingChips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-land]");
      if (!btn) return;
      landing = btn.dataset.land;
      try { localStorage.setItem("tw_app_landing", landing); } catch (err) {}
      renderLanding();
      showToast(t("toast_saved"));
    });

    /* —— Notifications —— */
    document.getElementById("btnMarkRead").textContent = t("app_notif_mark_read");
    function renderNotifs() {
      const items = (TW.demoNotifications && TW.demoNotifications()) || [];
      document.getElementById("notifList").innerHTML = items.length
        ? items.map((n) => `<div class="notif-card"><div style="flex:1"><strong>${n.title}</strong><span>${n.time || ""}</span></div></div>`).join("")
        : `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0">${t("notif_empty")}</p>`;
    }
    document.getElementById("btnMarkRead").addEventListener("click", () => {
      try { localStorage.setItem("tw_app_notif_read", "1"); } catch (e) {}
      renderHubTabs();
      twMountAppNav("profile");
      showToast(t("toast_saved"));
    });

    /* —— Sync —— */
    document.getElementById("syncTitle").textContent = t("app_sync_title");
    document.getElementById("syncBody").textContent = t("app_sync_body");
    document.getElementById("syncPrem").textContent = t("app_sync_premium");
    document.getElementById("syncList").innerHTML = [
      t("app_sync_garmin"), t("app_sync_polar"), t("app_sync_apple"),
    ].map((label) =>
      `<button type="button" data-sync><span>${label}</span><span class="prem"><span class="app-premium-pill">${t("app_premium")}</span></span></button>`
    ).join("");
    document.getElementById("syncList").addEventListener("click", (e) => {
      if (e.target.closest("[data-sync]")) showToast(isPrem ? t("toast_saved") : t("app_sync_premium"));
    });

    /* —— More —— */
    const moreItems = [
      { label: t("footer_map_credits"), href: "../map-credits.html" },
      { label: t("footer_about_heading"), href: "../about.html" },
      { label: t("footer_faq"), href: "../faq.html" },
      { label: t("footer_terms"), href: "../terms.html" },
      { label: t("footer_privacy"), href: "../privacy.html" },
    ];
    document.getElementById("moreLinks").innerHTML = moreItems.map((item) =>
      `<a href="${item.href}"><span>${TW.escapeHtml(item.label)}</span><span class="chev">›</span></a>`
    ).join("");

    /* Boot from hash */
    const hash = (location.hash || "").replace(/^#/, "");
    const hashMap = {
      overview: "dashboard", dashboard: "dashboard",
      profile: "info", info: "info",
      friends: "friends", bookmarks: "bookmarks",
      settings: "settings", notifications: "notifications", sync: "sync",
      more: "info",
      milestones: "dashboard", insights: "dashboard",
    };
    if (hash.indexOf("profile") === 0) {
      const type = (hash.match(/type=(\w+)/) || [])[1];
      if (type) infoTab = type;
    }
    if (hash === "more") infoTab = "more";
    showHub(hashMap[hash.split("&")[0]] || "dashboard");
    if (hash === "milestones" || hash === "insights") {
      if (isPrem) setDashMore(true);
    }
  </script>
</body>
</html>
