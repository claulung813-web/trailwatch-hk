<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>TrailWatch App — Route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/styles.css?v=20260830a" />
  <style>
    body { margin: 0; }
    .phone-body { flex: 1; overflow-y: auto; background: #f3f4f6; min-height: 0; padding-bottom: 0.5rem; }
    .app-detail-bar {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 2.35rem 0.65rem 0.55rem; background: #fff; border-bottom: 1px solid var(--border);
    }
    .app-detail-bar h1 {
      flex: 1; font-size: 0.95rem; margin: 0; text-align: center; color: #111;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .app-detail-bar .ib {
      width: 36px; height: 36px; border: none; background: none; cursor: pointer;
      font-size: 1.25rem; color: #111; display: grid; place-items: center; text-decoration: none;
      flex-shrink: 0;
    }
    .route-detail-content { padding: 0.75rem 0.85rem 0.25rem; }
    .route-share-byline { margin-bottom: 0.65rem; font-size: 0.78rem; }
    .route-share-map { height: 200px; border-radius: 12px; margin-bottom: 0.75rem; border: 1px solid var(--border); }
    .route-share-story { font-size: 0.82rem; line-height: 1.55; margin: 0 0 0.65rem; white-space: pre-wrap; }
    .route-share-itinerary { font-size: 0.78rem; color: var(--text-muted); margin: 0 0 0.85rem; line-height: 1.45; }
    .route-share-block { margin-bottom: 1rem; }
    .route-share-block h2 { font-size: 0.88rem; color: var(--green-900); margin: 0 0 0.55rem; }
    .route-share-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
    .route-share-stats div { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0.55rem 0.35rem; text-align: center; }
    .route-share-stats strong { display: block; font-size: 0.92rem; }
    .route-share-stats span { font-size: 0.62rem; color: var(--text-muted); }
    .rec-photo-grid { grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
    .route-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem;
      padding: 0.65rem 0.85rem calc(0.85rem + env(safe-area-inset-bottom, 0px));
      background: #fff; border-top: 1px solid var(--border);
    }
    .route-actions .btn-block.full { grid-column: 1 / -1; }
    .route-actions .bookmark-btn { min-height: 42px; }
  </style>
</head>
<body>
  <div class="app-page">
    <div class="app-page-top">
      <a href="explore.html" id="backWeb"></a>
      <div class="lang-switch" style="margin:0.75rem auto 0;width:fit-content;background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)">
        <button type="button" data-lang="en" style="color:#fff">EN</button>
        <button type="button" data-lang="zh" style="color:#fff">繁</button>
      </div>
    </div>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="app-detail-bar">
          <a class="ib" href="explore.html" id="backInline">‹</a>
          <h1 id="routeTitle">—</h1>
          <span class="ib" aria-hidden="true"></span>
        </div>
        <div class="phone-body">
          <div class="route-detail-content">
            <div class="route-share-byline">
              <strong id="recAuthor">TrailWatch</strong>
              <span id="recDate"></span>
            </div>
            <div id="recMap" class="route-share-map"></div>
            <p class="route-share-story" id="recDesc"></p>
            <p class="route-share-itinerary" id="recItinerary"></p>
            <section class="route-share-block">
              <h2 id="lblPlanData"></h2>
              <div class="route-share-stats" id="planStats"></div>
            </section>
            <section class="route-share-block">
              <h2 id="lblElev"></h2>
              <div id="elevChart"></div>
            </section>
            <section class="route-share-block">
              <h2 id="lblPhotos"></h2>
              <div class="rec-photo-grid" id="photoGrid"></div>
            </section>
          </div>
          <div class="route-actions">
            <button type="button" class="btn btn-secondary bookmark-btn icon-only" id="recBookmark" aria-label="Bookmark"></button>
            <button type="button" class="btn btn-secondary dup-btn" id="recDup"></button>
            <button type="button" class="btn btn-primary btn-block full" id="btnSavePlan"></button>
            <a class="btn btn-secondary btn-block full" id="btnFollow" href="index.html"></a>
          </div>
        </div>
        <div data-app-nav></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    const lang = TW.getLang();
    const t = TW.t;
    document.querySelectorAll(".lang-switch button").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === lang);
      b.addEventListener("click", () => { TW.setLang(b.dataset.lang); location.reload(); });
    });
    document.getElementById("backWeb").textContent = "‹ " + t("nav_explore");
    document.getElementById("lblPlanData").textContent = t("rec_planned_data");
    document.getElementById("lblElev").textContent = t("rec_elev_stat");
    document.getElementById("lblPhotos").textContent = t("rec_photos");
    document.getElementById("recDup").textContent = t("rec_duplicate_edit");
    twMountAppNav("explore");

    const id = new URLSearchParams(location.search).get("id");
    const trail =
      (typeof TW.getRecommendedTrail === "function" && TW.getRecommendedTrail(id)) ||
      (typeof TW.resolveTrailSource === "function" && TW.resolveTrailSource(id)) ||
      (TW.trails || []).find((x) => x.id === id) ||
      (typeof TW.getPublishedTrails === "function" && TW.getPublishedTrails().find((x) => x.id === id));

    if (!trail) {
      location.href = "explore.html";
    } else {
      const title = TW.tt(trail, "title");
      document.getElementById("routeTitle").textContent = title;
      document.getElementById("recDesc").textContent = TW.tt(trail, "desc") || "";
      const it = lang === "zh" ? trail.itineraryZh || trail.itinerary : trail.itinerary || trail.itineraryZh;
      document.getElementById("recItinerary").textContent = it ? t("rec_itinerary") + "：" + it : "";
      document.getElementById("recAuthor").textContent = trail.author || "TrailWatch";
      document.getElementById("recDate").textContent = trail.date || "";

      const dist = trail.distanceKm != null ? Number(trail.distanceKm).toFixed(2) : (trail.distance || "—");
      const dur = trail.durationClock || trail.duration || "—";
      const elev = trail.elevChange != null ? trail.elevChange : trail.elevation || "—";
      document.getElementById("planStats").innerHTML = [
        [dur, t("rec_duration_lbl")],
        [dist, t("rec_distance_km")],
        [elev, t("rec_elev_changes")],
      ].map((s) => `<div><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("");

      document.getElementById("elevChart").innerHTML = TW.elevChartHtml({
        elevMax: trail.elevMax,
        elevMin: trail.elevMin,
        elevProfile: trail.elevProfile,
        showPace: false,
      });

      const photos = trail.photos && trail.photos.length ? trail.photos : trail.image ? [trail.image] : [];
      document.getElementById("photoGrid").innerHTML = photos.length
        ? photos.map((p) => `<img src="${p}" alt="" loading="lazy" />`).join("")
        : `<p style="grid-column:1/-1;font-size:0.78rem;color:var(--text-muted);margin:0">${t("hikes_empty")}</p>`;

      const planId = trail.trailId || trail.id;
      const bm = document.getElementById("recBookmark");
      bm.dataset.trail = planId;
      bm.setAttribute("aria-label", t("rec_bookmark"));
      bm.innerHTML = typeof twIcon === "function" ? twIcon("bookmarks") : "🔖";
      if (TW.isBookmarked && TW.isBookmarked(planId)) {
        bm.classList.add("active");
        bm.setAttribute("aria-pressed", "true");
      } else {
        bm.setAttribute("aria-pressed", "false");
      }
      bm.addEventListener("click", () => showToast(t("rec_bookmark")));
      document.getElementById("recDup").dataset.trail = planId;
      document.getElementById("recDup").addEventListener("click", () => showToast(t("rec_duplicate_edit")));

      const followHref = "index.html?follow=route&trail=" + encodeURIComponent(trail.id);
      document.getElementById("btnFollow").href = followHref;
      document.getElementById("btnFollow").textContent = t("app_track_follow");

      function syncSave() {
        const on = TW.isPlanned(trail.id);
        document.getElementById("btnSavePlan").textContent = on ? t("app_remove_from_plans") : t("app_save_to_plans");
      }
      syncSave();
      document.getElementById("btnSavePlan").addEventListener("click", () => {
        const added = TW.togglePlan(trail.id);
        showToast(added ? t("toast_planned") : t("toast_unplanned"));
        syncSave();
      });

      let path = Array.isArray(trail.path) ? trail.path : [];
      if (path.length < 2 && trail.lat != null) path = TW.demoPathAround(trail.lat, trail.lng);
      if (path.length < 2) path = [[22.35, 114.25], [22.36, 114.26]];
      path = path.map((p) => [Number(p[0]), Number(p[1])]);
      const map = L.map("recMap", { zoomControl: false }).setView(path[0], 13);
      TW.addMapTiles(map, { maxZoom: 18 });
      if (path.length > 1) {
        const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
        if (typeof TW.addRouteEndpoints === "function") TW.addRouteEndpoints(map, path);
        setTimeout(() => { map.invalidateSize(); map.fitBounds(line.getBounds().pad(0.18)); }, 80);
      }
    }
  </script>
</body>
</html>
