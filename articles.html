<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Articles — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260828k" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="articles_title"></h1>
      <p class="page-sub" data-i18n="articles_sub"></p>

      <div class="tw-toolbar articles-toolbar">
        <div class="search-bar">
          <input type="search" id="articleSearch" data-i18n-placeholder="article_search_placeholder" />
        </div>
        <div class="articles-cat-filter">
          <div
            class="chip-row articles-cat-chips"
            id="articleCategoryFilter"
            role="toolbar"
            aria-label="Article tags"
          ></div>
        </div>
      </div>

      <div class="articles-unified-grid" id="articleList"></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js?v=20260828k"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("articles");

    let activeCategory = "all";

    function renderCategoryChips() {
      const row = document.getElementById("articleCategoryFilter");
      row.innerHTML = (TW.articleCategories || []).map((c) => {
        const label = TW.t(c.labelKey);
        const isActive = c.id === activeCategory;
        return `<button type="button" class="chip${isActive ? " active" : ""}" data-cat="${c.id}" aria-pressed="${isActive ? "true" : "false"}">${TW.escapeHtml(label)}</button>`;
      }).join("");
      row.querySelectorAll("[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderCategoryChips();
          renderList();
        });
      });
    }

    function renderList() {
      const q = document.getElementById("articleSearch").value.trim();
      const list = TW.getArticles({
        category: activeCategory,
        query: q,
      });
      const el = document.getElementById("articleList");
      if (!list.length) {
        el.innerHTML = `<p class="article-empty">${TW.escapeHtml(TW.t("article_empty"))}</p>`;
        return;
      }
      el.innerHTML = list.map((a) => TW.renderArticleCard(a)).join("");
    }

    renderCategoryChips();
    document.getElementById("articleSearch").addEventListener("input", renderList);
    renderList();
  </script>
</body>
</html>
