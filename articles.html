<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Articles — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="articles_title"></h1>
      <p class="page-sub" data-i18n="articles_sub"></p>

      <div class="tw-toolbar">
        <div class="search-bar">
          <input type="search" id="articleSearch" data-i18n-placeholder="article_search_placeholder" />
        </div>
        <div class="articles-cat-filter">
          <span class="articles-cat-label" id="articleFilterLabel" data-i18n="article_filter_label"></span>
          <div
            class="chip-row articles-cat-chips"
            id="articleCategoryFilter"
            role="toolbar"
            aria-labelledby="articleFilterLabel"
          ></div>
        </div>
        <div class="articles-extra-filters">
          <div class="gallery-filter-field">
            <label for="articleArea" data-i18n="article_filter_area"></label>
            <select class="form-select" id="articleArea"></select>
          </div>
          <div class="gallery-filter-field">
            <label for="articleRoute" data-i18n="article_filter_route"></label>
            <select class="form-select" id="articleRoute"></select>
          </div>
          <div class="gallery-filter-field">
            <label for="articleDateFrom" data-i18n="gallery_date_from"></label>
            <input class="form-input" type="date" id="articleDateFrom" />
          </div>
          <div class="gallery-filter-field">
            <label for="articleDateTo" data-i18n="gallery_date_to"></label>
            <input class="form-input" type="date" id="articleDateTo" />
          </div>
        </div>
      </div>

      <section class="articles-featured" aria-labelledby="articlesFeaturedHeading">
        <h2 id="articlesFeaturedHeading" class="articles-section-title" data-i18n="articles_featured"></h2>
        <div class="articles-featured-grid" id="featuredArticles"></div>
      </section>

      <section class="articles-main" aria-labelledby="articlesAllHeading">
        <h2 id="articlesAllHeading" class="articles-section-title articles-section-title--sm" data-i18n="articles_all_heading"></h2>
        <div id="articleList"></div>
      </section>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("articles");

    let activeCategory = "all";

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fillSelects() {
      const area = document.getElementById("articleArea");
      const route = document.getElementById("articleRoute");
      const zh = TW.getLang() === "zh";
      area.innerHTML =
        `<option value="all">${escapeHtml(TW.t("article_filter_all_areas"))}</option>` +
        (TW.districts || [])
          .map((d) => `<option value="${escapeHtml(d.id)}">${escapeHtml(zh ? d.nameZh : d.name)}</option>`)
          .join("");
      const routes = TW.getArticleFilterRoutes ? TW.getArticleFilterRoutes() : (TW.trails || []).filter((t) => t.editorChoice);
      route.innerHTML =
        `<option value="all">${escapeHtml(TW.t("article_filter_all_routes"))}</option>` +
        routes
          .map((t) => {
            const label = zh ? t.titleZh || t.title : t.title;
            return `<option value="${escapeHtml(t.id)}">${escapeHtml(label)}</option>`;
          })
          .join("");
    }

    function renderCategoryChips() {
      const row = document.getElementById("articleCategoryFilter");
      row.innerHTML = (TW.articleCategories || []).map((c) => {
        const label = TW.t(c.labelKey);
        const isActive = c.id === activeCategory;
        const active = isActive ? " active" : "";
        return `<button type="button" class="chip${active}" data-cat="${escapeHtml(c.id)}" aria-pressed="${isActive ? "true" : "false"}">${escapeHtml(label)}</button>`;
      }).join("");
      row.querySelectorAll("[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderCategoryChips();
          renderList();
        });
      });
    }

    function renderArticleCard(a, opts) {
      opts = opts || {};
      const zh = TW.getLang() === "zh";
      const title = zh ? a.titleZh : a.title;
      const excerpt = zh ? a.excerptZh : a.excerpt;
      const url = zh ? (a.urlZh || a.url) : a.url;
      const cat = TW.articleCategoryLabel(a.category);
      const tags = (a.tags || [])
        .map((t) => `<span class="article-tag">${escapeHtml(zh ? t.nameZh : t.name)}</span>`)
        .join("");
      const img = a.image
        ? `<div class="article-card-media"><img src="${escapeHtml(a.image)}" alt="" loading="lazy" /></div>`
        : "";
      const author = a.author
        ? `<span>${escapeHtml(TW.t("article_by"))} ${escapeHtml(a.author)}</span>`
        : "";
      const compact = opts.compact ? " article-card--featured" : "";
      const excerptHtml = opts.compact
        ? `<p class="article-excerpt article-excerpt--short">${escapeHtml(excerpt)}</p>`
        : `<p class="article-excerpt">${escapeHtml(excerpt)}</p>`;
      const trail = a.routeId ? (TW.trails || []).find((t) => t.id === a.routeId) : null;
      const areaName = a.district ? TW.districtName(a.district) : "";
      const routeHtml = trail
        ? `<a class="article-route" href="rec-trail.html?id=${encodeURIComponent(trail.id)}">${escapeHtml(zh ? trail.titleZh || trail.title : trail.title)}</a>`
        : "";
      return `<article class="article-card article-card--rich${compact}">
        ${img}
        <div class="article-card-body">
          <div class="meta">${escapeHtml(cat)}${areaName ? " · " + escapeHtml(areaName) : ""} · ${escapeHtml(a.date)}${author ? " · " + author : ""}</div>
          <strong><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a></strong>
          ${excerptHtml}
          ${opts.compact ? "" : `<div class="article-tags">${tags}</div>`}
          <div class="article-card-links">
            <a class="article-more" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(TW.t("article_read_more"))}</a>
            ${routeHtml}
          </div>
        </div>
      </article>`;
    }

    function renderFeatured() {
      const el = document.getElementById("featuredArticles");
      const featured = TW.getFeaturedArticles ? TW.getFeaturedArticles() : TW.getArticles({ featured: true });
      if (!featured.length) {
        el.closest(".articles-featured").hidden = true;
        return;
      }
      el.innerHTML = featured.map((a) => renderArticleCard(a, { compact: true })).join("");
    }

    function renderList() {
      const q = document.getElementById("articleSearch").value.trim();
      const list = TW.getArticles({
        category: activeCategory,
        query: q,
        district: document.getElementById("articleArea").value,
        routeId: document.getElementById("articleRoute").value,
        dateFrom: document.getElementById("articleDateFrom").value,
        dateTo: document.getElementById("articleDateTo").value,
      });
      const el = document.getElementById("articleList");
      if (!list.length) {
        el.innerHTML = `<p class="article-empty">${escapeHtml(TW.t("article_empty"))}</p>`;
        return;
      }
      el.innerHTML = list.map((a) => renderArticleCard(a)).join("");
    }

    fillSelects();
    renderFeatured();
    renderCategoryChips();
    document.getElementById("articleSearch").addEventListener("input", renderList);
    document.getElementById("articleArea").addEventListener("change", renderList);
    document.getElementById("articleRoute").addEventListener("change", renderList);
    document.getElementById("articleDateFrom").addEventListener("change", renderList);
    document.getElementById("articleDateTo").addEventListener("change", renderList);
    renderList();
  </script>
</body>
</html>
