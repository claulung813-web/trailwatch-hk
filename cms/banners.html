<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS — Homepage banners</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cms.css" />
</head>
<body class="cms-body">
  <div id="cmsShell">
    <h1>Homepage banners</h1>
    <p class="sub">Up to 3 homepage slides. Edit the title and a short description (one line each). Preview: <a href="../index.html" target="_blank">homepage ↗</a>.</p>

    <div class="cms-row">
      <div class="cms-card">
        <h3 style="margin-top:0" id="formTitle">Add banner</h3>
        <form class="cms-form" id="bannerForm">
          <input type="hidden" id="editId" />
          <label>Title (EN)</label>
          <input id="title" required maxlength="80" />
          <label>Title (繁)</label>
          <input id="titleZh" maxlength="80" />
          <label>Description (EN)</label>
          <textarea id="body" rows="2" maxlength="160"></textarea>
          <label>Description (繁)</label>
          <textarea id="bodyZh" rows="2" maxlength="160"></textarea>
          <label>Background image URL</label>
          <input id="image" placeholder="assets/brand/homepage-hero.jpeg or https://…" />
          <label>Button label (EN)</label>
          <input id="ctaLabel" />
          <label>Button label (繁)</label>
          <input id="ctaLabelZh" />
          <label>Button link</label>
          <input id="ctaHref" placeholder="get-app.html" />
          <label>Order (0 = first, max 3 live banners)</label>
          <input id="order" type="number" min="0" value="0" />
          <div class="cms-checks" style="margin-top:0.75rem">
            <label><input type="checkbox" id="published" checked /> Published</label>
          </div>
          <div class="cms-toolbar" style="margin-top:0.75rem">
            <button type="submit" class="cms-btn cms-btn-primary">Save banner</button>
            <button type="button" class="cms-btn cms-btn-secondary" id="resetForm">New</button>
          </div>
        </form>
      </div>

      <div class="cms-card">
        <h3 style="margin-top:0">Slides</h3>
        <table class="cms-table">
          <thead>
            <tr><th>Order</th><th>Banner</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
        <p style="margin-top:0.85rem">
          <a class="cms-btn cms-btn-secondary" href="../index.html" target="_blank">Preview homepage ↗</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/live-routes.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="js/cms-ui.js"></script>
  <script>
    cmsInitShell("banners");
    const DEFAULT_APP = "https://itunes.apple.com/hk/app/trailwatch/id791098937";
    const DEFAULT_PLAY = "https://play.google.com/store/apps/details?id=com.computancy.countrypark";

    function banners() {
      return (CMS.getStore().banners || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    }

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("formTitle").textContent = "Add banner";
      document.getElementById("bannerForm").reset();
      document.getElementById("published").checked = true;
      document.getElementById("order").value = String(Math.min(banners().length, 2));
    }

    function fillForm(b) {
      document.getElementById("editId").value = b.id;
      document.getElementById("formTitle").textContent = "Edit banner";
      document.getElementById("title").value = b.title || "";
      document.getElementById("titleZh").value = b.titleZh || "";
      document.getElementById("body").value = b.body || "";
      document.getElementById("bodyZh").value = b.bodyZh || "";
      document.getElementById("image").value = b.image || "";
      document.getElementById("ctaLabel").value = b.ctaLabel || "";
      document.getElementById("ctaLabelZh").value = b.ctaLabelZh || "";
      document.getElementById("ctaHref").value = b.ctaHref || "";
      document.getElementById("order").value = b.order != null ? b.order : 0;
      document.getElementById("published").checked = b.published !== false;
    }

    function renderList() {
      document.getElementById("list").innerHTML = banners()
        .map((b) => {
          const stores = b.showStores ? " · stores" : "";
          return `<tr>
            <td>${b.order != null ? b.order : "—"}</td>
            <td>
              <strong>${(b.title || "").replace(/</g, "&lt;")}</strong><br/>
              <span style="font-size:0.78rem;color:#6b7280">${(b.body || "").replace(/</g, "&lt;")}</span>
            </td>
            <td>${b.published !== false ? '<span class="cms-badge pub">Live</span>' : '<span class="cms-badge draft">Draft</span>'}</td>
            <td style="white-space:nowrap">
              <button type="button" class="cms-btn cms-btn-secondary cms-btn-sm" data-edit="${b.id}">Edit</button>
              ${cmsPreviewBtn("banner", b.id, "View website")}
              <button type="button" class="cms-btn cms-btn-danger cms-btn-sm" data-del="${b.id}">Delete</button>
            </td>
          </tr>`;
        })
        .join("") || `<tr><td colspan="4" style="color:#6b7280">No banners yet</td></tr>`;
    }

    document.getElementById("bannerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const store = CMS.getStore();
      const id = document.getElementById("editId").value || "bn_" + Date.now();
      const entry = {
        id: id,
        published: document.getElementById("published").checked,
        order: Number(document.getElementById("order").value) || 0,
        showStores: false,
        showDevice: false,
        badge: "",
        badgeZh: "",
        seo: "",
        seoZh: "",
        title: document.getElementById("title").value.trim(),
        titleZh: document.getElementById("titleZh").value.trim(),
        body: document.getElementById("body").value.trim(),
        bodyZh: document.getElementById("bodyZh").value.trim(),
        image: document.getElementById("image").value.trim(),
        deviceImage: "",
        ctaLabel: document.getElementById("ctaLabel").value.trim(),
        ctaLabelZh: document.getElementById("ctaLabelZh").value.trim(),
        ctaHref: document.getElementById("ctaHref").value.trim(),
        cta2Label: "",
        cta2LabelZh: "",
        cta2Href: "",
        appStoreUrl: DEFAULT_APP,
        playStoreUrl: DEFAULT_PLAY,
      };
      const list = store.banners || [];
      const idx = list.findIndex((x) => x.id === id);
      if (idx >= 0) list[idx] = Object.assign({}, list[idx], entry);
      else list.push(entry);
      store.banners = list;
      CMS.setStore(store);
      cmsToast("Banner saved");
      resetForm();
      renderList();
    });

    document.getElementById("resetForm").addEventListener("click", resetForm);

    document.getElementById("list").addEventListener("click", (e) => {
      const edit = e.target.closest("[data-edit]");
      const del = e.target.closest("[data-del]");
      if (edit) {
        const b = banners().find((x) => x.id === edit.dataset.edit);
        if (b) fillForm(b);
      }
      if (del) {
        if (!confirm("Delete this banner?")) return;
        const store = CMS.getStore();
        store.banners = (store.banners || []).filter((x) => x.id !== del.dataset.del);
        CMS.setStore(store);
        cmsToast("Banner deleted");
        resetForm();
        renderList();
      }
    });

    resetForm();
    renderList();
  </script>
</body>
</html>
