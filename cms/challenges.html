<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS — Challenges</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cms.css" />
</head>
<body class="cms-body">
  <div id="cmsShell">
    <h1>Challenges</h1>
    <p class="sub">Edit My Trees / gamification challenges shown on the website. Bilingual titles supported.</p>

    <div class="cms-card">
      <div class="cms-toolbar">
        <button type="button" class="cms-btn cms-btn-primary" id="addChallenge">+ Add challenge</button>
        <button type="button" class="cms-btn cms-btn-secondary" id="resetChallenges">Reset to defaults</button>
      </div>
      <div id="challengeList"></div>
      <button type="button" class="cms-btn cms-btn-primary" id="saveAll" style="margin-top:1rem">Save all challenges</button>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="js/cms-ui.js"></script>
  <script>
    cmsInitShell("challenges");

    function loadChallenges() {
      const store = CMS.getStore();
      return (store.challenges && store.challenges.length)
        ? JSON.parse(JSON.stringify(store.challenges))
        : JSON.parse(JSON.stringify(TW.treeGame.challenges));
    }

    let challenges = loadChallenges();

    function render() {
      document.getElementById("challengeList").innerHTML = challenges
        .map(
          (c, i) => `
        <div class="cms-card" style="background:#f9fafb;margin-top:0.75rem" data-i="${i}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong>Challenge ${i + 1}</strong>
            <button type="button" class="cms-btn cms-btn-danger cms-btn-sm" data-del="${i}">Remove</button>
          </div>
          <div class="cms-form">
            <label>Title (EN)</label>
            <input data-f="title" data-i="${i}" value="${(c.title || "").replace(/"/g, "&quot;")}" />
            <label>Title (繁)</label>
            <input data-f="titleZh" data-i="${i}" value="${(c.titleZh || "").replace(/"/g, "&quot;")}" />
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem">
              <div><label>Progress</label><input type="number" data-f="progress" data-i="${i}" value="${c.progress || 0}" /></div>
              <div><label>Total</label><input type="number" data-f="total" data-i="${i}" value="${c.total || 1}" /></div>
              <div><label>XP reward</label><input type="number" data-f="xp" data-i="${i}" value="${c.xp || 0}" /></div>
            </div>
          </div>
        </div>`
        )
        .join("");

      document.querySelectorAll("[data-f]").forEach((inp) => {
        inp.addEventListener("change", () => {
          const i = +inp.dataset.i;
          const f = inp.dataset.f;
          challenges[i][f] = inp.type === "number" ? +inp.value : inp.value;
        });
      });
      document.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          challenges.splice(+btn.dataset.del, 1);
          render();
        });
      });
    }

    document.getElementById("addChallenge").addEventListener("click", () => {
      challenges.push({
        id: uid("c"),
        title: "New challenge",
        titleZh: "新挑戰",
        progress: 0,
        total: 1,
        xp: 50,
      });
      render();
    });
    document.getElementById("resetChallenges").addEventListener("click", () => {
      if (!confirm("Reset challenges to site defaults?")) return;
      const store = CMS.getStore();
      store.challenges = null;
      CMS.setStore(store);
      challenges = loadChallenges();
      render();
      cmsToast("Reset to defaults");
    });
    document.getElementById("saveAll").addEventListener("click", () => {
      // flush inputs
      document.querySelectorAll("[data-f]").forEach((inp) => {
        const i = +inp.dataset.i;
        const f = inp.dataset.f;
        if (challenges[i]) challenges[i][f] = inp.type === "number" ? +inp.value : inp.value;
      });
      const store = CMS.getStore();
      store.challenges = challenges;
      CMS.setStore(store);
      cmsToast("Challenges saved — My Trees will use these");
    });
    render();
  </script>
</body>
</html>
