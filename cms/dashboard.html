<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS Dashboard — TrailWatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cms.css" />
</head>
<body class="cms-body">
  <div id="cmsShell">
    <h1>Dashboard</h1>
    <p class="sub">Overview of publishable content and pending moderation.</p>
    <div class="cms-stats" id="stats"></div>
    <div class="cms-card">
      <h3 style="margin:0 0 0.75rem">Quick actions</h3>
      <div class="cms-toolbar">
        <a class="cms-btn cms-btn-primary" href="banners.html">Hero banners</a>
        <a class="cms-btn cms-btn-secondary" href="homepage.html">Featured routes / articles</a>
        <a class="cms-btn cms-btn-secondary" href="trails.html">Editor's Choice</a>
        <a class="cms-btn cms-btn-secondary" href="articles.html">Articles</a>
        <a class="cms-btn cms-btn-secondary" href="feed.html">Community feed</a>
        <a class="cms-btn cms-btn-secondary" href="group-hikes.html">Group hikes</a>
        <a class="cms-btn cms-btn-secondary" href="incidents.html">Incidents</a>
        <a class="cms-btn cms-btn-secondary" href="users.html">Users</a>
        <a class="cms-btn cms-btn-secondary" href="admins.html">Admins</a>
        <a class="cms-btn cms-btn-secondary" href="badges.html">Badges</a>
        <a class="cms-btn cms-btn-secondary" href="gallery.html">Gallery</a>
        <a class="cms-btn cms-btn-secondary" href="transactions.html">Transactions</a>
        <a class="cms-btn cms-btn-secondary" href="notifications.html">Notifications</a>
        <a class="cms-btn cms-btn-secondary" href="popups.html">Pop-ups</a>
        <a class="cms-btn cms-btn-secondary" href="static-pages.html">Static pages</a>
      </div>
    </div>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="js/cms-ui.js"></script>
  <script>
    cmsInitShell("dash");
    const s = CMS.getStore();
    const rec = s.recommended || [];
    const inc = s.incidents || [];
    const mem = s.members || [];
    const users = s.users || [];
    const don = s.donations || [];
    const fb = s.feedback || [];
    const pending = inc.filter((i) => i.status === "received" || i.status === "under_review").length;
    const memPending = mem.filter((m) => m.status === "pending").length;
    const premiumNow = users.filter((u) => CMS.isUserPremiumNow(u)).length;
    const fbNew = fb.filter((f) => f.status === "new").length;
    const donTotal = don.reduce((n, d) => n + (+d.amount || 0), 0);
    const liveBanners = (s.banners || []).filter((b) => b.published !== false).length;
    const ntfSched = (s.notifications || []).filter((n) => n.status === "scheduled").length;
    document.getElementById("stats").innerHTML = `
      <div class="cms-stat"><div class="v">${liveBanners}</div><div class="l">Live homepage banners</div></div>
      <div class="cms-stat"><div class="v">${(s.featuredRouteIds || []).length}</div><div class="l">Featured routes</div></div>
      <div class="cms-stat"><div class="v">${rec.filter((r) => r.published).length}</div><div class="l">Editor's Choice published</div></div>
      <div class="cms-stat"><div class="v">${pending}</div><div class="l">Incidents awaiting action</div></div>
      <div class="cms-stat"><div class="v">${memPending}</div><div class="l">Member registrations pending</div></div>
      <div class="cms-stat"><div class="v">${users.length}</div><div class="l">App users (${premiumNow} premium)</div></div>
      <div class="cms-stat"><div class="v">${ntfSched}</div><div class="l">Scheduled notifications</div></div>
      <div class="cms-stat"><div class="v">${fbNew}</div><div class="l">New feedback messages</div></div>
      <div class="cms-stat"><div class="v">HK$${donTotal.toLocaleString()}</div><div class="l">Donations pledged (demo)</div></div>
    `;
  </script>
</body>
</html>
