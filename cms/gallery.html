<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS — Gallery featured</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cms.css" />
  <style>
    .gal-pick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .gal-pick {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      text-align: left;
      padding: 0;
      font: inherit;
      color: inherit;
    }
    .gal-pick.selected {
      border-color: #2f6b4f;
      box-shadow: 0 0 0 2px rgba(47, 107, 79, 0.25);
    }
    .gal-pick img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #ecf3ee;
    }
    .gal-pick-body {
      padding: 0.55rem 0.65rem 0.7rem;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .gal-pick-body strong { display: block; margin-bottom: 0.2rem; }
    .gal-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; align-items: center; }
  </style>
</head>
<body class="cms-body">
  <div id="cmsShell">
    <h1>Gallery featured</h1>
    <p class="sub">Select up to <strong>10</strong> featured photos for the public Gallery. Remaining photos appear automatically by recency or category.</p>
    <div class="gal-actions">
      <button type="button" class="cms-btn cms-btn-primary" id="saveFeatured">Save featured (max 10)</button>
      <a class="cms-btn cms-btn-secondary" href="../gallery.html" target="_blank">Preview Gallery ↗</a>
      <span id="pickCount" style="font-size:0.85rem;color:#6b7280"></span>
    </div>
    <div class="gal-pick-grid" id="pickGrid"></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/cms-store.js"></script>
  <script src="js/cms-ui.js"></script>
  <script>
    cmsInitShell("gallery");
    let selected = TW.getFeaturedGalleryIds().slice();

    function updateCount() {
      document.getElementById("pickCount").textContent = selected.length + " / 10 selected";
    }

    function render() {
      const photos = (TW.galleryPhotos || []).slice().sort((a, b) => TW.galleryDateValue(b) - TW.galleryDateValue(a));
      document.getElementById("pickGrid").innerHTML = photos
        .map((p) => {
          const on = selected.indexOf(p.id) >= 0;
          return `
            <button type="button" class="gal-pick${on ? " selected" : ""}" data-id="${p.id}">
              <img src="${p.src}" alt="" loading="lazy" />
              <div class="gal-pick-body">
                <strong>${p.date} · ${p.category}</strong>
                ${p.description || ""}
                <div style="margin-top:0.35rem;opacity:.7">${p.recordId || ""} · ${p.routeId || "—"}</div>
              </div>
            </button>`;
        })
        .join("");
      updateCount();
    }

    document.getElementById("pickGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (!btn) return;
      const id = btn.dataset.id;
      const i = selected.indexOf(id);
      if (i >= 0) selected.splice(i, 1);
      else {
        if (selected.length >= 10) {
          cmsToast("Maximum 10 featured photos");
          return;
        }
        selected.push(id);
      }
      render();
    });

    document.getElementById("saveFeatured").addEventListener("click", () => {
      TW.setFeaturedGalleryIds(selected);
      const store = CMS.getStore();
      store.featuredGalleryIds = selected.slice(0, 10);
      CMS.setStore(store);
      cmsToast("Featured gallery saved");
      selected = TW.getFeaturedGalleryIds().slice();
      render();
    });

    render();
  </script>
</body>
</html>
