<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=profile.html#overview" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var h = (location.hash || "#overview").replace(/^#/, "") || "overview";
      var map = {
        dashboard: "overview",
        hikes: "profile&type=records",
        records: "profile&type=records",
        plans: "profile&type=plans",
        groups: "profile&type=groups",
        reports: "profile&type=reports",
        gallery: "profile",
        bookmarks: "bookmarks",
        milestones: "overview",
        insights: "overview",
        activity: "profile",
        badges: "profile&type=badges",
        profile: "profile"
      };
      location.replace("profile.html#" + (map[h] || h));
    })();
  </script>
</head>
<body>
  <p><a href="profile.html#overview">Me / Profile</a></p>
</body>
</html>
