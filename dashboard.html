<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=profile.html#overview" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var h = (location.hash || "#overview").replace(/^#/, "") || "overview";
      var map = {
        dashboard: "overview",
        hikes: "activity&type=records",
        records: "activity&type=records",
        plans: "activity&type=plans",
        groups: "activity&type=groups",
        reports: "activity&type=reports",
        gallery: "activity&type=gallery",
        bookmarks: "overview",
        milestones: "badges",
        profile: "settings"
      };
      location.replace("profile.html#" + (map[h] || h));
    })();
  </script>
</head>
<body>
  <p><a href="profile.html#overview">Me / Profile</a></p>
</body>
</html>
