<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Trails — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=20260828f" />
</head>
<body class="page-explore">
  <div id="app-header"></div>

  <main class="page">
    <div class="container">

      <div class="tw-toolbar">
        <div class="explore-search-row">
          <div class="tabs explore-tabs" id="exploreTabs">
            <button class="tab active" data-tab="routes" data-i18n="tab_routes"></button>
            <button class="tab" data-tab="records" data-i18n="tab_records"></button>
            <button class="tab" data-tab="incidents" data-i18n="tab_incidents"></button>
          </div>
          <div class="search-bar explore-search">
            <input type="search" id="trailSearch" data-i18n-placeholder="search_placeholder" />
          </div>
        </div>

        <div class="explore-view-row" id="viewModes" role="tablist"></div>
        <div class="chip-row explore-subchips" id="subChips"></div>

        <details class="tw-advanced" id="advancedPanel">
          <summary data-i18n="toolbar_advanced"></summary>
          <div class="tw-advanced-body">
            <div class="filter-bar" id="routeAdvanced">
              <div>
                <label data-i18n="filter_district"></label>
                <select class="form-select" id="districtFilter"></select>
              </div>
              <div>
                <label data-i18n="filter_difficulty"></label>
                <div class="diff-chips" id="diffFilter">
                  <button type="button" class="chip active" data-diff="all" data-i18n="all_levels"></button>
                  <button type="button" class="chip" data-diff="1">1</button>
                  <button type="button" class="chip" data-diff="2">2</button>
                  <button type="button" class="chip" data-diff="3">3</button>
                  <button type="button" class="chip" data-diff="4">4</button>
                  <button type="button" class="chip" data-diff="5">5</button>
                </div>
                <p id="diffHint" style="font-size:0.75rem;color:var(--text-muted);margin-top:0.4rem"></p>
              </div>
              <div>
                <label data-i18n="explore_duration"></label>
                <select class="form-select" id="durationFilter">
                  <option value="all" data-i18n="explore_duration_any"></option>
                  <option value="short" data-i18n="explore_duration_short"></option>
                  <option value="mid" data-i18n="explore_duration_mid"></option>
                  <option value="long" data-i18n="explore_duration_long"></option>
                </select>
              </div>
              <div>
                <label data-i18n="explore_distance"></label>
                <select class="form-select" id="distanceFilter">
                  <option value="all" data-i18n="explore_distance_any"></option>
                  <option value="short" data-i18n="explore_distance_short"></option>
                  <option value="mid" data-i18n="explore_distance_mid"></option>
                  <option value="long" data-i18n="explore_distance_long"></option>
                </select>
              </div>
            </div>

            <div class="filter-bar is-hidden" id="recordFilters" hidden>
              <div>
                <label data-i18n="rec_filter_user"></label>
                <div class="chip-row" id="recordPeople">
                  <button type="button" class="chip active" data-people="public" data-i18n="rec_filter_public"></button>
                  <button type="button" class="chip" data-people="friends" data-i18n="rec_filter_friends"></button>
                </div>
              </div>
              <div style="grid-column:1 / -1">
                <label data-i18n="filter_category"></label>
                <div class="chip-row" id="recordTags"></div>
              </div>
              <div>
                <label data-i18n="filter_difficulty"></label>
                <div class="diff-chips" id="recordDiff">
                  <button type="button" class="chip active" data-diff="all" data-i18n="all_levels"></button>
                  <button type="button" class="chip" data-diff="1">1</button>
                  <button type="button" class="chip" data-diff="2">2</button>
                  <button type="button" class="chip" data-diff="3">3</button>
                  <button type="button" class="chip" data-diff="4">4</button>
                  <button type="button" class="chip" data-diff="5">5</button>
                </div>
              </div>
              <div>
                <label data-i18n="explore_distance"></label>
                <select class="form-select" id="recordDistance">
                  <option value="all" data-i18n="explore_distance_any"></option>
                  <option value="short" data-i18n="explore_distance_short"></option>
                  <option value="mid" data-i18n="explore_distance_mid"></option>
                  <option value="long" data-i18n="explore_distance_long"></option>
                </select>
              </div>
              <div>
                <label data-i18n="explore_duration"></label>
                <select class="form-select" id="recordDuration">
                  <option value="all" data-i18n="explore_duration_any"></option>
                  <option value="short" data-i18n="explore_duration_short"></option>
                  <option value="mid" data-i18n="explore_duration_mid"></option>
                  <option value="long" data-i18n="explore_duration_long"></option>
                </select>
              </div>
              <div>
                <label data-i18n="app_filter_from"></label>
                <input class="form-select" type="date" id="recordFrom" />
              </div>
              <div>
                <label data-i18n="app_filter_to"></label>
                <input class="form-select" type="date" id="recordTo" />
              </div>
            </div>

            <div class="filter-bar reports-filters is-hidden" id="incidentFilters" hidden style="margin-bottom:0">
              <div>
                <label for="exploreIncDate" data-i18n="reports_filter_date"></label>
                <select class="form-select" id="exploreIncDate">
                  <option value="all" selected data-i18n="reports_date_all"></option>
                  <option value="6m" data-i18n="reports_date_6m"></option>
                  <option value="30d" data-i18n="reports_date_30d"></option>
                  <option value="90d" data-i18n="reports_date_90d"></option>
                  <option value="year" data-i18n="reports_date_year"></option>
                </select>
              </div>
              <div>
                <label for="exploreIncStatus" data-i18n="reports_filter_status"></label>
                <select class="form-select" id="exploreIncStatus">
                  <option value="all" selected data-i18n="reports_status_all"></option>
                  <option value="new" data-i18n="status_new"></option>
                  <option value="update" data-i18n="status_updated"></option>
                  <option value="closed" data-i18n="status_closed"></option>
                </select>
              </div>
            </div>
          </div>
        </details>
      </div>

      <div id="view-routes">
        <div class="explore-toolbar">
          <h2 class="explore-count" id="listCount"></h2>
          <button type="button" class="btn btn-primary explore-map-btn" id="toggleMapView" data-i18n="explore_map_view"></button>
        </div>
        <div class="explore-split" id="exploreSplit">
          <div id="exploreMapWrap" class="explore-map-wrap" hidden>
            <div id="exploreMap"></div>
          </div>
          <div class="trail-grid" id="trailGrid"></div>
        </div>
      </div>

      <div id="view-records" class="hidden">
        <div class="record-list record-grid" id="exploreRecords"></div>
      </div>

      <div id="view-incidents" class="hidden">
        <div class="reports-cat-wrap explore-inc-cats">
          <span class="reports-filter-label" data-i18n="reports_filter_category"></span>
          <div class="chip-row" id="exploreIncCats"></div>
        </div>
        <div class="report-map report-map--tall" id="exploreIncMap"></div>
        <div class="report-list report-grid" id="exploreIncList"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js?v=20260828d"></script>
  <script src="js/data.js?v=20260828d"></script>
  <script src="js/live-routes.js?v=20260828d"></script>
  <script src="js/cms-store.js?v=20260828d"></script>
  <script src="js/hikes.js?v=20260828d"></script>
  <script src="js/app.js?v=20260828d"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("explore");

    let view = "editors";
    let theme = "all";
    let area = "all";
    let district = "all";
    let difficulty = "all";
    let duration = "all";
    let distanceBand = "all";
    let query = "";
    let mapMode = false;
    let exploreMap = null;
    let exploreLayer = null;
    let activeTab = "routes";
    let recPeople = "public";
    let recDuration = "all";
    let recDistance = "all";
    let recDiff = "all";
    let recTag = "all";
    let recFrom = "";
    let recTo = "";
    let incDate = "all";
    let incCat = "all";
    let incStatus = "all";
    let incMap = null;
    let incMarkers = [];

    function routeDetailHref(t) {
      return TW.routeDetailHref ? TW.routeDetailHref(t) : "rec-trail.html?id=" + encodeURIComponent((t && (t.trailId || t.id)) || "");
    }

    function recAsTrail(r) {
      const lat = r.lat != null ? r.lat : r.path && r.path[0] ? r.path[0][0] : 22.32;
      const lng = r.lng != null ? r.lng : r.path && r.path[0] ? r.path[0][1] : 114.17;
      return {
        id: r.id,
        trailId: r.trailId || r.id,
        title: r.title || r.name,
        titleZh: r.titleZh || r.nameZh,
        desc: r.desc || "",
        descZh: r.descZh || "",
        district: r.district,
        difficulty: r.difficulty || 2,
        distance: r.distanceKm != null ? r.distanceKm + " km" : r.distance || "—",
        duration: r.duration || "—",
        elevation: r.elevation || (r.elevChange != null ? r.elevChange + " m" : "—"),
        rating: r.rating || 4.5,
        image: r.image,
        tags: r.tags || r.categories || [],
        lat: lat,
        lng: lng,
        path: r.path,
        monthly: r.monthly,
        editorChoice: true,
        itinerary: r.itinerary,
        itineraryZh: r.itineraryZh,
        isPlan: !!r.isPlan,
      };
    }

    function draftAsTrail(d) {
      const path = d.path || [];
      const lat = path[0] ? Number(path[0][0]) : 22.32;
      const lng = path[0] ? Number(path[0][1]) : 114.17;
      const km = typeof TW.pathDistanceKm === "function" ? TW.pathDistanceKm(path) : 0;
      return {
        id: d.id,
        trailId: d.id,
        title: d.name || (TW.getLang() === "zh" ? "我的計劃" : "My plan"),
        titleZh: d.nameZh || d.name || "我的計劃",
        desc: d.notes || TW.t("in_plans"),
        descZh: d.notes || TW.t("in_plans"),
        district: d.district || "hk-island",
        difficulty: 2,
        distance: km ? km + " km" : "—",
        duration: "—",
        elevation: "—",
        rating: "—",
        image: d.image || "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=600&q=60",
        tags: ["plan"],
        lat: lat,
        lng: lng,
        path: path,
        isPlan: true,
      };
    }

    function myPlanRoutes() {
      const plannedIds = typeof TW.getPlans === "function" ? TW.getPlans() : [];
      const lib = allLibraryRoutes();
      const fromMarks = lib.filter((t) => plannedIds.indexOf(t.id) >= 0 || plannedIds.indexOf(t.trailId) >= 0);
      fromMarks.forEach((t) => {
        t.isPlan = true;
      });
      const drafts = (typeof TW.getRouteDrafts === "function" ? TW.getRouteDrafts() : []).map(draftAsTrail);
      const byId = {};
      fromMarks.concat(drafts).forEach((t) => {
        byId[t.id] = t;
      });
      return Object.keys(byId).map((k) => byId[k]);
    }

    function allLibraryRoutes() {
      const byId = {};
      (TW.trails || []).forEach((t) => {
        byId[t.id] = recAsTrail(t);
      });
      (typeof TW.getRecommendedTrails === "function" ? TW.getRecommendedTrails() : []).forEach((r) => {
        const t = recAsTrail(r);
        if (!byId[t.trailId] && !byId[t.id]) byId[t.id] = t;
      });
      return Object.keys(byId).map((k) => byId[k]);
    }

    function allRoutes() {
      const byId = {};
      allLibraryRoutes().forEach((t) => {
        byId[t.id] = t;
      });
      myPlanRoutes().forEach((t) => {
        byId[t.id] = t;
      });
      return Object.keys(byId).map((k) => byId[k]);
    }

    function editorsRoutes() {
      return (typeof TW.getRecommendedTrails === "function" ? TW.getRecommendedTrails() : []).map(recAsTrail);
    }

    function parseHours(t) {
      const s = String(t.duration || "");
      const h = /(\d+(?:\.\d+)?)\s*h/i.exec(s);
      const m = /(\d+)\s*m/i.exec(s);
      return (h ? +h[1] : 0) + (m ? +m[1] / 60 : 0);
    }
    function parseKm(t) {
      if (t.distanceKm != null) return +t.distanceKm;
      const m = /([\d.]+)\s*km/i.exec(String(t.distance || ""));
      return m ? +m[1] : NaN;
    }

    function applySearch(list) {
      return list.filter((t) => {
        const matchD = district === "all" || t.district === district;
        const matchDiff = difficulty === "all" || String(t.difficulty) === String(difficulty);
        const hrs = parseHours(t);
        const matchDur =
          duration === "all" ||
          (duration === "short" && hrs > 0 && hrs < 2) ||
          (duration === "mid" && hrs >= 2 && hrs <= 4) ||
          (duration === "long" && hrs > 4);
        const km = parseKm(t);
        const matchDist =
          distanceBand === "all" ||
          (distanceBand === "short" && km < 8) ||
          (distanceBand === "mid" && km >= 8 && km <= 15) ||
          (distanceBand === "long" && km > 15);
        const tags = t.tags || [];
        const matchTheme = theme === "all" || tags.indexOf(theme) >= 0;
        const matchArea = view !== "themes" || area === "all" || t.district === area;
        const q = query.trim().toLowerCase();
        const hay = (
          TW.tt(t, "title") +
          " " +
          TW.tt(t, "desc") +
          " " +
          TW.districtName(t.district) +
          " " +
          tags.join(" ")
        ).toLowerCase();
        const matchQ = !q || hay.includes(q);
        return matchD && matchDiff && matchDur && matchDist && matchTheme && matchArea && matchQ;
      });
    }

    function baseForView() {
      if (view === "editors") return editorsRoutes();
      if (view === "plans" || view === "categories") view = "all";
      return allRoutes();
    }

    function resultCountLabel(n) {
      const unit = n === 1 ? TW.t("explore_result_one") : TW.t("explore_results");
      const viewLabel =
        view === "editors"
          ? TW.t("explore_view_editors")
          : view === "themes"
            ? TW.t("explore_view_themes")
            : TW.t("explore_view_all");
      return n + " " + unit + " · " + viewLabel;
    }

    function renderViewModes() {
      const allN = applySearch(allRoutes()).length;
      const edN = applySearch(editorsRoutes()).length;
      const modes = [
        { id: "all", label: TW.t("explore_view_all"), n: allN },
        { id: "editors", label: TW.t("explore_view_editors"), n: edN },
        { id: "themes", label: TW.t("explore_view_themes"), n: allN },
      ];
      document.getElementById("viewModes").innerHTML = modes
        .map(
          (m) =>
            `<button type="button" class="explore-view-chip${m.id === view ? " active" : ""}" data-view="${m.id}">
              ${m.label} <span class="n">${m.n}</span>
            </button>`
        )
        .join("");
    }

    function renderSubChips(pool) {
      const row = document.getElementById("subChips");
      const filters = (TW.trailFilters || []).filter((f) => f.id !== "all");
      let html =
        `<button type="button" class="chip${theme === "all" ? " active" : ""}" data-theme="all">${TW.t("filter_all")} (${pool.length})</button>` +
        filters
          .map((f) => {
            const n = pool.filter((t) => (t.tags || []).indexOf(f.id) >= 0).length;
            return `<button type="button" class="chip${theme === f.id ? " active" : ""}" data-theme="${f.id}">${TW.t(f.labelKey)} (${n})</button>`;
          })
          .join("");
      if (view === "themes") {
        html +=
          `<p class="explore-chip-label">${TW.t("explore_theme_areas")}</p>` +
          `<button type="button" class="chip${area === "all" ? " active" : ""}" data-area="all">${TW.t("all_districts")} (${pool.length})</button>` +
          TW.districts
            .map((d) => {
              const n = pool.filter((t) => t.district === d.id).length;
              const name = TW.getLang() === "zh" ? d.nameZh : d.name;
              return `<button type="button" class="chip${area === d.id ? " active" : ""}" data-area="${d.id}">${name} (${n})</button>`;
            })
            .join("");
      }
      row.innerHTML = html;
      row.hidden = false;
    }

    function renderMap(list) {
      const wrap = document.getElementById("exploreMapWrap");
      const grid = document.getElementById("trailGrid");
      const split = document.getElementById("exploreSplit");
      const btn = document.getElementById("toggleMapView");
      wrap.hidden = !mapMode;
      grid.hidden = !!mapMode;
      if (split) split.classList.toggle("is-map", mapMode);
      btn.textContent = mapMode ? TW.t("explore_grid_view") : TW.t("explore_map_view");
      btn.classList.toggle("btn-secondary", mapMode);
      btn.classList.toggle("btn-primary", !mapMode);
      if (!mapMode) return;
      if (!exploreMap) {
        exploreMap = L.map("exploreMap", { scrollWheelZoom: false }).setView(TW.hkCenter || [22.32, 114.17], 11);
        TW.addMapTiles(exploreMap);
        if (TW.prepareLeafletMap) TW.prepareLeafletMap(exploreMap);
      }
      if (exploreLayer) exploreLayer.remove();
      exploreLayer = L.layerGroup().addTo(exploreMap);
      const bounds = [];
      list.forEach((t) => {
        if (t.lat == null || t.lng == null) return;
        bounds.push([t.lat, t.lng]);
        const name = TW.tt(t, "title");
        const href = routeDetailHref(t);
        const marker = L.marker([t.lat, t.lng]).addTo(exploreLayer);
        marker.bindTooltip(name, { direction: "top", opacity: 0.95 });
        marker.on("click", () => {
          location.href = href;
        });
      });
      setTimeout(() => {
        exploreMap.invalidateSize();
        if (bounds.length) exploreMap.fitBounds(bounds, { padding: [28, 28], maxZoom: 13 });
      }, 80);
    }

    function renderAll() {
      const searched = applySearch(baseForView());
      renderViewModes();
      const savedTheme = theme;
      const savedArea = area;
      theme = "all";
      area = "all";
      const forCounts = applySearch(baseForView());
      theme = savedTheme;
      area = savedArea;
      renderSubChips(forCounts);

      document.getElementById("listCount").textContent = resultCountLabel(searched.length);
      document.getElementById("trailGrid").innerHTML = searched.length
        ? searched.map((t) => renderTrailCard(t, { hidePlan: true })).join("")
        : TW.emptyStateHtml(TW.t("no_trails"), TW.t("explore_clear_filters"), 'id="exploreClear"');
      const clearEx = document.getElementById("exploreClear");
      if (clearEx) {
        clearEx.addEventListener("click", () => {
          query = "";
          district = "all";
          difficulty = "all";
          duration = "all";
          distanceBand = "all";
          document.getElementById("trailSearch").value = "";
          document.getElementById("districtFilter").value = "all";
          document.getElementById("durationFilter").value = "all";
          document.getElementById("distanceFilter").value = "all";
          difficulty = "all";
          document.querySelectorAll("#diffFilter .chip").forEach((c) => c.classList.toggle("active", c.dataset.diff === "all"));
          renderAll();
        });
      }
      renderMap(searched);
    }

    const distSel = document.getElementById("districtFilter");
    distSel.innerHTML =
      `<option value="all">${TW.t("all_districts")}</option>` +
      TW.districts
        .map((d) => `<option value="${d.id}">${TW.getLang() === "zh" ? d.nameZh : d.name}</option>`)
        .join("");

    ["durationFilter", "distanceFilter"].forEach((id) => {
      const sel = document.getElementById(id);
      sel.querySelectorAll("option[data-i18n]").forEach((opt) => {
        opt.textContent = TW.t(opt.getAttribute("data-i18n"));
      });
    });

    function updateDiffHint() {
      const el = document.getElementById("diffHint");
      if (difficulty === "all") el.textContent = "1 " + TW.t("easy") + " → 5 " + TW.t("expert");
      else el.textContent = TW.t("level") + " " + difficulty + " · " + difficultyLabel(+difficulty);
    }
    updateDiffHint();

    document.getElementById("viewModes").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-view]");
      if (!btn) return;
      view = btn.dataset.view;
      theme = "all";
      area = "all";
      renderAll();
    });
    document.getElementById("subChips").addEventListener("click", (e) => {
      const themeBtn = e.target.closest("[data-theme]");
      const areaBtn = e.target.closest("[data-area]");
      if (themeBtn) theme = themeBtn.dataset.theme;
      if (areaBtn) area = areaBtn.dataset.area;
      if (themeBtn || areaBtn) renderAll();
    });

    distSel.addEventListener("change", () => {
      district = distSel.value;
      renderAll();
    });
    document.getElementById("durationFilter").addEventListener("change", (e) => {
      duration = e.target.value;
      renderAll();
    });
    document.getElementById("distanceFilter").addEventListener("change", (e) => {
      distanceBand = e.target.value;
      renderAll();
    });
    document.querySelectorAll("#diffFilter .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll("#diffFilter .chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        difficulty = chip.dataset.diff;
        updateDiffHint();
        renderAll();
      });
    });
    document.getElementById("trailSearch").addEventListener("input", (e) => {
      query = e.target.value;
      if (activeTab === "records") renderRecords();
      else if (activeTab === "incidents") renderIncidents();
      else renderAll();
    });
    document.getElementById("trailSearch").addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      e.target.value = "";
      query = "";
      renderAll();
    });
    document.getElementById("toggleMapView").addEventListener("click", () => {
      mapMode = !mapMode;
      renderAll();
    });
    window.addEventListener("resize", () => {
      if (activeTab === "routes" && mapMode && exploreMap) {
        setTimeout(() => exploreMap.invalidateSize(), 80);
      }
    });

    function parseRecordHours(r) {
      const s = String(r.duration || "");
      const hm = /^(\d+):(\d+)/.exec(s);
      if (hm) return +hm[1] + +hm[2] / 60;
      const h = /(\d+(?:\.\d+)?)\s*h/i.exec(s);
      const m = /(\d+)\s*m/i.exec(s);
      return (h ? +h[1] : 0) + (m ? +m[1] / 60 : 0);
    }

    function recordIsoDate(r) {
      if (typeof TW.recordDateValue === "function") {
        const d = TW.recordDateValue(r);
        if (d && !isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      }
      const d = TW.parseReportDate ? TW.parseReportDate(r.date) : new Date(r.date);
      if (d && !isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      return "";
    }

    function recordKm(r) {
      if (r.distanceKm != null) return +r.distanceKm;
      const m = /([\d.]+)\s*km/i.exec(String(r.distance || ""));
      return m ? +m[1] : NaN;
    }

    function recordTags(r) {
      return r.tags || r.categories || [];
    }

    function renderRecordTagChips() {
      const row = document.getElementById("recordTags");
      if (!row) return;
      const filters = (TW.trailFilters || []).filter((f) => f.id !== "all");
      row.innerHTML =
        `<button type="button" class="chip${recTag === "all" ? " active" : ""}" data-tag="all">${TW.t("filter_all")}</button>` +
        filters
          .map(
            (f) =>
              `<button type="button" class="chip${recTag === f.id ? " active" : ""}" data-tag="${f.id}">${TW.t(f.labelKey)}</button>`
          )
          .join("");
    }

    function filteredRecords() {
      const q = query.trim().toLowerCase();
      return (TW.getUserRoutes ? TW.getUserRoutes() : []).concat(TW.records || []).filter((r) => {
        const hay = (
          TW.tt(r, "title") +
          " " +
          TW.tt(r, "snippet") +
          " " +
          (r.user || "") +
          " " +
          (r.region || "") +
          " " +
          recordTags(r).join(" ")
        ).toLowerCase();
        if (q && hay.indexOf(q) < 0) return false;

        const privacy = String(r.privacy || "Public").toLowerCase();
        if (recPeople === "public") {
          if (privacy !== "public" && privacy !== "") return false;
        } else if (recPeople === "friends") {
          if (privacy === "friends" || privacy === "friend") {
            /* ok */
          } else if (typeof TW.recordIsFriend === "function") {
            if (!TW.recordIsFriend(r)) return false;
          } else {
            return false;
          }
        }

        if (recTag !== "all" && recordTags(r).indexOf(recTag) < 0) return false;
        if (recDiff !== "all" && String(r.difficulty || "") !== String(recDiff)) return false;

        const hrs = parseRecordHours(r);
        const matchDur =
          recDuration === "all" ||
          (recDuration === "short" && hrs > 0 && hrs < 2) ||
          (recDuration === "mid" && hrs >= 2 && hrs <= 4) ||
          (recDuration === "long" && hrs > 4);
        if (!matchDur) return false;

        const km = recordKm(r);
        const matchDist =
          recDistance === "all" ||
          (recDistance === "short" && km < 8) ||
          (recDistance === "mid" && km >= 8 && km <= 15) ||
          (recDistance === "long" && km > 15);
        if (!matchDist) return false;

        const iso = recordIsoDate(r);
        if (recFrom && iso && iso < recFrom) return false;
        if (recTo && iso && iso > recTo) return false;
        return true;
      });
    }

    function renderRecords() {
      renderRecordTagChips();
      const list = filteredRecords();
      document.getElementById("exploreRecords").innerHTML = list.length
        ? list.map(renderRecordItem).join("")
        : TW.emptyStateHtml(TW.t("explore_records_empty"), TW.t("explore_clear_filters"), 'id="recordClear"');
      const clear = document.getElementById("recordClear");
      if (clear) {
        clear.addEventListener("click", () => {
          query = "";
          recPeople = "public";
          recDuration = "all";
          recDistance = "all";
          recDiff = "all";
          recTag = "all";
          recFrom = "";
          recTo = "";
          document.getElementById("trailSearch").value = "";
          document.getElementById("recordDuration").value = "all";
          document.getElementById("recordDistance").value = "all";
          document.getElementById("recordFrom").value = "";
          document.getElementById("recordTo").value = "";
          document.querySelectorAll("#recordPeople .chip").forEach((c) =>
            c.classList.toggle("active", c.dataset.people === "public")
          );
          document.querySelectorAll("#recordDiff .chip").forEach((c) =>
            c.classList.toggle("active", c.dataset.diff === "all")
          );
          renderRecords();
        });
      }
    }

    const incCats = [
      { id: "all", labelKey: "filter_all" },
      { id: "waste", labelKey: "cat_waste" },
      { id: "tree", labelKey: "cat_tree" },
      { id: "carcass", labelKey: "cat_carcass" },
      { id: "vandalism", labelKey: "cat_vandalism" },
      { id: "suspicious", labelKey: "cat_suspicious" },
      { id: "river", labelKey: "cat_river" },
      { id: "concrete", labelKey: "cat_concrete" },
      { id: "marine", labelKey: "cat_marine" },
      { id: "danger", labelKey: "cat_danger" },
      { id: "others", labelKey: "cat_others" },
    ];

    function incList() {
      const list = typeof TW.getCommunityReports === "function"
        ? TW.getCommunityReports({ dateRange: incDate, category: incCat, status: incStatus })
        : [];
      const q = query.trim().toLowerCase();
      if (!q) return list;
      return list.filter((r) => {
        const hay = (
          TW.tt(r, "title") +
          " " +
          TW.tt(r, "desc") +
          " " +
          (r.category || "") +
          " " +
          (r.categoryLabel || "") +
          " " +
          (r.reporter || "")
        ).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }

    function renderIncidents() {
      const list = incList();
      document.getElementById("exploreIncCats").innerHTML = incCats
        .map((c) => {
          const n =
            c.id === "all"
              ? TW.getCommunityReports({ dateRange: incDate, status: incStatus }).length
              : TW.getCommunityReports({ dateRange: incDate, category: c.id, status: incStatus }).length;
          return `<button type="button" class="chip${incCat === c.id ? " active" : ""}" data-cat="${c.id}">${TW.t(c.labelKey)} (${n})</button>`;
        })
        .join("");
      document.getElementById("exploreIncList").innerHTML =
        list.map(renderReportItem).join("") ||
        TW.emptyStateHtml(TW.t("empty_incidents_district"), TW.t("empty_change_filter"), 'id="incReset"');
      const reset = document.getElementById("incReset");
      if (reset) {
        reset.addEventListener("click", () => {
          incDate = "all";
          incCat = "all";
          incStatus = "all";
          query = "";
          document.getElementById("exploreIncDate").value = "all";
          document.getElementById("exploreIncStatus").value = "all";
          document.getElementById("trailSearch").value = "";
          renderIncidents();
        });
      }
      if (!incMap) {
        incMap = L.map("exploreIncMap", { scrollWheelZoom: false }).setView([22.32, 114.17], 11);
        TW.addMapTiles(incMap);
        if (TW.prepareLeafletMap) TW.prepareLeafletMap(incMap);
      }
      incMarkers.forEach((m) => incMap.removeLayer(m));
      incMarkers = [];
      const bounds = [];
      list.forEach((r) => {
        if (r.lat == null || r.lng == null) return;
        const icon = L.divIcon({
          className: "",
          html: `<div style="background:#d64545;color:white;padding:4px 8px;border-radius:8px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)">⚠</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });
        const href = "incident-detail.html?id=" + encodeURIComponent(r.id || r.sourceId || "");
        incMarkers.push(
          L.marker([r.lat, r.lng], { icon })
            .addTo(incMap)
            .bindPopup(
              `<a href="${href}"><strong>${TW.escapeHtml(TW.tt(r, "title"))}</strong></a><br/>${TW.escapeHtml(r.date || "")}`
            )
        );
        bounds.push([r.lat, r.lng]);
      });
      setTimeout(() => {
        incMap.invalidateSize();
        if (bounds.length) incMap.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
        else incMap.setView([22.32, 114.17], 11);
      }, 80);
    }

    function syncTabChrome(tab) {
      const onRoutes = tab === "routes";
      const viewModes = document.getElementById("viewModes");
      const subChips = document.getElementById("subChips");
      const mapBtn = document.getElementById("toggleMapView");
      viewModes.hidden = !onRoutes;
      subChips.hidden = !onRoutes;
      mapBtn.hidden = !onRoutes;
      viewModes.classList.toggle("is-hidden", !onRoutes);
      subChips.classList.toggle("is-hidden", !onRoutes);
      mapBtn.classList.toggle("is-hidden", !onRoutes);
      const routeAdv = document.getElementById("routeAdvanced");
      const recAdv = document.getElementById("recordFilters");
      const incAdv = document.getElementById("incidentFilters");
      routeAdv.hidden = tab !== "routes";
      recAdv.hidden = tab !== "records";
      incAdv.hidden = tab !== "incidents";
      routeAdv.classList.toggle("is-hidden", tab !== "routes");
      recAdv.classList.toggle("is-hidden", tab !== "records");
      incAdv.classList.toggle("is-hidden", tab !== "incidents");
      const ph =
        tab === "records"
          ? TW.t("community_records")
          : tab === "incidents"
            ? TW.t("reports_title")
            : TW.t("search_placeholder");
      document.getElementById("trailSearch").placeholder = ph;
    }

    function showExploreTab(tab) {
      activeTab = tab;
      ["routes", "records", "incidents"].forEach((id) => {
        document.getElementById("view-" + id).classList.toggle("hidden", id !== tab);
      });
      document.querySelectorAll("#exploreTabs .tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.tab === tab);
      });
      syncTabChrome(tab);
      if (tab === "records") renderRecords();
      if (tab === "incidents") renderIncidents();
      if (tab === "routes" && mapMode && exploreMap) setTimeout(() => exploreMap.invalidateSize(), 80);
    }

    ["recordDuration", "recordDistance", "exploreIncDate", "exploreIncStatus"].forEach((id) => {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.querySelectorAll("option[data-i18n]").forEach((opt) => {
        opt.textContent = TW.t(opt.getAttribute("data-i18n"));
      });
    });
    document.getElementById("recordPeople").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-people]");
      if (!btn) return;
      recPeople = btn.dataset.people;
      document.querySelectorAll("#recordPeople .chip").forEach((c) => c.classList.toggle("active", c === btn));
      renderRecords();
    });
    document.getElementById("recordTags").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tag]");
      if (!btn) return;
      recTag = btn.dataset.tag;
      renderRecords();
    });
    document.getElementById("recordDiff").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-diff]");
      if (!btn) return;
      recDiff = btn.dataset.diff;
      document.querySelectorAll("#recordDiff .chip").forEach((c) => c.classList.toggle("active", c === btn));
      renderRecords();
    });
    document.getElementById("recordDuration").addEventListener("change", (e) => {
      recDuration = e.target.value;
      renderRecords();
    });
    document.getElementById("recordDistance").addEventListener("change", (e) => {
      recDistance = e.target.value;
      renderRecords();
    });
    document.getElementById("recordFrom").addEventListener("change", (e) => {
      recFrom = e.target.value || "";
      renderRecords();
    });
    document.getElementById("recordTo").addEventListener("change", (e) => {
      recTo = e.target.value || "";
      renderRecords();
    });
    document.getElementById("exploreIncDate").addEventListener("change", (e) => {
      incDate = e.target.value || "6m";
      renderIncidents();
    });
    document.getElementById("exploreIncStatus").addEventListener("change", (e) => {
      incStatus = e.target.value || "all";
      renderIncidents();
    });
    document.getElementById("exploreIncCats").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      incCat = btn.dataset.cat;
      renderIncidents();
    });

    bindTabs("#exploreTabs", showExploreTab);
    const params = new URLSearchParams(location.search);
    const startTab = params.get("tab") === "incidents" ? "incidents" : params.get("tab") === "records" ? "records" : "routes";
    showExploreTab(startTab);
    renderAll();
    syncTabChrome(startTab);
  </script>
</body>
</html>
