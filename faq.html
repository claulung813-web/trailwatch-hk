<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQ — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:720px">
      <h1 class="page-title" data-i18n="footer_faq"></h1>
      <p class="page-sub" data-i18n="faq_sub"></p>
      <div id="faqList" class="faq-list"></div>
      <p style="margin-top:1.5rem">
        <a class="btn btn-secondary" href="about.html#contact" data-i18n="footer_contact"></a>
        <a class="btn btn-primary" href="about.html#feedback" data-i18n="feedback_title"></a>
      </p>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("about");

    function faqEsc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatFaqAnswer(raw) {
      const text = String(raw || "").trim();
      if (!text) return "";
      const linkify = (s) =>
        faqEsc(s).replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener">$1</a>'
        );
      return text
        .split(/\n\n+/)
        .map((block) => {
          const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
          if (lines.length > 1 && lines.every((l) => /^[•\-–—]/.test(l))) {
            return (
              "<ul>" +
              lines.map((l) => "<li>" + linkify(l.replace(/^[•\-–—]\s*/, "")) + "</li>").join("") +
              "</ul>"
            );
          }
          return "<p>" + linkify(block).replace(/\n/g, "<br>") + "</p>";
        })
        .join("");
    }

    const list = document.getElementById("faqList");
    const items = typeof TW.getFaqItems === "function" ? TW.getFaqItems() : [];
    const zh = TW.getLang() === "zh";
    list.innerHTML = items
      .map((it) => {
        const q = zh ? it.qZh || it.qEn : it.qEn || it.qZh;
        const a = zh ? it.aZh || it.aEn : it.aEn || it.aZh;
        if (!q) return "";
        return `<details class="faq-item">
          <summary class="faq-summary">
            <span class="faq-q">${faqEsc(q)}</span>
            <span class="faq-chevron" aria-hidden="true"></span>
          </summary>
          <div class="faq-answer">${formatFaqAnswer(a)}</div>
        </details>`;
      })
      .join("") || `<p class="page-sub">${TW.t("article_empty")}</p>`;

    // Accordion: opening one closes others (optional UX; still expandable/collapsible)
    list.addEventListener("toggle", (e) => {
      const el = e.target;
      if (!(el instanceof HTMLDetailsElement) || !el.open) return;
      list.querySelectorAll("details.faq-item[open]").forEach((d) => {
        if (d !== el) d.open = false;
      });
    });
  </script>
</body>
</html>
