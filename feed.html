<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trail Feed — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="feed_title"></h1>
      <p class="page-sub" data-i18n="feed_sub"></p>

      <div class="tw-toolbar">
        <div class="search-bar">
          <input type="search" id="feedSearch" data-i18n-placeholder="feed_search_ph" />
        </div>
        <div class="chip-row filters" id="feedFilters" role="toolbar">
          <button type="button" class="chip active" data-f="all" data-i18n="feed_filter_all"></button>
          <button type="button" class="chip" data-f="friends" data-i18n="feed_filter_friends"></button>
          <button type="button" class="chip" data-f="official" data-i18n="feed_filter_official"></button>
          <button type="button" class="chip" data-f="Record" data-i18n="feed_filter_records"></button>
          <button type="button" class="chip" data-f="Group Hike" data-i18n="feed_filter_groups"></button>
        </div>
        <details class="tw-advanced">
          <summary data-i18n="toolbar_advanced"></summary>
          <div class="tw-advanced-body">
            <div class="gallery-filter-field">
              <label for="feedDateFrom" data-i18n="gallery_date_from"></label>
              <input class="form-input" type="date" id="feedDateFrom" />
            </div>
            <div class="gallery-filter-field">
              <label for="feedDateTo" data-i18n="gallery_date_to"></label>
              <input class="form-input" type="date" id="feedDateTo" />
            </div>
          </div>
        </details>
      </div>

      <div class="explore-toolbar">
        <h2 class="explore-count" id="feedCount"></h2>
      </div>

      <section class="feed-section" id="feedPinnedSection" hidden>
        <h2 class="articles-section-title articles-section-title--sm" data-i18n="feed_pinned_heading"></h2>
        <div id="feedPinned"></div>
      </section>

      <section class="feed-section">
        <h2 class="articles-section-title articles-section-title--sm" id="feedMainHeading" data-i18n="feed_friends_heading"></h2>
        <div id="feedList"></div>
        <div id="feedEmpty" hidden></div>
      </section>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("feed");

    let filter = "all";
    let q = "";

    function feedDate(p) {
      if (p.dateISO) {
        const t = Date.parse(p.dateISO);
        if (Number.isFinite(t)) return t;
      }
      return 0;
    }

    function channelOf(p) {
      if (p.channel) return p.channel;
      if (p.pinned || p.user === "TrailWatch" || /Sponsored|Announcement|Promo/i.test(p.tag || "")) return "official";
      if (/Sponsored|Ad/i.test(p.tag || "")) return "ad";
      return "friends";
    }

    function matches(p) {
      const tag = p.tag || "";
      const ch = channelOf(p);
      let okF = true;
      if (filter === "friends") okF = ch === "friends";
      else if (filter === "official") okF = ch === "official" || ch === "ad" || p.pinned;
      else if (filter !== "all") okF = tag === filter || (filter === "Community" && /Community|Story|Sponsored|Announcement/i.test(tag));
      const text = ((p.title || "") + " " + (p.body || "") + " " + (p.user || "") + " " + tag).toLowerCase();
      const okQ = !q || text.includes(q);
      const from = document.getElementById("feedDateFrom").value;
      const to = document.getElementById("feedDateTo").value;
      const ts = feedDate(p);
      let okD = true;
      if (from && ts && ts < Date.parse(from)) okD = false;
      if (to && ts && ts > Date.parse(to) + 86400000 - 1) okD = false;
      if ((from || to) && !ts) okD = false;
      return okF && okQ && okD;
    }

    function render() {
      const items = (TW.feed || []).filter(matches);
      const pinned = items.filter((p) => p.pinned);
      const rest = items.filter((p) => !p.pinned);
      const pinWrap = document.getElementById("feedPinnedSection");
      pinWrap.hidden = !pinned.length || filter === "friends";
      document.getElementById("feedPinned").innerHTML = pinned.map(renderFeedCard).join("");
      document.getElementById("feedList").innerHTML = rest.map(renderFeedCard).join("");
      document.getElementById("feedCount").textContent =
        items.length + " · " + TW.t(filter === "friends" ? "feed_friends_heading" : filter === "official" ? "feed_official_heading" : "feed_title");
      const empty = document.getElementById("feedEmpty");
      if (!items.length) {
        empty.hidden = false;
        empty.innerHTML = TW.emptyStateHtml(TW.t("feed_empty"), TW.t("feed_clear_filters"), 'id="feedClearBtn"');
        const clear = document.getElementById("feedClearBtn");
        if (clear) {
          clear.addEventListener("click", () => {
            q = "";
            filter = "all";
            document.getElementById("feedSearch").value = "";
            document.getElementById("feedDateFrom").value = "";
            document.getElementById("feedDateTo").value = "";
            document.querySelectorAll("#feedFilters .chip").forEach((c) => c.classList.toggle("active", c.dataset.f === "all"));
            render();
          });
        }
      } else empty.hidden = true;
      bindLikes();
    }

    document.getElementById("feedFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll("#feedFilters .chip").forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    document.getElementById("feedSearch").addEventListener("input", (e) => {
      q = e.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById("feedDateFrom").addEventListener("change", render);
    document.getElementById("feedDateTo").addEventListener("change", render);

    document.addEventListener("click", (e) => {
      const join = e.target.closest(".join-group-btn");
      if (!join) return;
      e.preventDefault();
      if (!TW.requireLogin({ messageKey: "login_to_join" })) return;
      showToast(TW.t("toast_joined"));
    });

    render();
  </script>
</body>
</html>
