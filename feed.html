<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Feed — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260826e" />
</head>
<body class="page-feed">
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="feed_title"></h1>

      <div class="tw-toolbar">
        <div class="search-bar">
          <input type="search" id="feedSearch" data-i18n-placeholder="feed_search_ph" />
        </div>
        <div class="chip-row filters" id="feedFilters" role="toolbar">
          <button type="button" class="chip active" data-f="all" data-i18n="feed_filter_all"></button>
          <button type="button" class="chip" data-f="record" data-i18n="feed_filter_records"></button>
          <button type="button" class="chip" data-f="route" data-i18n="feed_filter_routes"></button>
          <button type="button" class="chip" data-f="incident" data-i18n="feed_filter_incidents"></button>
          <button type="button" class="chip" data-f="group" data-i18n="feed_filter_groups"></button>
          <button type="button" class="chip" data-f="announcement" data-i18n="feed_filter_announce"></button>
          <button type="button" class="chip" data-f="promo" data-i18n="feed_filter_promo"></button>
        </div>
        <div class="tw-advanced-body feed-dates">
          <div class="gallery-filter-field">
            <label for="feedDateFrom" data-i18n="gallery_date_from"></label>
            <input class="form-input" type="date" id="feedDateFrom" />
          </div>
          <div class="gallery-filter-field">
            <label for="feedDateTo" data-i18n="gallery_date_to"></label>
            <input class="form-input" type="date" id="feedDateTo" />
          </div>
        </div>
      </div>

      <div id="feedList" class="feed-list"></div>
      <div id="feedEmpty" hidden></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js?v=20260826e"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/hikes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js?v=20260826e"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("feed");

    let filter = "all";
    let q = "";

    function feedDate(p) {
      if (p.dateISO) {
        const t = Date.parse(p.dateISO);
        if (Number.isFinite(t)) return t;
      }
      if (p.createdAt) {
        const t = Date.parse(p.createdAt);
        if (Number.isFinite(t)) return t;
      }
      return 0;
    }

    function typeOf(p) {
      if (p.type) return p.type;
      const tag = p.tag || "";
      if (/Record/i.test(tag)) return "record";
      if (/Route/i.test(tag)) return "route";
      if (/Incident/i.test(tag)) return "incident";
      if (/Group/i.test(tag)) return "group";
      if (/Announcement/i.test(tag)) return "announcement";
      if (/Sponsored|Promo|Ad|PnT/i.test(tag)) return "promo";
      return "community";
    }

    function matches(p) {
      const typ = typeOf(p);
      let okF = true;
      if (filter === "promo") okF = typ === "promo" || typ === "ad" || p.channel === "ad";
      else if (filter !== "all") okF = typ === filter;
      const text = ((p.title || "") + " " + (p.titleZh || "") + " " + (p.body || "") + " " + (p.bodyZh || "") + " " + (p.user || "") + " " + (p.tag || "")).toLowerCase();
      const okQ = !q || text.includes(q);
      const from = document.getElementById("feedDateFrom").value;
      const to = document.getElementById("feedDateTo").value;
      const ts = feedDate(p);
      let okD = true;
      if (from && ts && ts < Date.parse(from)) okD = false;
      if (to && ts && ts > Date.parse(to) + 86400000 - 1) okD = false;
      if ((from || to) && !ts) okD = false;
      return okF && okQ && okD;
    }

    function sortFeed(items) {
      return items.slice().sort((a, b) => {
        if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
        return feedDate(b) - feedDate(a);
      });
    }

    function render() {
      const items = sortFeed((TW.allFeedPosts ? TW.allFeedPosts() : TW.feed || []).filter(matches));
      document.getElementById("feedList").innerHTML = items
        .map((p) => renderFeedCard(p, { layout: "ig", hideComments: true }))
        .join("");
      const empty = document.getElementById("feedEmpty");
      if (!items.length) {
        empty.hidden = false;
        empty.innerHTML = TW.emptyStateHtml(TW.t("feed_empty"), TW.t("feed_clear_filters"), 'id="feedClearBtn"');
        const clear = document.getElementById("feedClearBtn");
        if (clear) {
          clear.addEventListener("click", () => {
            q = "";
            filter = "all";
            document.getElementById("feedSearch").value = "";
            document.getElementById("feedDateFrom").value = "";
            document.getElementById("feedDateTo").value = "";
            document.querySelectorAll("#feedFilters .chip").forEach((c) => c.classList.toggle("active", c.dataset.f === "all"));
            render();
          });
        }
      } else empty.hidden = true;
      bindLikes();
    }

    document.getElementById("feedFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll("#feedFilters .chip").forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    document.getElementById("feedSearch").addEventListener("input", (e) => {
      q = e.target.value.trim().toLowerCase();
      render();
    });
    document.getElementById("feedDateFrom").addEventListener("change", render);
    document.getElementById("feedDateTo").addEventListener("change", render);

    document.addEventListener("click", (e) => {
      const join = e.target.closest(".join-group-btn");
      if (!join) return;
      e.preventDefault();
      if (!TW.requireLogin({ messageKey: "login_to_join" })) return;
      showToast(TW.t("toast_joined"));
    });

    render();
  </script>
</body>
</html>
