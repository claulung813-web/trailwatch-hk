<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:520px">
      <h1 class="page-title" id="forgotTitle">Reset your password</h1>
      <p class="page-sub" id="forgotSub"></p>
      <form class="card" id="forgotForm" style="padding:1.35rem">
        <div class="form-group">
          <label for="forgotEmail" id="forgotEmailLabel">Email</label>
          <input class="form-input" id="forgotEmail" name="email" type="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgotCta">Send reset link</button>
        <p class="auth-switch">
          <a href="login.html" id="forgotBack">Back to log in</a>
        </p>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("login");
    const zh = TW.getLang() === "zh";
    const copy = zh
      ? {
          title: "重設密碼",
          sub: "輸入帳戶電郵，我們會寄出重設連結。",
          email: "電郵",
          cta: "寄出重設連結",
          back: "返回登入",
          thanks: "若此電郵已有帳戶，重設連結即將寄出。",
          ph: "you@email.com",
        }
      : {
          title: "Reset your password",
          sub: "Enter the email for your account and we’ll send a reset link.",
          email: "Email",
          cta: "Send reset link",
          back: "Back to log in",
          thanks: "If an account exists for that email, a reset link is on its way.",
          ph: "you@email.com",
        };
    document.getElementById("forgotTitle").textContent = copy.title;
    document.getElementById("forgotSub").textContent = copy.sub;
    document.getElementById("forgotEmailLabel").textContent = copy.email;
    document.getElementById("forgotCta").textContent = copy.cta;
    document.getElementById("forgotBack").textContent = copy.back;
    document.getElementById("forgotEmail").placeholder = copy.ph;
    const next = new URLSearchParams(location.search).get("next");
    if (next) document.getElementById("forgotBack").href = "login.html?next=" + encodeURIComponent(next);
    document.getElementById("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value;
      if (typeof CMS !== "undefined" && CMS.recordAuthEvent) {
        CMS.recordAuthEvent({ type: "forgot", email: email, source: "website" });
      }
      showToast(copy.thanks);
      const dest = "login.html" + (next ? "?next=" + encodeURIComponent(next) : "");
      setTimeout(() => { location.href = dest; }, 900);
    });
  </script>
</body>
</html>
