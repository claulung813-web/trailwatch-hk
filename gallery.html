<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="gallery_title"></h1>
      <p class="page-sub" data-i18n="gallery_sub"></p>

      <div class="tw-toolbar gallery-toolbar">
        <div class="gallery-filters" style="margin:0">
          <div class="gallery-filter-field">
            <label for="galleryDateFrom" data-i18n="gallery_date_from"></label>
            <input class="form-input" type="date" id="galleryDateFrom" />
          </div>
          <div class="gallery-filter-field">
            <label for="galleryDateTo" data-i18n="gallery_date_to"></label>
            <input class="form-input" type="date" id="galleryDateTo" />
          </div>
        </div>
      </div>

      <section class="gallery-section" aria-labelledby="galleryAllHeading">
        <div class="gallery-section-head">
          <h2 id="galleryAllHeading" class="articles-section-title articles-section-title--sm" data-i18n="gallery_all"></h2>
          <span class="meta" id="galleryCount"></span>
        </div>
        <div class="gallery-card-grid" id="galleryGrid"></div>
        <div class="gallery-empty" id="galleryEmpty" hidden></div>
      </section>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    if (new URLSearchParams(location.search).get("mine") === "1") {
      location.replace("profile.html#activity&type=gallery");
    } else {
    initShell("gallery");

    function esc(s) {
      return TW.escapeHtml ? TW.escapeHtml(s) : String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function filterOpts() {
      return {
        twOnly: true,
        dateFrom: document.getElementById("galleryDateFrom").value,
        dateTo: document.getElementById("galleryDateTo").value,
        sort: "newest",
      };
    }

    function routeLabel(p) {
      if (!p.routeId) return "";
      const trail = (TW.trails || []).find((t) => t.id === p.routeId);
      if (!trail) return p.routeId;
      return TW.tt ? TW.tt(trail, "title") : (TW.getLang() === "zh" ? trail.titleZh || trail.title : trail.title);
    }

    function renderPhotoCard(p) {
      const zh = TW.getLang() === "zh";
      const desc = zh ? p.descriptionZh || p.description : p.description;
      const href = TW.galleryRouteHref(p);
      const route = routeLabel(p);
      return `
        <article class="gallery-card media-card">
          <a class="gallery-card-media" href="${esc(href)}">
            <img src="${esc(p.src)}" alt="${esc(desc || route || p.date || "Photo")}" loading="lazy" onerror="this.closest('article').remove()" />
          </a>
          <div class="gallery-card-body">
            <div class="gallery-card-meta">
              <time datetime="${esc(p.date)}">${esc(p.date)}</time>
            </div>
            <p class="gallery-card-desc">${esc(desc || "")}</p>
            <div class="gallery-card-links">
              ${route ? `<a href="${esc(href)}">${esc(route)}</a>` : ""}
            </div>
          </div>
        </article>`;
    }

    function refresh() {
      const list = TW.getGalleryPhotos(filterOpts());
      document.getElementById("galleryGrid").innerHTML = list.map(renderPhotoCard).join("");
      document.getElementById("galleryCount").textContent = list.length + " " + TW.t("gallery_photos_count");
      const empty = document.getElementById("galleryEmpty");
      if (!list.length) {
        empty.hidden = false;
        empty.innerHTML = TW.emptyStateHtml(TW.t("empty_gallery_date"), TW.t("empty_change_filter"), 'id="galleryEmptyClear"');
        const clearBtn = document.getElementById("galleryEmptyClear");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            document.getElementById("galleryDateFrom").value = "";
            document.getElementById("galleryDateTo").value = "";
            refresh();
          });
        }
      } else {
        empty.hidden = true;
        empty.innerHTML = "";
      }
    }

    document.getElementById("galleryDateFrom").addEventListener("change", refresh);
    document.getElementById("galleryDateTo").addEventListener("change", refresh);
    refresh();
    }
  </script>
</body>
</html>
