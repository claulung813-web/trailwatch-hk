<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260828i" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="gallery_title"></h1>

      <div class="tw-toolbar gallery-toolbar">
        <div class="articles-cat-filter">
          <div
            class="chip-row articles-cat-chips"
            id="galleryCategoryFilter"
            role="toolbar"
            aria-label="Gallery categories"
          ></div>
        </div>
        <div class="gallery-filters" style="margin:0">
          <div class="gallery-filter-field">
            <label for="galleryDateFrom" data-i18n="gallery_date_from"></label>
            <input class="form-input" type="date" id="galleryDateFrom" />
          </div>
          <div class="gallery-filter-field">
            <label for="galleryDateTo" data-i18n="gallery_date_to"></label>
            <input class="form-input" type="date" id="galleryDateTo" />
          </div>
        </div>
      </div>

      <div class="gallery-photo-grid" id="galleryGrid"></div>
      <div class="gallery-empty" id="galleryEmpty" hidden></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js?v=20260828i"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    if (new URLSearchParams(location.search).get("mine") === "1") {
      location.replace("profile.html#activity&type=gallery");
    } else {
    initShell("gallery");

    let activeCategory = "all";

    function esc(s) {
      return TW.escapeHtml ? TW.escapeHtml(s) : String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderCategoryChips() {
      const row = document.getElementById("galleryCategoryFilter");
      row.innerHTML = (TW.galleryCategories || []).map((c) => {
        const label = TW.t(c.labelKey);
        const isActive = c.id === activeCategory;
        return `<button type="button" class="chip${isActive ? " active" : ""}" data-cat="${esc(c.id)}" aria-pressed="${isActive ? "true" : "false"}">${esc(label)}</button>`;
      }).join("");
      row.querySelectorAll("[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderCategoryChips();
          refresh();
        });
      });
    }

    function filterOpts() {
      return {
        category: activeCategory,
        dateFrom: document.getElementById("galleryDateFrom").value,
        dateTo: document.getElementById("galleryDateTo").value,
        sort: "newest",
      };
    }

    function renderPhotoTile(p) {
      const featured = TW.isGalleryFeatured ? TW.isGalleryFeatured(p) : false;
      const href = TW.galleryRouteHref(p);
      const badge = featured
        ? `<span class="gallery-photo-badge">${esc(TW.t("gallery_featured"))}</span>`
        : "";
      return `
        <a class="gallery-photo${featured ? " gallery-photo--featured" : ""}" href="${esc(href)}" title="${esc(TW.t("gallery_view_record"))}">
          <img src="${esc(p.src)}" alt="" loading="lazy" onerror="this.closest('a')?.remove()" />
          ${badge}
        </a>`;
    }

    function refresh() {
      const list = TW.getGalleryPhotos(filterOpts());
      document.getElementById("galleryGrid").innerHTML = list.map(renderPhotoTile).join("");
      const empty = document.getElementById("galleryEmpty");
      if (!list.length) {
        empty.hidden = false;
        empty.innerHTML = TW.emptyStateHtml(TW.t("empty_gallery_date"), TW.t("empty_change_filter"), 'id="galleryEmptyClear"');
        const clearBtn = document.getElementById("galleryEmptyClear");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            activeCategory = "all";
            document.getElementById("galleryDateFrom").value = "";
            document.getElementById("galleryDateTo").value = "";
            renderCategoryChips();
            refresh();
          });
        }
      } else {
        empty.hidden = true;
        empty.innerHTML = "";
      }
    }

    renderCategoryChips();
    document.getElementById("galleryDateFrom").addEventListener("change", refresh);
    document.getElementById("galleryDateTo").addEventListener("change", refresh);
    refresh();
    }
  </script>
</body>
</html>
