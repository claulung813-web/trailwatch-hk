<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title" data-i18n="gallery_title"></h1>
      <p class="page-sub" data-i18n="gallery_sub"></p>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:1rem" data-i18n="page_coming_filters"></p>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    if (new URLSearchParams(location.search).get("mine") === "1") {
      location.replace("profile.html#activity&type=gallery");
    } else {
    initShell("gallery");
    const mine = false;
    const photos = [
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=60",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&q=60",
      "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=400&q=60",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400&q=60",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&q=60",
      "https://images.unsplash.com/photo-1511497584788-876760111969?w=400&q=60",
      "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&q=60",
      "https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=400&q=60",
    ];
    const list = mine ? photos.slice(0, 4) : photos;
    document.getElementById("galleryGrid").innerHTML = list.map((src, i) =>
      `<a href="explore.html" title="Route photo ${i + 1}"><img src="${src}" alt="" loading="lazy" onerror="this.parentElement.remove()" /></a>`
    ).join("");
    } </script>
</body>
</html>
