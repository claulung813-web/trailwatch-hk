<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrailWatch App — Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .app-intro-hero {
      display: grid;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }
    @media (min-width: 860px) {
      .app-intro-hero {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }
    .app-intro-hero h1 {
      font-size: clamp(1.75rem, 3vw, 2.35rem);
      color: var(--tw-teal);
      margin: 0 0 0.75rem;
      line-height: 1.2;
    }
    .app-intro-hero .lede {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.65;
      margin: 0 0 1.5rem;
      max-width: 36rem;
    }
    .store-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .store-row a img {
      height: 48px;
      width: auto;
      display: block;
    }
    .app-device {
      max-width: 280px;
      width: 100%;
      margin: 0 auto;
      display: block;
    }
    .feature-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      margin-top: 1.25rem;
    }
    .feature-card {
      background: var(--tw-mint);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.2rem;
    }
    .feature-card .fig {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: white;
      color: var(--tw-teal);
      display: grid;
      place-items: center;
      margin-bottom: 0.7rem;
    }
    .feature-card .fig svg { width: 20px; height: 20px; }
    .feature-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      color: var(--tw-teal);
    }
    .feature-card p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .demo-note {
      margin-top: 2rem;
      padding: 1.15rem 1.25rem;
      border-radius: var(--radius);
      background: var(--green-50);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container">
      <section class="app-intro-hero">
        <div>
          <p class="hero-badge" style="display:inline-block;margin-bottom:0.75rem" data-i18n="app_page_badge"></p>
          <h1 data-i18n="app_page_title"></h1>
          <p class="lede" data-i18n="app_page_lede"></p>
          <div class="store-row">
            <a
              href="https://itunes.apple.com/hk/app/trailwatch/id791098937"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Download on the App Store"
            >
              <img src="assets/brand/badge-app-store.webp" alt="Download on the App Store" />
            </a>
            <a
              href="https://play.google.com/store/apps/details?id=com.computancy.countrypark"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Get it on Google Play"
            >
              <img src="assets/brand/badge-google-play.webp" alt="GET IT ON Google Play" />
            </a>
          </div>
          <p style="font-size:0.8rem;color:var(--text-muted);margin:0" data-i18n="app_page_stores_note"></p>
        </div>
        <div>
          <img class="app-device" src="assets/brand/device.webp" alt="TrailWatch app on phone" />
        </div>
      </section>

      <div class="section-head">
        <h2 data-i18n="app_page_why_title"></h2>
      </div>
      <p style="color:var(--text-muted);max-width:40rem;margin-bottom:0.5rem" data-i18n="app_page_why_sub"></p>
      <div class="feature-grid" id="appFeatures"></div>

      <section id="premium" class="home-premium-cta" style="margin-top:2rem">
        <div>
          <strong data-i18n="home_premium_title"></strong>
          <p data-i18n="home_premium_body"></p>
        </div>
        <a class="btn btn-primary" href="login.html" data-i18n="home_premium_cta"></a>
      </section>

      <div class="demo-note">
        <div>
          <strong style="color:var(--tw-teal)" data-i18n="app_page_demo_title"></strong>
          <p style="margin:0.25rem 0 0;font-size:0.875rem;color:var(--text-muted)" data-i18n="app_page_demo_body"></p>
        </div>
        <a class="btn btn-primary" href="app/index.html" data-i18n="app_page_demo_cta"></a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("app");

    const features = [
      { icon: "hikes", titleKey: "app_feat_gps_title", bodyKey: "app_feat_gps_body" },
      { icon: "reports", titleKey: "app_feat_report_title", bodyKey: "app_feat_report_body" },
      { icon: "env", titleKey: "app_feat_env_title", bodyKey: "app_feat_env_body" },
      { icon: "routes", titleKey: "app_feat_plan_title", bodyKey: "app_feat_plan_body" },
      { icon: "trees", titleKey: "app_feat_nature_title", bodyKey: "app_feat_nature_body" },
      { icon: "photos", titleKey: "app_feat_offline_title", bodyKey: "app_feat_offline_body" },
    ];

    document.getElementById("appFeatures").innerHTML = features
      .map(
        (f) => `
      <article class="feature-card">
        <div class="fig">${twIcon(f.icon)}</div>
        <h3>${TW.t(f.titleKey)}</h3>
        <p>${TW.t(f.bodyKey)}</p>
      </article>`
      )
      .join("");
  </script>
</body>
</html>
