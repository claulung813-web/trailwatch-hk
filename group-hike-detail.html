<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group Hike — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    #ghMap { height: 380px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1.25rem; }
    .gh-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      padding: 0.18rem 0.5rem; border-radius: 4px; margin-right: 0.35rem;
    }
    .gh-public { background: #ecfdf5; color: #047857; }
    .gh-private { background: #eff6ff; color: #1d4ed8; }
    .gh-host { background: #fef3c7; color: #92400e; }
    .gh-summary { margin-bottom: 1.25rem; }
    .gh-field { margin-bottom: 0.85rem; }
    .gh-field:last-child { margin-bottom: 0; }
    .gh-field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .gh-field-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--green-900);
      line-height: 1.5;
    }
    .gh-field-value.desc {
      font-weight: 400;
      white-space: pre-wrap;
    }
    .gh-member-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }
    .gh-member-row:last-child { border-bottom: none; }
    .gh-member-row .gh-kick {
      margin-left: auto;
      padding: 0.28rem 0.65rem;
      font-size: 0.75rem;
    }
    .gh-msg {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .gh-msg:last-child { border-bottom: none; }
    .gh-msg strong { color: var(--green-900); }
    .gh-msg time {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
    .gh-discuss-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .gh-discuss-form .form-input { flex: 1; min-width: 0; }
    .friend-invite-list {
      display: grid;
      gap: 0.45rem;
      margin: 0.5rem 0 0.85rem;
    }
    .friend-invite-list label {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .gh-invite-all {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0.35rem 0 0.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:800px">
      <a href="group-hikes.html" class="link-more" style="display:inline-block;margin-bottom:1rem" data-i18n="groups_title"></a>
      <div id="badges" style="margin-bottom:0.5rem"></div>
      <h1 class="page-title" id="ghTitle"></h1>

      <div id="lockedBox" class="card" style="padding:1.5rem;display:none;margin-bottom:1.25rem">
        <p id="lockedMsg" style="margin:0 0 1rem;color:var(--text-muted)"></p>
        <a class="btn btn-primary" id="loginCta" href="login.html" data-i18n="groups_login_cta"></a>
        <a class="btn btn-secondary" id="regCta" href="register.html" style="margin-left:0.5rem" data-i18n="nav_register"></a>
      </div>

      <div id="routeBox" style="display:none">
        <div id="ghMap"></div>
      </div>

      <div id="summaryBox" class="gh-summary" style="display:none">
        <div class="gh-field">
          <span class="gh-field-label" data-i18n="groups_date"></span>
          <span class="gh-field-value" id="ghDateEl">—</span>
        </div>
        <div class="gh-field">
          <span class="gh-field-label" data-i18n="groups_approx_location"></span>
          <span class="gh-field-value" id="ghPlaceEl">—</span>
        </div>
        <div class="gh-field">
          <span class="gh-field-label" data-i18n="groups_gather_point"></span>
          <span class="gh-field-value" id="ghGatherPoint">—</span>
        </div>
        <div class="gh-field">
          <span class="gh-field-label" data-i18n="groups_hikers_joined_label"></span>
          <span class="gh-field-value" id="ghHikersJoined">—</span>
        </div>
        <div class="gh-field">
          <span class="gh-field-label" data-i18n="groups_organizer"></span>
          <span class="gh-field-value" id="ghOrg">—</span>
        </div>
        <div class="gh-field" id="ghDescField" hidden>
          <span class="gh-field-label" data-i18n="groups_description"></span>
          <p class="gh-field-value desc" id="ghDesc"></p>
        </div>
      </div>

      <div id="inviteBox" class="card" style="padding:1.1rem 1.15rem;display:none;margin-bottom:1.25rem">
        <div class="section-head" style="margin-bottom:0.35rem">
          <h2 data-i18n="groups_invite_friends"></h2>
        </div>
        <p style="font-size:0.78rem;color:var(--text-muted);margin:0 0 0.35rem" data-i18n="groups_invite_hint"></p>
        <label class="gh-invite-all">
          <input type="checkbox" id="ghInviteAll" />
          <span data-i18n="groups_invite_all"></span>
        </label>
        <div class="friend-invite-list" id="friendInviteList"></div>
        <button type="button" class="btn btn-primary" id="btnSaveInvites" data-i18n="groups_save_invites"></button>
      </div>

      <div id="shareBox" class="card" style="padding:1rem;display:none;margin-bottom:1.25rem">
        <p style="margin:0 0 0.65rem;font-size:0.85rem;color:var(--text-muted)" data-i18n="groups_invite_hint"></p>
        <button type="button" class="btn btn-secondary" id="btnShare" data-i18n="groups_share_link"></button>
      </div>

      <div id="peopleBox" class="card" style="padding:1.1rem 1.15rem;margin-bottom:1.25rem;display:none">
        <div class="section-head" style="margin-bottom:0.35rem">
          <h2 data-i18n="groups_who_joined"></h2>
        </div>
        <div id="joinActions" style="margin-bottom:0.75rem"></div>
        <div id="memberList"></div>
      </div>

      <div id="discussBox" class="card" style="padding:1.1rem 1.15rem;display:none">
        <div class="section-head" style="margin-bottom:0.35rem">
          <h2 data-i18n="groups_discussion"></h2>
        </div>
        <div id="discussList"></div>
        <form id="discussForm" class="gh-discuss-form" hidden>
          <input class="form-input" id="discussInput" maxlength="500" data-i18n-placeholder="groups_discussion_ph" />
          <button type="submit" class="btn btn-primary" data-i18n="groups_discussion_post"></button>
        </form>
        <p id="discussLock" class="page-sub" style="margin:0.75rem 0 0" hidden></p>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js?v=20260829c"></script>
  <script src="js/data.js?v=20260829b"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/plan-route.js"></script>
  <script src="js/app.js?v=20260829c"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("join");

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const token = params.get("token") || "";

    function findHike(hid) {
      const custom = TW.getGroupHike(hid);
      if (custom) return custom;
      return TW.findPreviewGroupHike(hid);
    }

    function renderSummary(h) {
      TW.ensureGroupHikeRoster(h);
      document.getElementById("ghDateEl").textContent = TW.formatGroupHikeDate(h) || "—";
      document.getElementById("ghPlaceEl").textContent = TW.tt(h, "place") || h.place || "—";
      document.getElementById("ghGatherPoint").textContent =
        (typeof TW.formatGroupHikeGatherPoint === "function"
          ? TW.formatGroupHikeGatherPoint(h)
          : h.gatherPoint) || "—";
      document.getElementById("ghHikersJoined").textContent =
        (typeof TW.formatGroupHikeJoined === "function" ? TW.formatGroupHikeJoined(h) : "") || "—";
      document.getElementById("ghOrg").textContent = h.organizerName || "—";
      const desc = TW.tt(h, "description") || h.description || "";
      const descField = document.getElementById("ghDescField");
      const descEl = document.getElementById("ghDesc");
      if (desc) {
        descField.hidden = false;
        descEl.textContent = desc;
      } else {
        descField.hidden = true;
        descEl.textContent = "";
      }
    }

    function renderInviteFriends() {
      const list = TW.demoFriends || [];
      const invited = hike.invited || [];
      document.getElementById("friendInviteList").innerHTML = list
        .map(
          (f) => `<label>
            <input type="checkbox" name="ghInvite" value="${f.id}" ${invited.indexOf(f.id) >= 0 ? "checked" : ""} />
            ${TW.avatarHtml(f.avatar, "avatar-sm")}
            <span><strong>${twEsc(f.name)}</strong><br/><span style="font-size:0.75rem;color:var(--text-muted)">${twEsc(f.email)}</span></span>
          </label>`
        )
        .join("");
      const all = document.getElementById("ghInviteAll");
      const boxes = Array.from(document.querySelectorAll('input[name="ghInvite"]'));
      if (all) all.checked = boxes.length > 0 && boxes.every((c) => c.checked);
    }

    function setupInvitePanel(isHost) {
      const inviteBox = document.getElementById("inviteBox");
      const canInvite = isHost && TW.isLoggedIn() && (hike.local || !!TW.getGroupHike(hike.id));
      inviteBox.style.display = canInvite ? "block" : "none";
      if (!canInvite) return;
      renderInviteFriends();
      document.getElementById("ghInviteAll").onchange = (e) => {
        document.querySelectorAll('input[name="ghInvite"]').forEach((c) => {
          c.checked = e.target.checked;
        });
      };
      document.getElementById("friendInviteList").onchange = () => {
        const boxes = Array.from(document.querySelectorAll('input[name="ghInvite"]'));
        const all = document.getElementById("ghInviteAll");
        if (all && boxes.length) all.checked = boxes.every((c) => c.checked);
      };
      document.getElementById("btnSaveInvites").onclick = () => {
        const ids = [];
        document.querySelectorAll('input[name="ghInvite"]:checked').forEach((c) => ids.push(c.value));
        if (TW.updateGroupHikeInvites(hike, ids)) {
          showToast(TW.t("groups_invite_saved"));
        }
      };
    }

    function initMap() {
      const path = (hike.path && hike.path.length ? hike.path : TW.demoPathAround()).map((p) => [
        Number(p[0]),
        Number(p[1]),
      ]);
      const map = L.map("ghMap").setView(path[0], 13);
      TW.addMapTiles(map);
      if (path.length > 1) {
        const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
        map.fitBounds(line.getBounds().pad(0.2));
        L.circleMarker(path[0], {
          radius: 7,
          color: "#fff",
          weight: 2,
          fillColor: "#2d8a45",
          fillOpacity: 1,
        }).addTo(map);
        L.circleMarker(path[path.length - 1], {
          radius: 7,
          color: "#fff",
          weight: 2,
          fillColor: "#d64545",
          fillOpacity: 1,
        }).addTo(map);
      }
      setTimeout(() => map.invalidateSize(), 200);
    }

    const hike = findHike(id);
    if (!hike) {
      location.href = "group-hikes.html";
    } else {
      document.getElementById("ghTitle").textContent = TW.tt(hike, "title") || hike.title;
      const vis = hike.visibility === "private" ? "private" : "public";
      document.getElementById("badges").innerHTML =
        `<span class="gh-badge ${vis === "private" ? "gh-private" : "gh-public"}">${TW.t(
          vis === "private" ? "groups_badge_private" : "groups_badge_public"
        )}</span>` +
        (hike.past ? `<span class="gh-badge gh-host">${TW.t("groups_past")}</span>` : `<span class="gh-badge gh-public">${TW.t("groups_upcoming")}</span>`);

      const nextPath =
        "group-hike-detail.html?id=" + encodeURIComponent(id) + (token ? "&token=" + encodeURIComponent(token) : "");
      const canSee = TW.canViewGroupHike(hike, token);
      const locked = document.getElementById("lockedBox");
      const routeBox = document.getElementById("routeBox");
      const summaryBox = document.getElementById("summaryBox");
      const shareBox = document.getElementById("shareBox");
      const isHost =
        TW.isLoggedIn() &&
        hike.organizerEmail &&
        hike.organizerEmail === TW.memberEmail();

      setupInvitePanel(TW.isGroupHikeHost(hike));

      if (vis === "private" && (isHost || canSee) && hike.inviteToken) {
        shareBox.style.display = "block";
        document.getElementById("btnShare").addEventListener("click", () => {
          const link =
            location.origin +
            location.pathname.replace(/[^/]+$/, "") +
            "group-hike-detail.html?id=" +
            encodeURIComponent(hike.id) +
            "&token=" +
            encodeURIComponent(hike.inviteToken);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(() => showToast(TW.t("groups_link_copied")));
          } else {
            prompt(TW.t("groups_share_link"), link);
          }
        });
      }

      if (!canSee) {
        locked.style.display = "block";
        summaryBox.style.display = "none";
        routeBox.style.display = "none";
        const msg = document.getElementById("lockedMsg");
        const cta = document.getElementById("loginCta");
        const reg = document.getElementById("regCta");
        if (!TW.isLoggedIn()) {
          msg.textContent = TW.t("groups_login_cta");
          cta.href = "login.html?next=" + encodeURIComponent(nextPath);
          reg.href = "register.html?next=" + encodeURIComponent(nextPath);
          cta.style.display = "";
          reg.style.display = "";
        } else {
          msg.textContent = TW.t("groups_private_locked");
          cta.style.display = "none";
          reg.style.display = "none";
        }
      } else {
        routeBox.style.display = "block";
        summaryBox.style.display = "block";
        renderSummary(hike);
        initMap();
        renderCommunity();
      }
    }

    function fmtMsgTime(ts) {
      try {
        return new Date(ts).toLocaleString(TW.getLang() === "zh" ? "zh-HK" : "en-HK", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      } catch (e) {
        return "";
      }
    }

    function renderCommunity() {
      if (!hike) return;
      TW.ensureGroupHikeRoster(hike);
      const peopleBox = document.getElementById("peopleBox");
      const discussBox = document.getElementById("discussBox");
      const canSeeNow = TW.canViewGroupHike(hike, token);
      if (!canSeeNow) {
        peopleBox.style.display = "none";
        discussBox.style.display = "none";
        return;
      }
      peopleBox.style.display = "block";
      discussBox.style.display = "block";

      const host = TW.isGroupHikeHost(hike);
      const inGroup = TW.isGroupHikeParticipant(hike);
      const completed = !!(hike.past || hike.stage === "completed" || (hike.dateISO && Date.parse(hike.dateISO) < Date.now() - 86400000));

      const actions = document.getElementById("joinActions");
      if (!TW.isLoggedIn()) {
        const nextPath =
          "group-hike-detail.html?id=" + encodeURIComponent(id) + (token ? "&token=" + encodeURIComponent(token) : "");
        actions.innerHTML = `<a class="btn btn-primary" href="login.html?next=${encodeURIComponent(nextPath)}">${TW.t("groups_login_join")}</a>`;
      } else if (host) {
        actions.innerHTML = `<span class="gh-badge gh-host">${TW.t("groups_host")}</span>`;
      } else if (inGroup) {
        actions.innerHTML = `<span class="gh-badge gh-public">${TW.t("groups_already")}</span>
          <button type="button" class="btn btn-secondary" id="btnLeave" style="margin-left:0.5rem;padding:0.35rem 0.75rem;font-size:0.8rem">${TW.t("groups_leave")}</button>`;
      } else {
        actions.innerHTML = `<button type="button" class="btn btn-primary" id="btnJoin">${TW.t("groups_join_cta")}</button>`;
      }
      const btnJoin = document.getElementById("btnJoin");
      if (btnJoin) {
        btnJoin.addEventListener("click", () => {
          if (TW.joinGroupHike(hike)) {
            showToast(TW.t("toast_joined"));
            renderCommunity();
          }
        });
      }
      const btnLeave = document.getElementById("btnLeave");
      if (btnLeave) {
        btnLeave.addEventListener("click", () => {
          if (TW.leaveGroupHike(hike)) {
            showToast(TW.t("groups_left"));
            renderCommunity();
          }
        });
      }

      const hostEmail = (hike.organizerEmail || "").toLowerCase();
      document.getElementById("memberList").innerHTML = (hike.members || [])
        .map((m) => {
          const isHostRow = String(m.email || "").toLowerCase() === hostEmail || m.host;
          const kick =
            host && !isHostRow
              ? `<button type="button" class="btn btn-secondary gh-kick" data-kick="${twEsc(m.email)}">${TW.t("groups_kick")}</button>`
              : isHostRow
                ? `<span class="gh-badge gh-host">${TW.t("groups_host")}</span>`
                : "";
          return `<div class="gh-member-row">
            ${TW.avatarHtml ? TW.avatarHtml(m.avatar, "avatar-sm") : ""}
            <div>
              <strong>${twEsc(m.name || m.email)}</strong>
              ${m.email ? `<div style="font-size:0.78rem;color:var(--text-muted)">${twEsc(m.email)}</div>` : ""}
            </div>
            ${kick}
          </div>`;
        })
        .join("") || `<p class="page-sub" style="margin:0">${TW.t("groups_discussion_empty")}</p>`;

      peopleBox.querySelectorAll("[data-kick]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const email = btn.getAttribute("data-kick");
          const member = (hike.members || []).find((x) => x.email === email);
          const label = (member && member.name) || email;
          if (!confirm(TW.t("groups_kick_confirm").replace("{name}", label))) return;
          if (TW.kickGroupHikeMember(hike, email)) {
            showToast(TW.t("groups_kicked"));
            renderCommunity();
          }
        });
      });

      const msgs = hike.discussion || [];
      document.getElementById("discussList").innerHTML = msgs.length
        ? msgs
            .map(
              (msg) => `<div class="gh-msg">
            <strong>${twEsc(msg.name || "Hiker")}</strong>
            <div>${twEsc(msg.text)}</div>
            <time>${fmtMsgTime(msg.at)}</time>
          </div>`
            )
            .join("")
        : `<p class="page-sub" style="margin:0">${TW.t("groups_discussion_empty")}</p>`;

      const form = document.getElementById("discussForm");
      const lock = document.getElementById("discussLock");
      if (inGroup) {
        form.hidden = false;
        lock.hidden = !completed;
        if (completed) lock.textContent = TW.t("app_discussion_days").replace("{n}", "7");
      } else {
        form.hidden = true;
        lock.hidden = false;
        lock.textContent = TW.isLoggedIn() ? TW.t("groups_discussion_locked") : TW.t("groups_login_join");
      }
    }

    const discussForm = document.getElementById("discussForm");
    if (discussForm) {
      discussForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("discussInput");
        if (TW.postGroupDiscussion(hike, input.value)) {
          input.value = "";
          renderCommunity();
        }
      });
    }
  </script>
</body>
</html>
