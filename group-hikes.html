<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .vis-toggle {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.35rem 0 0.75rem;
    }
    .vis-toggle label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green-900);
      background: #fff;
    }
    .vis-toggle input:disabled + span {
      opacity: 0.45;
    }
    .friend-invite-list {
      display: grid;
      gap: 0.45rem;
      margin: 0.5rem 0 1rem;
    }
    .friend-invite-list label {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .gh-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-right: 0.35rem;
    }
    .gh-public { background: #ecfdf5; color: #047857; }
    .gh-private { background: #eff6ff; color: #1d4ed8; }
    .gh-invited { background: #fef3c7; color: #92400e; }
    #ghRouteMap {
      height: 300px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--green-50);
    }
    .gh-route-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin: 0.5rem 0 0.65rem;
    }
    .gh-route-toolbar .chip.active {
      background: var(--green-900);
      color: #fff;
      border-color: var(--green-900);
    }
    .gh-route-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.65rem;
    }
    .gh-route-row .form-select { flex: 1; min-width: 160px; }
    .gh-form-section {
      font-size: 0.92rem;
      color: var(--green-900);
      margin: 0.35rem 0 0.65rem;
    }
    .gh-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }
    @media (max-width: 640px) {
      .gh-form-grid { grid-template-columns: 1fr; }
    }
    .gh-route-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.35rem 0 0.65rem;
    }
    .gh-route-mode .chip.active {
      background: var(--green-900);
      color: #fff;
      border-color: var(--green-900);
    }
    .gh-route-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    @media (max-width: 640px) {
      .gh-route-stats { grid-template-columns: 1fr 1fr; }
    }
    .gh-stat {
      background: var(--green-50);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 0.55rem;
    }
    .gh-stat .lbl {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 0.1rem;
    }
    .gh-stat strong {
      font-size: 0.88rem;
      color: var(--green-900);
    }
    .gh-invite-all {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--green-900);
      margin: 0 0 0.55rem;
      cursor: pointer;
    }
    #ghPickWrap .form-select { width: 100%; margin-top: 0.15rem; }
    textarea.form-input { resize: vertical; min-height: 4.5rem; }
    .plan-ctx {
      position: absolute;
      z-index: 1000;
      min-width: 210px;
      background: #fff;
      border-radius: 12px;
      padding: 0.75rem 0.9rem 0.65rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      display: none;
    }
    .plan-ctx button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0.4rem 0.1rem;
      font-weight: 700;
      font-size: 0.88rem;
      color: #3f3f46;
      cursor: pointer;
    }
    .plan-ctx button:hover { color: var(--green-900); }
    .plan-ctx button[hidden] { display: none; }
    .plan-ctx hr { border: 0; border-top: 1px solid #f4f4f5; margin: 0.45rem 0; }
    .plan-ctx .cancel { font-weight: 500; color: var(--text-muted); }
    .plan-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 800; color: #fff; line-height: 1;
    }
    .plan-dot.start { background: #2d8a45; }
    .plan-dot.end { background: #d64545; border-radius: 3px; }
    .plan-dot.via { background: #003229; box-shadow: 0 0 0 2px #33897a; }
    .marker-label { background: transparent !important; border: 0 !important; }
    .mk {
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; line-height: 1;
    }
    .mk-start { width: 24px; height: 24px; border-radius: 50%; background: #2d8a45; font-size: 11px; }
    .mk-end { width: 24px; height: 24px; border-radius: 4px; background: #d64545; font-size: 11px; }
    .mk-via {
      width: 22px; height: 22px; border-radius: 50%;
      background: #003229; box-shadow: 0 0 0 2px #33897a, 0 1px 4px rgba(0,0,0,0.35);
      font-size: 10px;
    }
    .page-groups .trail-grid .trail-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .page-groups .trail-card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .page-groups .trail-card-img {
      aspect-ratio: 16 / 10;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      background: var(--green-50);
    }
    .page-groups .trail-card-media-link {
      display: block;
      position: absolute;
      inset: 0;
    }
    .page-groups .trail-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .page-groups .gh-card-gather {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .page-groups .gh-card-desc {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      color: var(--green-800);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .page-groups .gh-card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.65rem;
    }
    .page-groups .gh-spots {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--green-900);
    }
  </style>
</head>
<body class="page-groups">
  <div id="app-header"></div>
  <main class="page">
    <div class="container">
      <div class="section-head" style="align-items:flex-start">
        <div>
          <h1 class="page-title" data-i18n="groups_title"></h1>
        </div>
        <button type="button" class="btn btn-primary" id="btnCreate" data-i18n="groups_create"></button>
      </div>

      <div class="card" id="createGate" style="padding:1.25rem;margin-bottom:1.5rem;display:none">
        <h2 style="font-size:1.1rem;margin:0 0 0.5rem;color:var(--green-900)" data-i18n="groups_premium_gate_title"></h2>
        <p class="page-sub" style="margin-bottom:1rem" data-i18n="groups_premium_gate_body"></p>
        <a class="btn btn-primary" href="get-app.html#premium" data-i18n="home_premium_cta"></a>
      </div>

      <div class="card" id="createPanel" style="padding:1.25rem;margin-bottom:1.5rem;display:none">
        <h2 style="font-size:1.1rem;margin:0 0 0.85rem;color:var(--green-900)" data-i18n="groups_create_title"></h2>
        <p class="meta" id="createPremiumNote" style="margin:0 0 1rem"></p>

        <div class="form-group">
          <label for="ghName" data-i18n="groups_name"></label>

        </div>

        <h3 class="gh-form-section" data-i18n="groups_details"></h3>

          <div class="form-group">
            <label for="ghDate" data-i18n="groups_date"></label>
            <input class="form-input" id="ghDate" type="date" />
          </div>
          <div class="form-group">
            <label for="ghGatherTime" data-i18n="groups_gather_time"></label>
            <input class="form-input" id="ghGatherTime" type="time" />
          </div>
          <div class="form-group">
            <label for="ghPlace" data-i18n="groups_approx_location"></label>
            <input class="form-input" id="ghPlace" type="text" data-i18n-placeholder="groups_place_ph" />

          <div class="form-group">
            <label for="ghGather" data-i18n="groups_gather_point"></label>
            <input class="form-input" id="ghGather" type="text" />
          </div>
        </div>

        <div class="form-group">
          <label for="ghDesc" data-i18n="groups_description"></label>
          <textarea class="form-input" id="ghDesc" rows="3" data-i18n-placeholder="groups_desc_ph"></textarea>
        </div>

        <div class="form-group">
          <label for="ghLimit" data-i18n="groups_participant_limit"></label>
          <input class="form-input" id="ghLimit" type="number" min="2" max="200" value="12" />
        </div>

        <div class="form-group">
          <label data-i18n="groups_visibility"></label>
          <div class="vis-toggle">
            <label><input type="radio" name="ghVis" value="private" checked /> <span data-i18n="groups_private"></span></label>
            <label id="ghPublicLabel"><input type="radio" name="ghVis" value="public" id="ghVisPublic" /> <span data-i18n="groups_public"></span></label>
          </div>
          <p class="meta" id="ghPublicHint" style="margin:0.45rem 0 0"></p>
        </div>

        <div class="form-group" id="ghRouteBlock">
          <label data-i18n="groups_route"></label>
          <div class="gh-route-mode">
            <button type="button" class="chip active" id="ghModePick" data-route-mode="pick" data-i18n="groups_my_routes"></button>
            <button type="button" class="chip" id="ghModePlan" data-route-mode="plan" data-i18n="groups_plan_new_route"></button>
          </div>

            <select class="form-select" id="ghRouteDraft" aria-label="My routes"></select>
          </div>
          <div id="ghPlanWrap" hidden>
            <p class="meta" style="margin:0.35rem 0 0.45rem" data-i18n="groups_route_edit_hint"></p>
            <div class="gh-route-toolbar" id="ghRouteToolbar">
              <button type="button" class="chip active" data-draw="menu" data-i18n="plan_mode_menu"></button>
              <button type="button" class="btn btn-secondary" style="padding:0.35rem 0.75rem;font-size:0.8rem" data-route-undo data-i18n="plan_undo"></button>
              <button type="button" class="btn btn-secondary" style="padding:0.35rem 0.75rem;font-size:0.8rem" data-route-clear data-i18n="plan_clear"></button>
            </div>
            <div style="position:relative">

              <div class="plan-ctx" id="ghRouteCtx" role="menu">

                <button type="button" data-type="end"><span class="plan-dot end">B</span><span data-i18n="plan_ctx_end"></span></button>
                <button type="button" data-type="via"><span class="plan-dot via">V</span><span data-i18n="plan_ctx_via"></span></button>

              <button type="button" class="btn btn-primary" id="btnGhSaveRoute" data-i18n="groups_save_route"></button>

      <div class="chip-row filters" id="groupFilters">
        <button type="button" class="chip active" data-f="all" data-i18n="groups_filter_all"></button>
        <button type="button" class="chip" data-f="joined" data-i18n="groups_joined"></button>
        <button type="button" class="chip" data-f="upcoming" data-i18n="groups_upcoming"></button>
        <button type="button" class="chip" data-f="past" data-i18n="groups_past"></button>
        <button type="button" class="chip" data-f="friend" data-i18n="groups_filter_friend"></button>

  <script src="js/i18n.js?v=20260829c"></script>
  <script src="js/data.js?v=20260829b"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/plan-route.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js?v=20260829c"></script>
  <script src="js/route-map.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    if (new URLSearchParams(location.search).get("mine") === "1") {
      location.replace("profile.html#activity&type=groups");
    } else {
    initShell("join");

    let filter = "all";
    let q = "";
    let routeEditor = null;
    let routeMode = "pick";

    function estimateDifficulty(km, gain) {
      const d = Number(km) || 0;
      const g = Number(gain) || 0;
      if (d <= 0 && g <= 0) return null;
      if (d < 6 && g < 250) return 1;
      if (d < 10 && g < 450) return 2;
      if (d < 14 && g < 700) return 3;
      if (d < 20 && g < 1000) return 4;
      return 5;
    }

    function showRouteStats(info) {
      const panel = document.getElementById("ghRouteStatsPanel");
      if (!panel) return;
      const km = info && info.distanceKm != null ? Number(info.distanceKm) : 0;
      const gain = info && info.elevGain != null ? Number(info.elevGain) : 0;
      const loss = info && info.elevLoss != null ? Number(info.elevLoss) : 0;
      const hours =
        info && info.durationHours != null
          ? Number(info.durationHours)
          : TW.estimateDurationHours(km, gain);
      const has = info && (info.hasRoute || km > 0 || (info.path && info.path.length >= 2));
      panel.hidden = !has;
      if (!has) return;
      const diff = estimateDifficulty(km, gain);
      document.getElementById("ghStatDiff").textContent = diff
        ? "L" + diff + " · " + (TW.difficultyLabels && TW.difficultyLabels[TW.getLang()]
            ? TW.difficultyLabels[TW.getLang()][diff]
            : "")
        : "—";
      document.getElementById("ghStatDist").textContent = km ? km.toFixed(1) + " km" : "—";
      document.getElementById("ghStatDur").textContent = hours ? TW.formatHours(hours) : "—";
      if (gain || loss) {
        document.getElementById("ghStatElev").textContent =
          (gain ? "+" + Math.round(gain) + " m" : "") +
          (gain && loss ? " / " : "") +
          (loss ? "−" + Math.round(loss) + " m" : "");
      } else {
        document.getElementById("ghStatElev").textContent = "—";
      }
    }

    function updateRouteStats(info) {
      const el = document.getElementById("ghRouteStats");
      if (el) {
        if (!info || !info.hasRoute) el.textContent = TW.t("groups_route_stats_empty");
        else
          el.textContent =
            TW.t("plan_est_distance") + ": " + info.distanceKm + " km · " + info.path.length + " " + TW.t("plan_points");
      }
      const path = (info && info.path) || [];
      const km = info && info.distanceKm != null ? info.distanceKm : TW.pathDistanceKm(path);
      const elev = TW.estimateElevFallback ? TW.estimateElevFallback(km) : { gain: 0, loss: 0 };
      showRouteStats({
        hasRoute: !!(info && info.hasRoute),
        path: path,
        distanceKm: km,
        elevGain: elev.gain || 0,
        elevLoss: elev.loss || 0,
        durationHours: TW.estimateDurationHours(km, elev.gain || 0),
      });
    }

    function statsFromDraft(d) {
      if (!d) {
        showRouteStats({ hasRoute: false });
        return;
      }
      const path = d.path || [];
      const km = d.distanceKm != null ? Number(d.distanceKm) : TW.pathDistanceKm(path);
      const gain = Number(d.elevGain) || (TW.estimateElevFallback(km).gain || 0);
      const loss = Number(d.elevLoss) || (TW.estimateElevFallback(km).loss || 0);
      showRouteStats({
        hasRoute: path.length >= 2 || km > 0,
        path: path,
        distanceKm: km,
        elevGain: gain,
        elevLoss: loss,
        durationHours: d.durationHours != null ? Number(d.durationHours) : TW.estimateDurationHours(km, gain),
      });
    }

    function setRouteMode(mode) {
      routeMode = mode === "plan" ? "plan" : "pick";
      document.getElementById("ghModePick").classList.toggle("active", routeMode === "pick");
      document.getElementById("ghModePlan").classList.toggle("active", routeMode === "plan");
      document.getElementById("ghPickWrap").hidden = routeMode !== "pick";
      document.getElementById("ghPlanWrap").hidden = routeMode !== "plan";
      if (routeMode === "plan") {
        const editor = ensureRouteEditor();
        if (editor) {
          editor.invalidateSize();
          updateRouteStats({
            hasRoute: editor.hasRoute(),
            path: editor.getPath(),
            distanceKm: TW.pathDistanceKm(editor.getPath()),
          });
        }
      } else {
        const id = document.getElementById("ghRouteDraft").value;
        statsFromDraft(id ? TW.getRouteDraft(id) : null);
      }
    }

    function ensureRouteEditor() {
      if (routeEditor) return routeEditor;
      routeEditor = TW.createRouteMapEditor({
        mapId: "ghRouteMap",
        ctxId: "ghRouteCtx",
        toolbarEl: document.getElementById("ghRouteToolbar"),
        onChange: updateRouteStats,
      });
      return routeEditor;
    }

    function seedDemoPath() {
      return TW.demoPathAround(22.35, 114.25);
    }

    function builtInMeetups() {
      return (TW.previewGroupHikes || []).map((h) => {
        if (typeof TW.resolvePreviewGroupHike === "function") return TW.resolvePreviewGroupHike(h);
        const hike = Object.assign({}, h);
        hike.invited = hike.invited || [];
        hike.builtIn = true;
        if ((!hike.path || !hike.path.length) && hike.pathCenter && TW.demoPathAround) {
          hike.path = TW.demoPathAround(hike.pathCenter[0], hike.pathCenter[1]);
        }
        return hike;
      });
    }

    function visibleHikes() {
      const email = TW.memberEmail();
      const custom = TW.getGroupHikes().filter((g) => {
        if (g.visibility !== "private") return true;
        if (g.local && (!g.organizerEmail || g.organizerEmail === email)) return true;
        if (g.organizerEmail && g.organizerEmail === email) return true;
        return TW.canViewGroupHike(g);
      });
      return builtInMeetups()
        .filter((g) => {
          if (g.visibility !== "private") return true;
          if (g.demoInvited) return TW.isLoggedIn();
          return TW.canViewGroupHike(g);
        })
        .concat(custom);
    }

    function isInvited(g) {
      if (g.demoInvited && TW.isLoggedIn()) return true;
      if (!TW.isLoggedIn() || !g.invited || !g.invited.length) return false;
      return TW.canViewGroupHike(g) && !(g.organizerEmail && g.organizerEmail === TW.memberEmail());
    }

    function isFriendOrg(g) {
      if (g.organizerFriendId) return true;
      const friends = TW.demoFriends || [];
      const org = (g.organizerEmail || "").toLowerCase();
      return friends.some((f) => org && String(f.email || "").toLowerCase() === org);
    }

    function hikeDate(g) {
      if (g.dateISO) {
        const t = Date.parse(g.dateISO);
        if (Number.isFinite(t)) return t;
      }
      return 0;
    }

    function renderInviteFriends() {
      const list = TW.demoFriends || [];
      document.getElementById("friendInviteList").innerHTML = list
        .map(
          (f) => `<label>
            <input type="checkbox" name="invite" value="${f.id}" />
            ${TW.avatarHtml(f.avatar, "avatar-sm")}
            <span><strong>${twEsc(f.name)}</strong><br/><span style="font-size:0.75rem;color:var(--text-muted)">${twEsc(f.email)}</span></span>
          </label>`
        )
        .join("");
      const all = document.getElementById("ghInviteAll");
      if (all) all.checked = false;
    }

    function applyRouteSelection(chosen) {
      if (!chosen) {
        statsFromDraft(null);
        return;
      }
      if (chosen.indexOf("trail:") === 0) {
        const trail = (TW.trails || []).find((t) => t.id === chosen.slice(6));
        if (!trail) {
          statsFromDraft(null);
          return;
        }
        const km = parseFloat(String(trail.distance || "").replace(/[^\d.]/g, "")) || 0;
        const elev = parseFloat(String(trail.elevation || "").replace(/[^\d.]/g, "")) || 0;
        showRouteStats({
          hasRoute: true,
          path: trail.path || [],
          distanceKm: km,
          elevGain: elev,
          elevLoss: Math.round(elev * 0.85),
          durationHours: TW.estimateDurationHours(km, elev),
        });
        document.getElementById("ghStatDiff").textContent = trail.difficulty
          ? "L" +
            trail.difficulty +
            " · " +
            (typeof difficultyLabel === "function" ? difficultyLabel(trail.difficulty) : "")
          : "—";
        return;
      }
      if (routeMode === "plan") {
        const editor = ensureRouteEditor();
        if (editor) {
          editor.loadDraft(chosen);
        }
      }
      statsFromDraft(TW.getRouteDraft(chosen));
    }

    function fillRouteSelect(selectedId) {
      const sel = document.getElementById("ghRouteDraft");
      const drafts = TW.getRouteDrafts();
      const plannedIds = typeof TW.getPlans === "function" ? TW.getPlans() : [];
      const planned = plannedIds
        .map((id) => (TW.trails || []).find((t) => t.id === id))
        .filter(Boolean);
      const zh = TW.getLang() === "zh";
      const keep = selectedId || sel.value || "";
      const draftOpts = drafts
        .map((d) => {
          const label = zh ? d.nameZh || d.name : d.name;
          const km = d.distanceKm != null ? Number(d.distanceKm).toFixed(1) + " km" : "";
          return `<option value="${d.id}">${twEsc(label)}${km ? " · " + km : ""}</option>`;
        })
        .join("");
      const planOpts = planned
        .map((t) => {
          const label = TW.tt(t, "title");
          return `<option value="trail:${t.id}">${twEsc(label)} · ${twEsc(t.distance || "")}</option>`;
        })
        .join("");
      sel.innerHTML =
        `<option value="">${TW.t("groups_route_pick")}</option>` +
        (draftOpts ? `<optgroup label="${TW.t("plan_drafts")}">${draftOpts}</optgroup>` : "") +
        (planOpts ? `<optgroup label="${TW.t("plan_marked_trails")}">${planOpts}</optgroup>` : "");
      if (keep) sel.value = keep;
      applyRouteSelection(sel.value);
    }

    function syncVisibilityUI() {
      const canPublic = TW.canOrganizePublicGroup();
      const publicRadio = document.getElementById("ghVisPublic");
      const hint = document.getElementById("ghPublicHint");
      const status = TW.getPublicGroupOrganizeStatus();
      publicRadio.disabled = !canPublic;
      if (!canPublic) {
        publicRadio.checked = false;
        const priv = document.querySelector('input[name="ghVis"][value="private"]');
        if (priv) priv.checked = true;
        hint.textContent = TW.t("groups_public_phase2_hint")
          .replace("{n}", String(status.minHosted))
          .replace("{have}", String(status.hosted));
      } else {
        hint.textContent = TW.t("groups_public_unlocked");
      }
      const vis = (document.querySelector('input[name="ghVis"]:checked') || {}).value || "private";
      document.getElementById("inviteBlock").style.display = vis === "private" ? "block" : "none";
    }

    function openCreatePanel() {
      if (!TW.requireLogin({ messageKey: "login_to_organize" })) return;
      if (!TW.canOrganizePrivateGroup()) {
        document.getElementById("createPanel").style.display = "none";
        document.getElementById("createGate").style.display = "block";
        const prem = TW.getMemberPremiumInfo();
        const gateBody = document.querySelector("#createGate .page-sub");
        if (gateBody && prem.expired) gateBody.textContent = TW.t("groups_premium_expired");
        showToast(prem.expired ? TW.t("groups_premium_expired") : TW.t("groups_premium_required"));
        return;
      }
      document.getElementById("createGate").style.display = "none";
      const panel = document.getElementById("createPanel");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
      if (panel.style.display === "block") {
        document.getElementById("createPremiumNote").textContent = TW.t("groups_premium_private_note");
        fillRouteSelect();
        renderInviteFriends();
        syncVisibilityUI();
        setRouteMode("pick");
        ["ghPlace", "ghDesc"].forEach((id) => {
          const el = document.getElementById(id);
          if (el && el.dataset.i18nPlaceholder) el.placeholder = TW.t(el.dataset.i18nPlaceholder);
        });
      }
    }

    function matchesDate(m) {
      const fromEl = document.getElementById("groupDateFrom");
      const toEl = document.getElementById("groupDateTo");
      const from = fromEl && fromEl.value;
      const to = toEl && toEl.value;
      const ts = hikeDate(m);
      if (from && ts && ts < Date.parse(from)) return false;
      if (to && ts && ts > Date.parse(to) + 86400000 - 1) return false;
      if ((from || to) && !ts) return false;
      return true;
    }

    function render() {
      const hint = document.getElementById("groupInviteHint");
      if (hint) {
        hint.style.display = TW.isLoggedIn() ? "none" : "block";
        hint.textContent = TW.t("groups_login_invites");
      }
      const list = visibleHikes().filter((m) => {
        const title = ((TW.tt(m, "title") || m.title || "") + " " + (m.place || "") + " " + (m.placeZh || "")).toLowerCase();
        const okQ = !q || title.includes(q);
        if (!okQ || !matchesDate(m)) return false;
        if (filter === "past") return !!m.past;
        if (filter === "upcoming") return !m.past;
        if (filter === "joined") return !!(m.joined || isInvited(m) || (m.organizerEmail && m.organizerEmail === TW.memberEmail()));
        if (filter === "friend") return isFriendOrg(m);
        if (filter === "invited") return isInvited(m);
        return true;
      });
      document.getElementById("groupGrid").innerHTML = list.length
        ? list
            .map((m) => {
              const title = TW.tt(m, "title") || m.title;
              const place = TW.tt(m, "place") || m.place || "";
              const date = TW.tt(m, "date") || m.date || "";
              const img = m.image || "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=600&q=60";
              const vis = m.visibility === "private" ? "private" : "public";
              const friend = (TW.demoFriends || []).find((f) => f.id === m.organizerFriendId);
              const badges =
                `<span class="gh-badge ${vis === "private" ? "gh-private" : "gh-public"}">${TW.t(vis === "private" ? "groups_badge_private" : "groups_badge_public")}</span>` +
                (m.past ? `<span class="gh-badge gh-invited">${TW.t("groups_past")}</span>` : `<span class="gh-badge gh-public">${TW.t("groups_upcoming")}</span>`) +
                (isInvited(m) ? `<span class="gh-badge gh-invited">${TW.t("groups_badge_invited")}</span>` : "") +
                (isFriendOrg(m) ? `<span class="gh-badge gh-invited">${TW.t("groups_filter_friend")}</span>` : "") +
                (m.organizerEmail && m.organizerEmail === TW.memberEmail()
                  ? `<span class="gh-badge gh-public">${TW.t("groups_mine")}</span>`
                  : "");
              const href = "group-hike-detail.html?id=" + encodeURIComponent(m.id);
              const gather =
                typeof TW.formatGroupHikeGather === "function"
                  ? TW.formatGroupHikeGather(m)
                  : [m.gatherPoint, m.gatherTime].filter(Boolean).join(" · ");
              const desc = TW.tt(m, "description") || m.description || "";
              const joinedLabel =
                typeof TW.formatGroupHikeJoined === "function"
                  ? TW.formatGroupHikeJoined(m)
                  : typeof TW.formatGroupHikeSpots === "function"
                    ? TW.formatGroupHikeSpots(m)
                    : "";
              return `<article class="trail-card">
              <a class="trail-card-img trail-card-media-link" href="${href}" aria-label="${twEsc(title)}">
                <img src="${img}" alt="" loading="lazy" />
              </a>
              <div class="trail-card-body">
                <div style="margin-bottom:0.35rem">${badges}</div>
                <strong>${twEsc(title)}</strong>
                <p class="meta">${twEsc(date)} · ${twEsc(place)}${friend ? " · " + twEsc(friend.name) : ""}</p>
                ${gather ? `<p class="gh-card-gather">${twEsc(gather)}</p>` : ""}
                ${desc ? `<p class="gh-card-desc">${twEsc(desc)}</p>` : ""}
                <div class="gh-card-foot">
                  <span class="gh-spots">${joinedLabel ? twEsc(joinedLabel) : ""}</span>
                  <a class="btn btn-primary" style="padding:0.35rem 0.85rem;font-size:0.8rem" href="${href}">${TW.t("groups_view")}</a>
                </div>
              </div>
            </article>`;
            })
            .join("")
        : TW.emptyStateHtml(TW.t("groups_empty"), TW.t("groups_clear_hint"), 'id="groupClear"');
      const clear = document.getElementById("groupClear");
      if (clear) {
        clear.addEventListener("click", () => {
          q = "";
          filter = "all";
          document.getElementById("groupSearch").value = "";
          const df = document.getElementById("groupDateFrom");
          const dt = document.getElementById("groupDateTo");
          if (df) df.value = "";
          if (dt) dt.value = "";
          document.querySelectorAll("#groupFilters .chip").forEach((c) => c.classList.toggle("active", c.dataset.f === "all"));
          render();
        });
      }
    }

    document.getElementById("groupFilters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      document.querySelectorAll("#groupFilters .chip").forEach((c) => c.classList.toggle("active", c === btn));
      render();
    });
    document.getElementById("groupSearch").addEventListener("input", (e) => {
      q = e.target.value.trim().toLowerCase();
      render();
    });
    const gFrom = document.getElementById("groupDateFrom");
    const gTo = document.getElementById("groupDateTo");
    if (gFrom) gFrom.addEventListener("change", render);
    if (gTo) gTo.addEventListener("change", render);

    const panel = document.getElementById("createPanel");
    document.getElementById("btnCreate").addEventListener("click", openCreatePanel);
    document.getElementById("cancelCreate").addEventListener("click", () => {
      panel.style.display = "none";
      document.getElementById("createGate").style.display = "none";
    });
    document.querySelectorAll('input[name="ghVis"]').forEach((r) => {
      r.addEventListener("change", syncVisibilityUI);
    });

    document.getElementById("ghRouteDraft").addEventListener("change", (e) => {
      applyRouteSelection(e.target.value);
    });

    document.getElementById("ghModePick").addEventListener("click", () => setRouteMode("pick"));
    document.getElementById("ghModePlan").addEventListener("click", () => setRouteMode("plan"));

    document.getElementById("ghInviteAll").addEventListener("change", (e) => {
      document.querySelectorAll('input[name="invite"]').forEach((c) => {
        c.checked = e.target.checked;
      });
    });
    document.getElementById("friendInviteList").addEventListener("change", () => {
      const boxes = Array.from(document.querySelectorAll('input[name="invite"]'));
      const all = document.getElementById("ghInviteAll");
      if (all && boxes.length) all.checked = boxes.every((c) => c.checked);
    });

    document.getElementById("btnGhSaveRoute").addEventListener("click", () => {
      const editor = ensureRouteEditor();
      if (!editor) return;
      const hikeName = document.getElementById("ghName").value.trim();
      const draft = editor.saveDraft(hikeName || undefined);
      if (!draft) {
        showToast(TW.t("groups_route_need_ab"));
        return;
      }
      fillRouteSelect(draft.id);
      setRouteMode("pick");
      showToast(TW.t("groups_route_saved"));
    });

    document.getElementById("submitCreate").addEventListener("click", () => {
      if (!TW.canOrganizePrivateGroup()) {
        showToast(TW.t("groups_premium_required"));
        return;
      }
      const name = document.getElementById("ghName").value.trim();
      if (!name) {
        showToast(TW.t("groups_name"));
        return;
      }
      let vis = (document.querySelector('input[name="ghVis"]:checked') || {}).value || "private";
      if (vis === "public" && !TW.canOrganizePublicGroup()) {
        showToast(TW.t("groups_public_locked"));
        vis = "private";
      }
      const invited = [];
      if (vis === "private") {
        document.querySelectorAll('input[name="invite"]:checked').forEach((c) => invited.push(c.value));
      }
      const editor = routeMode === "plan" ? ensureRouteEditor() : null;
      let draftId = document.getElementById("ghRouteDraft").value;
      let path = [];
      let trailId = "";
      if (draftId.indexOf("trail:") === 0) {
        trailId = draftId.slice(6);
        const trail = (TW.trails || []).find((t) => t.id === trailId);
        path = (trail && trail.path) || [];
        draftId = "";
      }
      if (editor && editor.hasRoute()) {
        const saved = editor.saveDraft(name);
        if (saved) {
          draftId = saved.id;
          path = saved.path;
        } else {
          path = editor.getPath();
        }
      }
      if (path.length < 2) {
        const draft = draftId ? TW.getRouteDraft(draftId) : null;
        path = draft && draft.path && draft.path.length >= 2 ? draft.path : path;
      }
      if (path.length < 2 && !trailId) {
        showToast(TW.t("groups_route_need_ab"));
        return;
      }
      const dateVal = document.getElementById("ghDate").value;
      const timeVal = document.getElementById("ghGatherTime").value;
      const place = document.getElementById("ghPlace").value.trim() || "Hong Kong";
      const gather = document.getElementById("ghGather").value.trim();
      const desc = document.getElementById("ghDesc").value.trim();
      const limit = Math.max(2, Number(document.getElementById("ghLimit").value) || 12);
      const dateLabel = dateVal
        ? dateVal + (timeVal ? " · " + timeVal : "")
        : timeVal || (TW.getLang() === "zh" ? "即將舉行" : "Coming soon");
      const auth = TW.getMemberAuth();
      let routeSource = "new";
      if (trailId) {
        routeSource = "trail";
      } else if (draftId) {
        routeSource = "draft";
      }
      const hike = {
        id: "gh_" + Date.now(),
        title: name,
        titleZh: name,
        place: place,
        placeZh: place,
        gatherPoint: gather,
        gatherTime: timeVal || "",
        description: desc,
        descriptionZh: desc,
        date: dateLabel,
        dateZh: dateLabel,
        dateISO: dateVal || "",
        visibility: vis,
        invited: invited,
        inviteToken: vis === "private" ? TW.makeInviteToken() : "",
        invitedEmails: [],
        path: path,
        routeDraftId: draftId || "",
        trailId: trailId || "",
        routeSource: routeSource,
        organizerEmail: (auth && auth.email) || "",
        organizerName: TW.memberDisplayName() || (TW.getLang() === "zh" ? "主辦人" : "Organizer"),
        local: true,
        image: "https://images.unsplash.com/photo-1551632811-561732d1e5ec?w=600&q=60",
        spots: String(limit),
        participantLimit: limit,
        past: false,
        joined: true,
        members: [
          {
            email: (auth && auth.email) || "",
            name: TW.memberDisplayName() || (TW.getLang() === "zh" ? "主辦人" : "Organizer"),
            avatar: (TW.user && TW.user.avatar) || "",
            host: true,
            joinedAt: Date.now(),
          },
        ],
        discussion: [],
      };
      const stats = TW.resolveGroupHikeStats(hike);
      if (stats) Object.assign(hike, stats);
      TW.saveGroupHike(hike);
      showToast(TW.t("groups_created"));
      panel.style.display = "none";
      document.getElementById("ghName").value = "";
      document.getElementById("ghPlace").value = "";
      document.getElementById("ghGather").value = "";
      document.getElementById("ghGatherTime").value = "";
      document.getElementById("ghDate").value = "";
      document.getElementById("ghDesc").value = "";
      document.getElementById("ghLimit").value = "12";
      document.getElementById("ghRouteDraft").value = "";
      if (routeEditor) routeEditor.reset();
      fillRouteSelect();
      render();
      setTimeout(() => {
        location.href = "group-hike-detail.html?id=" + encodeURIComponent(hike.id);
      }, 500);
    });

    const search = document.getElementById("groupSearch");
    if (search && search.dataset.i18nPlaceholder) {
      search.placeholder = TW.t(search.dataset.i18nPlaceholder);
    }

    renderInviteFriends();
    fillRouteSelect();
    render();
    } </script>
</body>
</html>
