<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hike Detail — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    #hikeMap { height: 360px; border-radius: var(--radius); border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container" style="max-width:800px">
      <a href="my-hikes.html" class="link-more" data-i18n="hikes_back_list" style="display:inline-block;margin-bottom:1rem"></a>
      <h1 class="page-title" id="hikeTitle"></h1>
      <p class="page-sub" id="hikeDate"></p>

      <div class="stats-grid cols-4 mb-2">
        <div class="stat-box">
          <div class="value" id="vDur">—</div>
          <div class="label" data-i18n="hikes_duration"></div>
        </div>
        <div class="stat-box">
          <div class="value" id="vDist">—</div>
          <div class="label" data-i18n="hikes_distance"></div>
        </div>
        <div class="stat-box">
          <div class="value" id="vGain">—</div>
          <div class="label" data-i18n="hikes_gain"></div>
        </div>
        <div class="stat-box">
          <div class="value" id="vLoss">—</div>
          <div class="label" data-i18n="hikes_loss"></div>
        </div>
      </div>

      <div class="section-head">
        <h2 data-i18n="hikes_route"></h2>
      </div>
      <div id="hikeMap"></div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hikes.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("hikes");
    TW.ensureDemoHike();

    const id = new URLSearchParams(location.search).get("id");
    const hike = TW.getHike(id) || TW.getHikes()[0];
    if (!hike) {
      location.href = "my-hikes.html";
    } else {
      const title = TW.getLang() === "zh" ? hike.titleZh || hike.title : hike.title;
      document.getElementById("hikeTitle").textContent = title;
      document.getElementById("hikeDate").textContent = TW.formatHikeDate(hike.endedAt || hike.startedAt);
      document.getElementById("vDur").textContent = TW.formatDuration(hike.seconds);
      document.getElementById("vDist").textContent = hike.distanceKm + " km";
      document.getElementById("vGain").textContent = hike.elevGain + " m";
      document.getElementById("vLoss").textContent = hike.elevLoss + " m";

      const path = hike.path && hike.path.length ? hike.path : [[22.35, 114.25]];
      const map = L.map("hikeMap").setView(path[0], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap",
      }).addTo(map);
      const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
      L.circleMarker(path[0], { radius: 7, color: "#fff", weight: 2, fillColor: "#2d8a45", fillOpacity: 1 }).addTo(map);
      L.circleMarker(path[path.length - 1], { radius: 7, color: "#fff", weight: 2, fillColor: "#d64545", fillOpacity: 1 }).addTo(map);
      map.fitBounds(line.getBounds().pad(0.2));
    }
  </script>
</body>
</html>
