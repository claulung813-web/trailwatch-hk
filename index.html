<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrailWatch HK — Community Home</title>
  <meta name="description" content="Plan Hong Kong trails on the web, track them in the TrailWatch app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container">
      <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
          <div class="hero-badge" data-i18n="hero_badge"></div>
          <h1 data-i18n="hero_title"></h1>
          <p data-i18n="hero_desc"></p>
          <div class="hero-actions">
            <a class="btn btn-ghost" href="explore.html" data-i18n="hero_cta_explore"></a>
            <a class="btn btn-ghost" href="get-app.html" data-i18n="nav_app"></a>
            <a class="btn btn-ghost" href="plan.html" data-i18n="hero_cta_plan"></a>
          </div>
        </div>
      </section>

      <div class="app-cta-banner">
        <div>
          <h3 data-i18n="plan_banner_title"></h3>
          <p data-i18n="plan_banner_body"></p>
        </div>
        <div class="actions">
          <a class="btn btn-ghost" href="get-app.html" data-i18n="nav_app"></a>
          <a class="btn" style="background:white;color:var(--green-900)" href="explore.html" data-i18n="hero_cta_explore"></a>
        </div>
      </div>

      <section>
        <div class="section-head">
          <h2 data-i18n="home_figures"></h2>
        </div>
        <div class="home-figures">
          <div class="stat-box">
            <div class="value" id="figRoutes">—</div>
            <div class="label" data-i18n="home_fig_routes"></div>
          </div>
          <div class="stat-box">
            <div class="value" id="figKm">—</div>
            <div class="label" data-i18n="home_fig_distance"></div>
          </div>
          <div class="stat-box">
            <div class="value" id="figIncidents">—</div>
            <div class="label" data-i18n="home_fig_incidents"></div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2 data-i18n="home_features_title"></h2>
          <a class="link-more" href="get-app.html" data-i18n="nav_app"></a>
        </div>
        <ul class="home-feature-list">
          <li data-i18n="home_feat_track"></li>
          <li data-i18n="home_feat_plan"></li>
          <li data-i18n="home_feat_report"></li>
          <li data-i18n="home_feat_explore"></li>
          <li data-i18n="home_feat_offline"></li>
          <li data-i18n="home_feat_groups"></li>
          <li data-i18n="home_feat_live"></li>
          <li data-i18n="home_feat_insights"></li>
          <li data-i18n="home_feat_gallery"></li>
        </ul>
      </section>

      <section>
        <div class="section-head">
          <h2 data-i18n="home_rec_routes"></h2>
          <a class="link-more" href="explore.html" data-i18n="view_all"></a>
        </div>
        <div class="trail-grid" id="homeRecRoutes"></div>
      </section>

      <section class="mt-2">
        <div class="section-head">
          <h2 data-i18n="home_featured_articles"></h2>
          <a class="link-more" href="articles.html" data-i18n="view_all"></a>
        </div>
        <div id="homeArticles"></div>
      </section>

      <section class="mt-2">
        <div class="section-head">
          <h2 data-i18n="tab_feed"></h2>
          <a class="link-more" href="feed.html" data-i18n="view_all"></a>
        </div>
        <div id="homeFeed"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("home");

    const trails = TW.trails || [];
    document.getElementById("figRoutes").textContent = trails.length || TW.stats.routes || "102";
    document.getElementById("figKm").textContent = (TW.stats.distanceKm || 12234).toLocaleString() + " km";
    document.getElementById("figIncidents").textContent = (TW.reports && TW.reports.length) || "23";

    const rec = trails.slice(0, 3).map((tr) => ({
      id: tr.id,
      title: tr.name || tr.title,
      titleZh: tr.nameZh || tr.titleZh,
      desc: tr.desc || "",
      descZh: tr.descZh || "",
      district: tr.district || "sai-kung",
      difficulty: tr.difficulty || 2,
      distance: tr.distanceKm != null ? tr.distanceKm + " km" : (tr.distance || "—"),
      duration: tr.duration || "—",
      elevation: tr.elevation || "—",
      rating: tr.rating || 4.5,
      image: tr.image || "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&q=60",
      tags: tr.tags || tr.categories || [],
    }));
    document.getElementById("homeRecRoutes").innerHTML = rec.length
      ? rec.map((t) => renderTrailCard(t, { hidePlan: false })).join("")
      : `<p style="color:var(--text-muted)">${TW.t("page_coming_filters")}</p>`;
    document.querySelectorAll(".plan-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.trail;
        if (TW.isPlanned(id)) TW.unplanTrail(id);
        else TW.planTrail(id);
        location.reload();
      });
    });

    const homeArticles = (TW.getFeaturedArticles
      ? TW.getFeaturedArticles()
      : TW.getArticles
        ? TW.getArticles({ featured: true })
        : (TW.articles || []).filter((a) => a.featured)
    ).slice(0, 3);
    document.getElementById("homeArticles").innerHTML = homeArticles.map((a) => {
      const zh = TW.getLang() === "zh";
      const type = TW.articleCategoryLabel ? TW.articleCategoryLabel(a.category) : a.category;
      const title = zh ? a.titleZh : a.title;
      const url = zh ? (a.urlZh || a.url) : a.url;
      return `<article class="article-card"><div class="meta">${type} · ${a.date}</div><strong><a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a></strong></article>`;
    }).join("");

    document.getElementById("homeFeed").innerHTML = (TW.feed || []).slice(0, 3).map(renderFeedCard).join("");
    bindLikes();
  </script>
</body>
</html>
