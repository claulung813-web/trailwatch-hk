<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrailWatch HK — Hong Kong hiking app, GPS tracking &amp; trail planning</title>
  <meta name="description" content="TrailWatch is Hong Kong’s hiking app for GPS route tracking, trail planning, incident reports, offline maps, group hikes, and country-park stewardship. Download for iPhone and Android." />
  <meta name="keywords" content="TrailWatch, Hong Kong hiking app, GPS tracking, trail planning, country parks, incident report, offline maps, group hike, real-time location, hiking insights, photo gallery, TrailWatch Premium" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260827a" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container">
      <section class="home-slider" id="homeSlider" aria-roledescription="carousel" aria-label="TrailWatch highlights">
        <div class="home-slider-viewport">
          <div class="home-slider-track" id="homeSliderTrack"></div>
        </div>
        <button type="button" class="home-slider-arrow prev" id="homeSliderPrev" aria-label="Previous banner"></button>
        <button type="button" class="home-slider-arrow next" id="homeSliderNext" aria-label="Next banner"></button>
        <button type="button" class="home-slider-pause" id="homeSliderPause">
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <div class="home-slider-dots" id="homeSliderDots" role="tablist"></div>
      </section>

      <section>
        <div class="section-head">
          <h2 data-i18n="home_rec_routes"></h2>
          <a class="link-more" href="explore.html" data-i18n="view_all"></a>
        </div>
        <div class="home-rail">
          <button type="button" class="home-rail-btn prev" id="homeRecPrev" aria-label="Previous"></button>
          <div class="trail-grid media-snap home-rec-snap" id="homeRecRoutes"></div>
          <button type="button" class="home-rail-btn next" id="homeRecNext" aria-label="Next"></button>
        </div>
      </section>

      <section class="mt-2">
        <div class="section-head">
          <h2 data-i18n="home_featured_articles"></h2>
          <a class="link-more" href="articles.html" data-i18n="view_all"></a>
        </div>
        <div class="articles-featured-grid media-snap" id="homeArticles"></div>
      </section>

      <section class="mt-2">
        <div class="section-head">
          <h2 data-i18n="home_features_title"></h2>
          <a class="link-more" href="get-app.html" data-i18n="nav_app"></a>
        </div>
        <div class="home-feature-grid" id="homeFeatures"></div>
        <div class="home-premium-cta">
          <div>
            <strong data-i18n="home_premium_title"></strong>
            <p data-i18n="home_premium_body"></p>
          </div>
          <a class="btn btn-primary" href="premium.html" data-i18n="home_premium_cta"></a>
        </div>
      </section>

      <section class="mt-2">
        <div class="section-head">
          <h2 data-i18n="home_figures"></h2>
        </div>
        <div class="home-figures" id="homeFigures">
          <div class="stat-box">
            <div class="stat-row">
              <span class="stat-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19c2-6 4-9 8-9s6 3 8 9"/>
                  <circle cx="7" cy="8" r="2.25"/>
                  <circle cx="17" cy="8" r="2.25"/>
                  <path d="M9.2 8.4 14.8 8.4"/>
                </svg>
              </span>
              <div class="value" id="figRoutes" data-count="0">0</div>
            </div>
            <div class="label" data-i18n="home_fig_routes"></div>
          </div>
          <div class="stat-box">
            <div class="stat-row">
              <span class="stat-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 16.5 9 7l3.5 5.5L20 5"/>
                  <path d="M15.5 5H20v4.5"/>
                </svg>
              </span>
              <div class="value" id="figKm" data-count="0">0</div>
            </div>
            <div class="label" data-i18n="home_fig_distance"></div>
          </div>
          <div class="stat-box">
            <div class="stat-row">
              <span class="stat-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3.5 21 19.5H3L12 3.5z"/>
                  <path d="M12 10v4.2"/>
                  <circle cx="12" cy="16.6" r="0.85" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <div class="value" id="figIncidents" data-count="0">0</div>
            </div>
            <div class="label" data-i18n="home_fig_incidents"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/i18n.js?v=20260826f"></script>
  <script src="js/data.js?v=20260826e"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js?v=20260826e"></script>
  <script src="js/app.js?v=20260826e"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("home");

    const APP_STORE = "https://itunes.apple.com/hk/app/trailwatch/id791098937";
    const PLAY_STORE = "https://play.google.com/store/apps/details?id=com.computancy.countrypark";
    const zh = TW.getLang() === "zh";

    function pick(obj, enKey, zhKey) {
      return (zh ? obj[zhKey] || obj[enKey] : obj[enKey] || obj[zhKey]) || "";
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function renderBannerSlide(b, i) {
      const title = pick(b, "title", "titleZh");
      const body = pick(b, "body", "bodyZh");
      const badge = pick(b, "badge", "badgeZh");
      const seo = pick(b, "seo", "seoZh");
      const cta = pick(b, "ctaLabel", "ctaLabelZh");
      const cta2 = pick(b, "cta2Label", "cta2LabelZh");
      const img = b.image || "assets/brand/homepage-hero.jpeg";
      const device = b.deviceImage || "assets/brand/device.webp";
      const stores =
        b.showStores
          ? `<div class="store-row hero-stores">
              <a href="${esc(b.appStoreUrl || APP_STORE)}" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store">
                <img src="assets/brand/badge-app-store.webp" alt="Download on the App Store" />
              </a>
              <a href="${esc(b.playStoreUrl || PLAY_STORE)}" target="_blank" rel="noopener noreferrer" aria-label="Get it on Google Play">
                <img src="assets/brand/badge-google-play.webp" alt="GET IT ON Google Play" />
              </a>
            </div>`
          : "";
      const deviceHtml = b.showDevice
        ? `<div class="hero-device"><img src="${esc(device)}" alt="TrailWatch app on iPhone" /></div>`
        : "";
      return `<article class="hero ${b.showDevice ? "hero--app" : ""} home-slide${i === 0 ? " is-active" : ""}" data-slide="${i}"${i === 0 ? "" : " hidden"}>
        <div class="hero-bg" role="img" aria-label="${esc(title)}" style="background-image:linear-gradient(to top, rgba(11, 66, 26, 0.78) 0%, rgba(11, 66, 26, 0.28) 45%, rgba(11, 66, 26, 0.12) 100%), url('${esc(img)}')"></div>
        <div class="hero-content">
          ${badge ? "" : ""}
          <h1>${esc(title)}</h1>
          ${body ? `<p>${esc(body)}</p>` : ""}
          ${stores}
          <div class="hero-actions">
            ${cta ? `<a class="btn btn-ghost" href="${esc(b.ctaHref || "get-app.html")}">${esc(cta)}</a>` : ""}
          </div>
        </div>
        ${deviceHtml}
      </article>`;
    }

    function initHomeSlider() {
      const banners = typeof TW.getHomeBanners === "function" ? TW.getHomeBanners() : [];
      const track = document.getElementById("homeSliderTrack");
      const dots = document.getElementById("homeSliderDots");
      const prev = document.getElementById("homeSliderPrev");
      const next = document.getElementById("homeSliderNext");
      if (!track || !banners.length) return;
      track.innerHTML = banners.map(renderBannerSlide).join("");
      dots.innerHTML = banners
        .map(
          (_, i) =>
            `<button type="button" class="home-slider-dot${i === 0 ? " active" : ""}" data-i="${i}" aria-label="${TW.t("home_banner_goto")} ${i + 1}"></button>`
        )
        .join("");
      prev.setAttribute("aria-label", TW.t("home_banner_prev"));
      next.setAttribute("aria-label", TW.t("home_banner_next"));
      let idx = 0;
      let timer = null;
      let paused = false;
      const pauseBtn = document.getElementById("homeSliderPause");
      const slides = () => Array.from(track.querySelectorAll(".home-slide"));
      function go(n) {
        const list = slides();
        if (!list.length) return;
        idx = (n + list.length) % list.length;
        list.forEach((el, i) => {
          const on = i === idx;
          el.classList.toggle("is-active", on);
          el.hidden = !on;
        });
        dots.querySelectorAll(".home-slider-dot").forEach((d, i) => d.classList.toggle("active", i === idx));
      }
      function start() {
        stop();
        if (paused || slides().length < 2) return;
        timer = setInterval(() => go(idx + 1), 7000);
      }
      function stop() {
        if (timer) clearInterval(timer);
        timer = null;
      }
      function syncPauseLabel() {
        if (!pauseBtn) return;
        pauseBtn.classList.toggle("is-paused", paused);
        pauseBtn.setAttribute("aria-label", paused ? TW.t("home_banner_play") : TW.t("home_banner_pause"));
        pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
      }
      if (pauseBtn) {
        syncPauseLabel();
        pauseBtn.addEventListener("click", () => {
          paused = !paused;
          syncPauseLabel();
          if (paused) stop();
          else start();
        });
      }
      prev.addEventListener("click", () => {
        go(idx - 1);
        start();
      });
      next.addEventListener("click", () => {
        go(idx + 1);
        start();
      });
      dots.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-i]");
        if (!btn) return;
        go(Number(btn.dataset.i));
        start();
      });
      const root = document.getElementById("homeSlider");
      root.addEventListener("mouseenter", stop);
      root.addEventListener("mouseleave", start);
      let touchX = null;
      root.addEventListener(
        "touchstart",
        (e) => {
          touchX = e.changedTouches[0].clientX;
          stop();
        },
        { passive: true }
      );
      root.addEventListener(
        "touchend",
        (e) => {
          if (touchX == null) return;
          const dx = e.changedTouches[0].clientX - touchX;
          touchX = null;
          if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
          start();
        },
        { passive: true }
      );
      if (slides().length < 2) {
        prev.hidden = true;
        next.hidden = true;
        dots.hidden = true;
        if (pauseBtn) pauseBtn.hidden = true;
      }
      start();
    }
    initHomeSlider();

    const figs = typeof TW.getHomeFigures === "function" ? TW.getHomeFigures() : TW.homeFigures || {};
    const cmsIncidents = typeof TW.getPublicIncidents === "function" ? TW.getPublicIncidents() : [];
    const figTargets = [
      { el: document.getElementById("figRoutes"), value: figs.routes || 18420, suffix: "" },
      { el: document.getElementById("figKm"), value: figs.distanceKm || 3256780, suffix: " km" },
      {
        el: document.getElementById("figIncidents"),
        value: figs.incidents || cmsIncidents.length || (TW.reports && TW.reports.length) || 2146,
        suffix: "",
      },
    ];

    function animateHomeFigures() {
      const duration = 2000;
      const stagger = 200;
      const startAt = performance.now();
      figTargets.forEach((item, i) => {
        if (!item.el) return;
        item.el.textContent = "0" + item.suffix;
        const begin = startAt + i * stagger;
        function frame(now) {
          const t = now - begin;
          if (t < 0) {
            requestAnimationFrame(frame);
            return;
          }
          if (t >= duration) {
            item.el.textContent = item.value.toLocaleString() + item.suffix;
            return;
          }
          const p = t / duration;
          const eased = 1 - Math.pow(1 - p, 3);
          item.el.textContent = Math.floor(item.value * eased).toLocaleString() + item.suffix;
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      });
    }

    (function watchHomeFigures() {
      const box = document.getElementById("homeFigures");
      if (!box) return;
      let started = false;
      const run = () => {
        if (started) return;
        started = true;
        animateHomeFigures();
      };
      if (!("IntersectionObserver" in window)) {
        run();
        return;
      }
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              run();
              io.disconnect();
            }
          });
        },
        { rootMargin: "100px", threshold: 0.2 }
      );
      io.observe(box);
    })();

    function recAsTrail(r) {
      return {
        id: r.id,
        trailId: r.trailId || r.id,
        title: r.title || r.name,
        titleZh: r.titleZh || r.nameZh,
        desc: r.desc || "",
        descZh: r.descZh || "",
        district: r.district || "sai-kung",
        difficulty: r.difficulty || 2,
        distance: r.distanceKm != null ? r.distanceKm + " km" : (r.distance || "—"),
        duration: r.durationClock || r.duration || "—",
        elevation: r.elevation || (r.elevChange != null ? r.elevChange + " m" : "—"),
        rating: r.rating || 4.5,
        image: r.image || "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&q=60",
        tags: r.tags || r.categories || [],
        editorChoice: true,
      };
    }
    const cmsRecs = typeof TW.getRecommendedTrails === "function" ? TW.getRecommendedTrails() : [];
    const recSource = cmsRecs.length ? cmsRecs : (TW.trails || []);
    const rec = recSource.slice(0, 12).map(recAsTrail);
    document.getElementById("homeRecRoutes").innerHTML = rec.length
      ? rec.map((t) => renderTrailCard(t, { hidePlan: false })).join("")
      : `<p style="color:var(--text-muted)">${TW.t("page_coming_filters")}</p>`;

    (function bindHomeRecRail() {
      const rail = document.getElementById("homeRecRoutes");
      const prev = document.getElementById("homeRecPrev");
      const next = document.getElementById("homeRecNext");
      if (!rail || !prev || !next) return;
      const step = () => Math.max(rail.clientWidth * 0.9, 240);
      prev.addEventListener("click", () => rail.scrollBy({ left: -step(), behavior: "smooth" }));
      next.addEventListener("click", () => rail.scrollBy({ left: step(), behavior: "smooth" }));
      function sync() {
        const max = rail.scrollWidth - rail.clientWidth - 4;
        prev.disabled = rail.scrollLeft <= 4;
        next.disabled = rail.scrollLeft >= max;
        prev.hidden = next.hidden = max <= 0;
      }
      rail.addEventListener("scroll", sync, { passive: true });
      window.addEventListener("resize", sync);
      sync();
    })();

    const homeArticles = (TW.getFeaturedArticles
      ? TW.getFeaturedArticles()
      : TW.getArticles
        ? TW.getArticles({ featured: true })
        : (TW.articles || []).filter((a) => a.featured)
    ).slice(0, 3);
    document.getElementById("homeArticles").innerHTML = homeArticles.length
      ? homeArticles.map((a) => TW.renderArticleCard(a, { compact: true })).join("")
      : `<p style="color:var(--text-muted)">${TW.t("article_empty")}</p>`;

    const features = [
      { icon: "track", key: "home_feat_track", href: "app/index.html", premium: false },
      { icon: "plan", key: "home_feat_plan", href: "plan.html", premium: false },
      { icon: "reports", key: "home_feat_report", href: "reports.html", premium: false },
      { icon: "explore", key: "home_feat_explore", href: "explore.html", premium: false },
      { icon: "download", key: "home_feat_offline", href: "get-app.html#premium", premium: true },
      { icon: "groupHikes", key: "home_feat_groups", href: "group-hikes.html", premium: false },
      { icon: "live", key: "home_feat_live", href: "get-app.html#premium", premium: true },
      { icon: "insights", key: "home_feat_insights", href: "profile.html#insights", premium: true },
      { icon: "badges", key: "home_feat_badge", href: "profile.html#badges", premium: false },
      { icon: "photos", key: "home_feat_gallery", href: "gallery.html", premium: false },
    ];
    document.getElementById("homeFeatures").innerHTML = features
      .map(
        (f) => `<a class="home-feature-card${f.premium ? " is-premium" : ""}" href="${f.href}">
          <span class="fig">${twIcon(f.icon)}</span>
          <span class="label">${TW.t(f.key)}</span>
          ${f.premium ? `<span class="prem-pill home-prem-pill">${TW.t("app_premium")}</span>` : ""}
        </a>`
      )
      .join("");
  </script>
</body>
</html>
