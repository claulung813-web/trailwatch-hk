<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:520px">
      <h1 class="page-title" id="loginTitle">Log in</h1>
      <p class="page-sub" id="loginSub">Sign in to your TrailWatch account.</p>

      <form class="card" id="loginForm" style="padding:1.35rem">
        <div class="form-group">
          <label for="loginEmail" id="loginEmailLabel">Email</label>
          <input
            class="form-input"
            id="loginEmail"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@email.com"
          />
        </div>
        <div class="form-group">
          <label for="loginPassword" id="loginPasswordLabel">Password</label>
          <input
            class="form-input"
            id="loginPassword"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Password"
          />
        </div>
        <div class="form-group">
          <label for="loginName" id="loginNameLabel">Name (optional)</label>
          <input
            class="form-input"
            id="loginName"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Your name"
          />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginCta">Log in</button>
        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.75rem;text-align:center" id="loginNote">Demo login — any password works. Try alex.wong@email.com or alex@example.com.</p>
        <p class="auth-switch">
          <span id="loginNoAccount">Don't have an account?</span>
          <a href="register.html" id="loginRegisterLink">Register</a>
        </p>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("login");

    // Page-local copy — never via data-i18n keys (avoids raw key leakage)
    (function applyLoginCopy() {
      const zh = {
        loginTitle: "登入",
        loginSub: "登入你的 TrailWatch 帳戶。",
        loginEmailLabel: "電郵",
        loginPasswordLabel: "密碼",
        loginNameLabel: "姓名（可選）",
        loginCta: "登入",
        loginNote: "示範登入——任意密碼均可。可試 alex.wong@email.com 或 alex@example.com。",
        loginNoAccount: "還沒有帳戶？",
        loginRegisterLink: "註冊",
        loginEmailPh: "you@email.com",
        loginPasswordPh: "密碼",
        loginNamePh: "你的姓名",
      };
      const en = {
        loginTitle: "Log in",
        loginSub: "Sign in to your TrailWatch account.",
        loginEmailLabel: "Email",
        loginPasswordLabel: "Password",
        loginNameLabel: "Name (optional)",
        loginCta: "Log in",
        loginNote: "Demo login — any password works. Try alex.wong@email.com or alex@example.com.",
        loginNoAccount: "Don't have an account?",
        loginRegisterLink: "Register",
        loginEmailPh: "you@email.com",
        loginPasswordPh: "Password",
        loginNamePh: "Your name",
      };
      const copy = TW.getLang() === "zh" ? zh : en;
      Object.keys(copy).forEach((id) => {
        if (id.endsWith("Ph")) return;
        const el = document.getElementById(id);
        if (el) el.textContent = copy[id];
      });
      const email = document.getElementById("loginEmail");
      const password = document.getElementById("loginPassword");
      const name = document.getElementById("loginName");
      if (email) email.placeholder = copy.loginEmailPh;
      if (password) password.placeholder = copy.loginPasswordPh;
      if (name) name.placeholder = copy.loginNamePh;
      const reg = document.getElementById("loginRegisterLink");
      if (reg) {
        const next = new URLSearchParams(location.search).get("next");
        if (next) reg.href = "register.html?next=" + encodeURIComponent(next);
      }
    })();

    function resolveLoginName(email, optionalName) {
      const named = (optionalName || "").trim();
      if (named) return named;
      const e = (email || "").trim().toLowerCase();
      if (TW.user && TW.user.email && String(TW.user.email).toLowerCase() === e) {
        return TW.user.name || "";
      }
      try {
        const store = CMS.getStore();
        const fromUsers = (store.users || []).find((u) => String(u.email || "").toLowerCase() === e);
        if (fromUsers && fromUsers.name) return fromUsers.name;
        const fromMembers = (store.members || []).find((m) => String(m.email || "").toLowerCase() === e);
        if (fromMembers && fromMembers.name) return fromMembers.name;
      } catch (err) { /* demo lookup optional */ }
      const local = e.split("@")[0];
      return local || TW.t("nav_member");
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const name = resolveLoginName(email, document.getElementById("loginName").value);
      TW.loginMember({ name: name, email: email });
      showToast(TW.getLang() === "zh" ? "歡迎回來！" : "Welcome back!");
      const dest = typeof TW.authNextUrl === "function" ? TW.authNextUrl("profile.html#overview") : "profile.html#overview";
      setTimeout(() => {
        location.href = dest;
      }, 700);
    });
  </script>
</body>
</html>
