<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:520px">
      <h1 class="page-title" data-i18n="login_title"></h1>
      <p class="page-sub" data-i18n="login_sub"></p>

      <form class="card" id="loginForm" style="padding:1.35rem">
        <div class="form-group">
          <label data-i18n="profile_email"></label>
          <input class="form-input" id="loginEmail" type="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label data-i18n="login_password"></label>
          <input class="form-input" id="loginPassword" type="password" required autocomplete="current-password" />
        </div>
        <div class="form-group">
          <label data-i18n="login_name_optional"></label>
          <input class="form-input" id="loginName" autocomplete="name" />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="login_cta"></button>
        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.75rem;text-align:center" data-i18n="login_note"></p>
        <p class="auth-switch">
          <span data-i18n="login_no_account"></span>
          <a href="register.html" data-i18n="nav_register"></a>
        </p>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("login");

    function resolveLoginName(email, optionalName) {
      const named = (optionalName || "").trim();
      if (named) return named;
      const e = (email || "").trim().toLowerCase();
      if (TW.user && TW.user.email && String(TW.user.email).toLowerCase() === e) {
        return TW.user.name || "";
      }
      try {
        const store = CMS.getStore();
        const fromUsers = (store.users || []).find((u) => String(u.email || "").toLowerCase() === e);
        if (fromUsers && fromUsers.name) return fromUsers.name;
        const fromMembers = (store.members || []).find((m) => String(m.email || "").toLowerCase() === e);
        if (fromMembers && fromMembers.name) return fromMembers.name;
      } catch (err) { /* demo lookup optional */ }
      const local = e.split("@")[0];
      return local || TW.t("nav_member");
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const name = resolveLoginName(email, document.getElementById("loginName").value);
      TW.loginMember({ name: name, email: email });
      showToast(TW.t("login_thanks"));
      setTimeout(() => {
        location.href = "profile.html#overview";
      }, 700);
    });
  </script>
</body>
</html>
