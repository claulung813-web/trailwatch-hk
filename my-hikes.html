<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Tracked Hikes — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container" style="max-width:720px">
      <h1 class="page-title" data-i18n="hikes_title"></h1>
      <p class="page-sub" data-i18n="hikes_sub"></p>

      <div class="app-cta-banner" style="margin-bottom:1.25rem">
        <div>
          <h3 data-i18n="plan_banner_title"></h3>
          <p data-i18n="hikes_sub"></p>
        </div>
        <div class="actions">
          <a class="btn btn-ghost" href="app/index.html" data-i18n="hikes_open_app"></a>
        </div>
      </div>

      <div class="record-list" id="hikeList"></div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hikes.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("hikes");
    TW.ensureDemoHike();
    const list = TW.getHikes();
    document.getElementById("hikeList").innerHTML = list.length
      ? list.map((h) => TW.renderHikeListItem(h, "hike-detail.html?id=" + encodeURIComponent(h.id))).join("")
      : `<div class="card" style="padding:2rem;text-align:center"><p style="margin-bottom:1rem;color:var(--text-muted)">${TW.t("hikes_empty")}</p><a class="btn btn-primary" href="app/index.html">${TW.t("hikes_open_app")}</a></div>`;
  </script>
</body>
</html>
