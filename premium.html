<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260828o" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page premium-page">
    <div class="container">
      <section class="premium-hero">
        <div class="premium-hero-copy">
          <span class="app-premium-pill premium-hero-badge">Premium</span>
          <h1 class="page-title" data-i18n="premium_page_title"></h1>
          <p class="page-sub" data-i18n="premium_page_lede"></p>
        </div>
      </section>

      <div class="section-head">
        <h2 data-i18n="premium_page_plans_title"></h2>
      </div>
      <div class="premium-plans-grid" id="premiumPlans">
        <article class="premium-plan-card">
          <h3 data-i18n="premium_plan_individual"></h3>
          <p class="premium-plan-price">HK$300 <span data-i18n="premium_plan_per_year"></span></p>
          <p data-i18n="premium_plan_individual_body"></p>
          <button type="button" class="btn btn-primary" id="btnIndividual" data-i18n="premium_plan_individual_cta"></button>
        </article>
        <article class="premium-plan-card is-featured">
          <h3 data-i18n="premium_plan_family"></h3>
          <p class="premium-plan-price">HK$950 <span data-i18n="premium_plan_per_year"></span></p>
          <p class="premium-plan-meta" data-i18n="premium_plan_seats"></p>
          <p data-i18n="premium_plan_family_body"></p>
          <button type="button" class="btn btn-primary" id="btnFamily" data-i18n="premium_plan_family_cta"></button>
        </article>
      </div>

      <section class="premium-spotlight card">
        <div class="premium-spotlight-media">
          <img src="assets/brand/homepage-hero.jpeg" alt="" loading="lazy" />
        </div>
        <div class="premium-spotlight-copy">
          <h2 id="premiumSpotlightTitle"></h2>
          <p id="premiumSpotlightBody"></p>
        </div>
      </section>

      <div class="section-head">
        <h2 data-i18n="premium_page_features_title"></h2>
      </div>
      <div class="premium-benefits-grid" id="premiumBenefits"></div>

      <section class="premium-cta-band card">
        <div>
          <h2 data-i18n="home_premium_title"></h2>
          <p data-i18n="dash_premium_plan_body"></p>
        </div>
        <a class="btn btn-secondary btn-lg" href="family.html" id="familyManageLink" data-i18n="family_manage"></a>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js?v=20261105a"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("premium");
    if (TW.applyPremiumSpotlightCopy) TW.applyPremiumSpotlightCopy();

    function subscribe(planId) {
      if (!TW.isLoggedIn()) {
        location.href = "login.html?next=" + encodeURIComponent("premium.html?plan=" + planId);
        return;
      }
      const res = TW.subscribePremiumPlan(planId);
      if (!res || !res.ok) {
        if (res && res.error === "already_on_family") showToast(TW.t("premium_already_family"));
        else showToast(TW.t("premium_need_login"));
        return;
      }
      if (planId === "family") {
        showToast(TW.t("premium_subscribe_family_ok"));
        setTimeout(() => { location.href = "family.html"; }, 700);
      } else {
        showToast(TW.t("premium_subscribe_ok"));
        setTimeout(() => { location.href = "profile.html"; }, 700);
      }
    }

    const premInfo = TW.getMemberPremiumInfo ? TW.getMemberPremiumInfo() : { active: false };
    const onFamily = !!(premInfo.plan === "family" || (TW.getMyFamilyPlan && TW.getMyFamilyPlan()));

    document.getElementById("btnIndividual").addEventListener("click", () => {
      if (premInfo.active && !onFamily) return;
      subscribe("individual");
    });
    document.getElementById("btnFamily").addEventListener("click", () => {
      if (onFamily) {
        location.href = "family.html";
        return;
      }
      subscribe("family");
    });

    if (premInfo.active) {
      if (onFamily) {
        document.getElementById("btnFamily").textContent = TW.t("family_manage");
      } else {
        document.getElementById("btnIndividual").textContent = TW.t("dash_premium_active");
        document.getElementById("btnIndividual").classList.remove("btn-primary");
        document.getElementById("btnIndividual").classList.add("btn-secondary");
      }
    }

    const wanted = new URLSearchParams(location.search).get("plan");
    if (wanted && TW.isLoggedIn() && (wanted === "individual" || wanted === "family") && !premInfo.active) {
      subscribe(wanted);
    }

    const premiumImages = [
      "assets/brand/homepage-hero.jpeg",
      "assets/brand/img-hiking.jpg",
      "assets/brand/img-route.webp",
    ];

    const benefits = [
      {
        icon: "insights",
        titleKey: "premium_feat_insights_title",
        bodyKey: "premium_feat_insights_body",
        image: premiumImages[0],
      },
      {
        icon: "download",
        titleKey: "premium_feat_offline_title",
        bodyKey: "premium_feat_offline_body",
        image: premiumImages[1],
      },
      {
        icon: "hikes",
        titleKey: "premium_feat_footprint_title",
        bodyKey: "premium_feat_footprint_body",
        image: premiumImages[2],
      },
      {
        icon: "groupHikes",
        titleKey: "premium_feat_groups_title",
        bodyKey: "premium_feat_groups_body",
        image: premiumImages[0],
      },
      {
        icon: "live",
        titleKey: "premium_feat_live_title",
        bodyKey: "premium_feat_live_body",
        image: premiumImages[1],
      },
      {
        icon: "badges",
        titleKey: "premium_feat_badges_title",
        bodyKey: "premium_feat_badges_body",
        image: premiumImages[2],
      },
    ];

    document.getElementById("premiumBenefits").innerHTML = benefits
      .map(
        (b) => `<article class="premium-benefit-card">
          <div class="premium-benefit-media"><img src="${b.image}" alt="" loading="lazy" /></div>
          <div class="premium-benefit-body">
            <span class="premium-benefit-icon" aria-hidden="true">${twIcon(b.icon)}</span>
            <h3>${TW.escapeHtml(TW.t(b.titleKey))}</h3>
            <p>${TW.escapeHtml(TW.t(b.bodyKey))}</p>
          </div>
        </article>`
      )
      .join("");
  </script>
</body>
</html>
