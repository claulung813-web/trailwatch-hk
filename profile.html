<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=20260829e" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page topo-bg">
    <div class="container profile-container">

      <!-- Main profile hub -->
      <div id="profileHub">
        <div class="profile-hero">
          <img class="profile-avatar" id="avatar" alt="" />
          <div class="profile-hero-main">
            <h1 id="name"></h1>
            <div id="profilePremiumCta"></div>
          </div>
          <button type="button" class="icon-btn profile-settings-btn" id="openSettings">
            <span id="settingsIcon"></span>
          </button>
        </div>

        <div class="profile-badge-strip card">
          <div class="profile-badge-strip-label" data-i18n="dash_selected_badge"></div>
          <div class="profile-badge-strip-row">
            <strong id="selectedBadge"></strong>
            <a class="link-more" href="#badges" id="changeBadgeLink" data-i18n="dash_change_badge"></a>
          </div>
        </div>

        <section class="profile-lifetime">
          <div class="section-head">
            <h2 data-i18n="dash_lifetime"></h2>
          </div>
          <div class="home-figures profile-lifetime-stats">
            <div class="stat-box">
              <div class="value" id="lifeKm">—</div>
              <div class="label" data-i18n="km_hiked"></div>
            </div>
            <div class="stat-box">
              <div class="value" id="lifeRecords">—</div>
              <div class="label" data-i18n="records"></div>
            </div>
            <div class="stat-box">
              <div class="value" id="lifeElevation">—</div>
              <div class="label" data-i18n="profile_lifetime_elevation"></div>
            </div>
          </div>
          <button type="button" class="btn btn-secondary dash-more-btn" id="dashMoreBtn" hidden data-i18n="dash_more"></button>
          <div id="dashPremiumMore" hidden>
            <div class="section-head"><h2 data-i18n="mil_top_records"></h2></div>
            <div class="top-records" id="dashTopRecords"></div>
            <div class="section-head"><h2 data-i18n="mil_highlights"></h2></div>
            <ul class="highlight-list" id="milHighlights"></ul>
            <div class="section-head mt-2"><h2 data-i18n="dash_insights"></h2></div>
            <div class="chart-card">
              <h3 data-i18n="insights_pace"></h3>
              <svg class="pace-chart" viewBox="0 0 480 160" preserveAspectRatio="none">
                <defs>
                  <linearGradient id="paceFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#3da855" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#3da855" stop-opacity="0.05"/>
                  </linearGradient>
                </defs>
                <g stroke="#e5e7eb" stroke-width="1">
                  <line x1="40" y1="20" x2="460" y2="20"/><line x1="40" y1="50" x2="460" y2="50"/>
                  <line x1="40" y1="80" x2="460" y2="80"/><line x1="40" y1="110" x2="460" y2="110"/>
                  <line x1="40" y1="140" x2="460" y2="140"/>
                </g>
                <path fill="url(#paceFill)" d="M40,90 L110,85 L180,95 L250,80 L320,88 L390,75 L460,78 L460,140 L40,140 Z"/>
                <path fill="none" stroke="#3da855" stroke-width="2.5" d="M40,90 L110,85 L180,95 L250,80 L320,88 L390,75 L460,78"/>
                <path fill="none" stroke="#4a90c8" stroke-width="2.5" d="M40,110 L110,100 L180,105 L250,70 L320,85 L390,55 L460,60"/>
              </svg>
              <div class="chart-summary">
                <div class="box"><div class="k" data-i18n="insights_overall"></div><div class="v" id="avgPace">—</div></div>
                <div class="box"><div class="k" data-i18n="insights_alltime"></div><div class="v" id="bestPace">—</div></div>
              </div>
            </div>
            <div class="chart-card">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
                <h3 style="margin:0" data-i18n="insights_activity"></h3>
                <div class="toggle-pills" id="activityToggle" style="margin:0">
                  <button class="active" data-mode="yearly" data-i18n="insights_yearly"></button>
                  <button data-mode="monthly" data-i18n="insights_monthly"></button>
                </div>
              </div>
              <div class="chart-bars" id="activityBars" style="margin-top:1rem"></div>
            </div>
            <div class="chart-card">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
                <h3 style="margin:0" data-i18n="insights_distance"></h3>
                <div class="toggle-pills" id="distToggle" style="margin:0">
                  <button class="active" data-mode="yearly" data-i18n="insights_yearly"></button>
                  <button data-mode="monthly" data-i18n="insights_monthly"></button>
                </div>
              </div>
              <div class="chart-bars" id="distBars" style="margin-top:1rem"></div>
            </div>
            <div class="chart-card">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
                <h3 style="margin:0" data-i18n="insights_elevation"></h3>
                <div class="toggle-pills" id="elevToggle" style="margin:0">
                  <button class="active" data-mode="yearly" data-i18n="insights_yearly"></button>
                  <button data-mode="monthly" data-i18n="insights_monthly"></button>
                </div>
              </div>
              <div class="chart-bars" id="elevBars" style="margin-top:1rem"></div>
            </div>
            <div class="chart-card">
              <h3 data-i18n="insights_region"></h3>
              <div id="regionPie"></div>
            </div>
          </div>
        </section>

        <section class="profile-preview-section">
          <div class="section-head">
            <h2 data-i18n="nav_my_plans"></h2>
            <a class="link-more" href="#plans" data-i18n="profile_view_more"></a>
          </div>
          <div id="plansPreview" class="profile-preview-grid"></div>
        </section>

        <section class="profile-preview-section">
          <div class="section-head">
            <h2 data-i18n="app_my_friends"></h2>
          </div>
          <ul id="friendsPreview" class="profile-friends-list"></ul>
        </section>

        <section class="profile-preview-section">
          <div class="section-head">
            <h2 data-i18n="nav_my_records"></h2>
            <a class="link-more" href="#records" data-i18n="profile_view_more"></a>
          </div>
          <div id="recordsPreview" class="profile-preview-grid"></div>
        </section>

        <section class="profile-preview-section">
          <div class="section-head">
            <h2 data-i18n="nav_my_reports"></h2>
            <a class="link-more" href="#reports" data-i18n="profile_view_more"></a>
          </div>
          <div id="reportsPreview" class="profile-preview-grid"></div>
        </section>
      </div>

      <!-- Full: plans -->
      <section class="profile-subview" id="viewPlans" hidden>
        <div class="profile-subview-head">
          <a class="profile-back link-more" href="#" data-profile-back data-i18n="profile_back"></a>
          <h2 data-i18n="nav_my_plans"></h2>
        </div>
        <div id="planEmpty" class="card" style="padding:2rem;text-align:center;display:none">
          <p style="color:var(--text-muted);margin-bottom:1rem" data-i18n="plan_empty"></p>
          <a class="btn btn-primary" href="explore.html" data-i18n="plan_go_explore"></a>
        </div>
        <div class="trail-grid" id="planGrid"></div>
      </section>

      <!-- Full: records -->
      <section class="profile-subview" id="viewRecords" hidden>
        <div class="profile-subview-head">
          <a class="profile-back link-more" href="#" data-profile-back data-i18n="profile_back"></a>
          <h2 data-i18n="nav_my_records"></h2>
        </div>
        <div class="footprint-wrap">
          <div id="footprintMap" class="footprint-map"></div>
          <div class="footprint-gate" id="footprintGate" hidden></div>
        </div>
        <div class="record-list" id="hikeList"></div>
      </section>

      <!-- Full: reports -->
      <section class="profile-subview" id="viewReports" hidden>
        <div class="profile-subview-head">
          <a class="profile-back link-more" href="#" data-profile-back data-i18n="profile_back"></a>
          <h2 data-i18n="nav_my_reports"></h2>
        </div>
        <div id="myReports"></div>
        <p style="margin-top:1rem"><a class="link-more" href="reports.html" data-i18n="nav_incidents"></a></p>
      </section>

      <!-- Badges picker -->
      <section class="profile-subview" id="viewBadges" hidden>
        <div class="profile-subview-head">
          <a class="profile-back link-more" href="#" data-profile-back data-i18n="profile_back"></a>
          <h2 data-i18n="nav_badges"></h2>
        </div>
        <div id="badgePicker"></div>
      </section>

      <!-- Settings -->
      <section class="profile-subview" id="viewSettings" hidden>
        <div class="profile-subview-head">
          <a class="profile-back link-more" href="#" data-profile-back data-i18n="profile_back"></a>
          <h2 data-i18n="nav_settings"></h2>
        </div>
        <div style="max-width:560px;margin:0 auto">
          <div style="text-align:center;margin-bottom:1.5rem">
            <img class="profile-avatar" id="settingsAvatar" alt="" style="margin:0 auto 0.75rem;width:112px;height:112px" />
          </div>
          <form id="profileForm" onsubmit="event.preventDefault();showToast(TW.t('toast_saved'))">
            <div class="form-group">
              <label for="settingsName" data-i18n="profile_name"></label>
              <input class="form-input" id="settingsName" type="text" />
            </div>
            <div class="form-group">
              <label for="settingsEmail" data-i18n="profile_email"></label>
              <input class="form-input" id="settingsEmail" type="email" />
            </div>
            <div class="form-group">
              <label for="settingsNickname" data-i18n="profile_nickname"></label>
              <input class="form-input" id="settingsNickname" type="text" />
            </div>
            <label class="checkbox-row">
              <input type="checkbox" checked />
              <span data-i18n="profile_newsletter"></span>
            </label>
            <button type="submit" class="btn btn-primary btn-block btn-lg" data-i18n="profile_save"></button>
          </form>
          <p style="text-align:center;margin-top:1.5rem">
            <button type="button" class="btn btn-secondary" id="settingsLogout" data-i18n="nav_logout"></button>
          </p>
        </div>
      </section>

    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/env-badge.js"></script>
  <script src="js/hikes.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js?v=20260828m"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("profile");

    const PROFILE_VIEWS = ["hub", "plans", "records", "reports", "badges", "settings"];

    TW.setAvatar(document.getElementById("avatar"), TW.user.avatar);
    TW.setAvatar(document.getElementById("settingsAvatar"), TW.user.avatar);
    document.getElementById("name").textContent = TW.user.name;
    document.getElementById("settingsIcon").innerHTML = twIcon("settings");
    document.getElementById("openSettings").setAttribute("aria-label", TW.t("nav_settings"));

    function renderProfilePremiumCta() {
      const el = document.getElementById("profilePremiumCta");
      if (!el) return;
      const prem = TW.isMemberPremium && TW.isMemberPremium();
      if (prem) {
        el.innerHTML = `<span class="dash-premium-pill">${TW.escapeHtml(TW.t("dash_premium_active"))}</span>`;
      } else {
        el.innerHTML = `<a href="premium.html" class="btn btn-secondary profile-premium-btn">${TW.escapeHtml(TW.t("dash_unlock"))}</a>`;
      }
    }
    renderProfilePremiumCta();

    TW.renderSelectedBadgeCard(null, document.getElementById("selectedBadge"));
    TW.applyPremiumMoreGate();

    const recCount = (TW.records || []).length + (TW.getHikes ? TW.getHikes().length : 0);
    document.getElementById("lifeKm").textContent = (TW.stats.distanceKm || 0).toLocaleString() + " km";
    document.getElementById("lifeRecords").textContent = TW.stats.records || recCount;
    document.getElementById("lifeElevation").textContent = (TW.stats.elevGain || 0).toLocaleString() + " m";

    function parseProfileView(raw) {
      const h = String(raw || "").replace(/^#/, "").toLowerCase();
      if (!h || h === "overview" || h === "dashboard" || h === "profile") return "hub";
      if (h.startsWith("plans") || h.includes("type=plans")) return "plans";
      if (h.startsWith("records") || h === "hikes" || h.includes("type=records")) return "records";
      if (h.startsWith("reports") || h.includes("type=reports")) return "reports";
      if (h.startsWith("badges") || h.includes("type=badges")) return "badges";
      if (h.startsWith("settings")) return "settings";
      if (h === "insights" || h === "milestones") return { view: "hub", openMore: true };
      if (h.startsWith("activity")) {
        if (h.includes("records")) return "records";
        if (h.includes("plans")) return "plans";
        if (h.includes("reports")) return "reports";
        if (h.includes("badges")) return "badges";
      }
      if (h.startsWith("profile")) {
        if (h.includes("records")) return "records";
        if (h.includes("plans")) return "plans";
        if (h.includes("reports")) return "reports";
        if (h.includes("badges")) return "badges";
      }
      return "hub";
    }

    function showProfileView(viewOrParsed, pushHash) {
      let view = typeof viewOrParsed === "string" ? viewOrParsed : viewOrParsed.view;
      const openMore = viewOrParsed && viewOrParsed.openMore;
      if (!PROFILE_VIEWS.includes(view)) view = "hub";

      document.getElementById("profileHub").hidden = view !== "hub";
      document.getElementById("viewPlans").hidden = view !== "plans";
      document.getElementById("viewRecords").hidden = view !== "records";
      document.getElementById("viewReports").hidden = view !== "reports";
      document.getElementById("viewBadges").hidden = view !== "badges";
      document.getElementById("viewSettings").hidden = view !== "settings";

      if (view === "records") initFootprintMap();
      if (view === "hub" && openMore) setDashMore(true);

      if (pushHash !== false) {
        const hashMap = { hub: "", plans: "plans", records: "records", reports: "reports", badges: "badges", settings: "settings" };
        const next = hashMap[view] ? "#" + hashMap[view] : "";
        if (location.hash !== next) history.replaceState(null, "", "profile.html" + next);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setDashMore(open) {
      const prem = TW.isMemberPremium && TW.isMemberPremium();
      const panel = document.getElementById("dashPremiumMore");
      const btn = document.getElementById("dashMoreBtn");
      if (!panel || !btn) return;
      const show = !!(prem && open);
      panel.hidden = !show;
      btn.textContent = show ? TW.t("dash_more_hide") : TW.t("dash_more");
      btn.setAttribute("aria-expanded", show ? "true" : "false");
    }

    document.getElementById("openSettings").addEventListener("click", () => {
      history.pushState(null, "", "#settings");
      showProfileView("settings", false);
    });

    document.querySelectorAll("[data-profile-back]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        history.pushState(null, "", "profile.html");
        showProfileView("hub", false);
      });
    });

    document.getElementById("changeBadgeLink").addEventListener("click", (e) => {
      e.preventDefault();
      history.pushState(null, "", "#badges");
      showProfileView("badges", false);
    });

    const moreBtn = document.getElementById("dashMoreBtn");
    if (moreBtn) {
      moreBtn.addEventListener("click", () => {
        if (!(TW.isMemberPremium && TW.isMemberPremium())) {
          location.href = "premium.html";
          return;
        }
        const panel = document.getElementById("dashPremiumMore");
        setDashMore(panel && panel.hidden);
      });
    }

    window.addEventListener("hashchange", () => {
      const parsed = parseProfileView(location.hash);
      if (parsed && parsed.openMore) showProfileView(parsed, false);
      else showProfileView(typeof parsed === "string" ? parsed : parsed.view || "hub", false);
    });

    const initial = parseProfileView(location.hash);
    if (initial && initial.openMore) showProfileView(initial, true);
    else showProfileView(typeof initial === "string" ? initial : "hub", true);

    /* Dashboard more content */
    const mil = TW.getMilestonesDemo();
    document.getElementById("dashTopRecords").innerHTML = mil.topRecords
      .map((r) => `<div class="top-record-card"><div class="inner"><div class="trophy">🏆</div><div class="name">${r.title}</div><div class="val">${r.val}</div></div><div class="foot">${TW.t(r.key)}</div></div>`)
      .join("");
    document.getElementById("milHighlights").innerHTML = mil.highlights
      .map((h) => `<li><span class="hl-icon">${h.icon}</span><span class="hl-label">${TW.t(h.labelKey)}</span><span class="hl-val">${h.val}</span></li>`)
      .join("");
    document.getElementById("avgPace").textContent = TW.stats.avgPace + " min/km";
    document.getElementById("bestPace").textContent = TW.stats.bestPace + " min/km";
    TW.bindInsightToggle(document.getElementById("activityToggle"), document.getElementById("activityBars"), "activity");
    TW.bindInsightToggle(document.getElementById("distToggle"), document.getElementById("distBars"), "distance");
    TW.bindInsightToggle(document.getElementById("elevToggle"), document.getElementById("elevBars"), "elevation");
    TW.renderRegionPie(document.getElementById("regionPie"));

    TW.renderProfileBadgeGrid(document.getElementById("badgePicker"));
    TW.bindBadgeCatalogSync();

    TW.ensureDemoHike();
    if (TW.ensureDemoPlans) TW.ensureDemoPlans();

    function allMyRecords() {
      const hikes = (TW.getHikes() || []).map((h) => Object.assign({}, h, { _kind: "hike" }));
      const recs = (TW.records || []).map((r) => Object.assign({}, r, { _kind: "record" }));
      return hikes.concat(recs);
    }

    function recordItemHtml(item) {
      return item._kind === "hike"
        ? TW.renderHikeListItem(item, "hike-detail.html?id=" + encodeURIComponent(item.id))
        : renderRecordItem(item);
    }

    function renderProfilePreviewTile(title, meta, href, img, fallbackEmoji) {
      const thumb = img
        ? `<img src="${TW.escapeHtml(img)}" alt="" loading="lazy" />`
        : `<div class="profile-preview-thumb">${fallbackEmoji || "🗺"}</div>`;
      return `<a class="profile-preview-tile" href="${href}">
        ${thumb}
        <div class="profile-preview-tile-body">
          <strong>${TW.escapeHtml(title)}</strong>
          ${meta ? `<span class="meta">${TW.escapeHtml(meta)}</span>` : ""}
        </div>
      </a>`;
    }

    function renderRecordsPreview() {
      const list = allMyRecords().slice(0, 4);
      document.getElementById("recordsPreview").innerHTML = list.length
        ? list
            .map((item) => {
              const href =
                item._kind === "hike"
                  ? "hike-detail.html?id=" + encodeURIComponent(item.id)
                  : typeof TW.recordDetailHref === "function"
                    ? TW.recordDetailHref(item.id)
                    : "user-route.html?id=" + encodeURIComponent(item.id);
              const title = TW.tt(item, "title") || item.title || "";
              const meta =
                item._kind === "hike"
                  ? (item.distanceKm != null ? item.distanceKm + " km" : "") +
                    (item.seconds ? " · " + TW.formatDuration(item.seconds) : "")
                  : [item.distance, item.duration].filter(Boolean).join(" · ");
              return renderProfilePreviewTile(title, meta, href, item.image, "🗺");
            })
            .join("")
        : `<p class="profile-preview-empty">${TW.t("hikes_empty")}</p>`;
    }

    function renderRecordsFull() {
      const list = allMyRecords();
      document.getElementById("hikeList").innerHTML = list.length
        ? list.map(recordItemHtml).join("")
        : `<p style="color:var(--text-muted);padding:1.5rem 0">${TW.t("hikes_empty")}</p>`;
    }

    function renderPlansPreview() {
      const ids = TW.getPlans();
      const trails = ids.map((id) => TW.trails.find((t) => t.id === id)).filter(Boolean).slice(0, 4);
      const el = document.getElementById("plansPreview");
      if (!trails.length) {
        el.innerHTML = `<p class="profile-preview-empty">${TW.t("plan_empty")}</p>`;
        return;
      }
      el.innerHTML = trails.map((t) => renderTrailCard(t, { hidePlan: true, hideDuplicate: true })).join("");
    }

    function renderPlansFull() {
      const ids = TW.getPlans();
      let trails = ids.map((id) => TW.trails.find((t) => t.id === id)).filter(Boolean);
      const empty = document.getElementById("planEmpty");
      const grid = document.getElementById("planGrid");
      if (!trails.length) {
        empty.style.display = "block";
        grid.innerHTML = "";
        return;
      }
      empty.style.display = "none";
      grid.innerHTML = trails
        .map(
          (t) => `<div>${renderTrailCard(t, { hidePlan: true })}
          <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
            <button class="btn btn-secondary" style="flex:1;font-size:0.8rem" data-remove="${t.id}">${TW.t("plan_remove")}</button>
            <a class="btn btn-primary" style="flex:1;font-size:0.8rem" href="plan.html">${TW.t("nav_plan")}</a>
          </div></div>`
        )
        .join("");
      grid.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          TW.togglePlan(btn.getAttribute("data-remove"));
          showToast(TW.t("toast_unplanned"));
          renderPlansFull();
          renderPlansPreview();
        });
      });
    }

    function renderReportsPreview() {
      const list = (TW.reports || []).slice(0, 4);
      document.getElementById("reportsPreview").innerHTML = list.length
        ? list
            .map((r) => {
              const href = "incident-detail.html?id=" + encodeURIComponent(r.id || r.sourceId || "");
              const title = TW.tt(r, "title") || r.title || "";
              const catId = TW.normalizeReportCategory ? TW.normalizeReportCategory(r.category) : r.category;
              const catKey = "cat_" + catId;
              let catLabel = TW.t(catKey);
              if (catLabel === catKey) catLabel = r.categoryLabel || r.category || "";
              const meta = [r.date, catLabel].filter(Boolean).join(" · ");
              return renderProfilePreviewTile(title, meta, href, r.image, "⚠️");
            })
            .join("")
        : `<p class="profile-preview-empty">${TW.t("hikes_empty")}</p>`;
    }

    function renderFriendsPreview() {
      const list = TW.demoFriends || [];
      const el = document.getElementById("friendsPreview");
      if (!el) return;
      el.innerHTML = list.length
        ? list
            .map(
              (f) => `<li class="profile-friend-row">
            ${TW.avatarHtml(f.avatar, "avatar-sm")}
            <span class="profile-friend-name">${TW.escapeHtml(f.name)}</span>
          </li>`
            )
            .join("")
        : `<li class="profile-preview-empty">${TW.t("hikes_empty")}</li>`;
    }

    function renderReportsFull() {
      document.getElementById("myReports").innerHTML =
        (TW.reports || []).map(renderReportItem).join("") ||
        `<p style="color:var(--text-muted)">${TW.t("hikes_empty")}</p>`;
    }

    renderRecordsPreview();
    renderRecordsFull();
    renderPlansPreview();
    renderPlansFull();
    renderReportsPreview();
    renderReportsFull();
    renderFriendsPreview();

    let footprintMap;
    function initFootprintMap() {
      const mapEl = document.getElementById("footprintMap");
      const gate = document.getElementById("footprintGate");
      const prem = TW.isMemberPremium && TW.isMemberPremium();
      if (gate) {
        gate.hidden = !!prem;
        if (!prem) {
          gate.innerHTML = `<span class="app-premium-pill">${TW.t("app_premium")}</span>
            <p style="margin:0.65rem 0 1rem;max-width:22rem">${TW.t("footprint_locked")}</p>
            <a class="btn btn-primary" href="premium.html">${TW.t("dash_unlock")}</a>`;
        }
      }
      if (!mapEl || typeof L === "undefined" || footprintMap) {
        if (footprintMap) setTimeout(() => footprintMap.invalidateSize(), 120);
        return;
      }
      footprintMap = L.map(mapEl, { scrollWheelZoom: false, attributionControl: false }).setView([22.35, 114.15], 10);
      TW.addMapTiles(footprintMap, { maxZoom: 18 });
      const bounds = [];
      allMyRecords().forEach((item) => {
        const path = item.path;
        if (!path || path.length < 2) return;
        const line = L.polyline(path, { color: "#1a6b32", weight: 3, opacity: 0.75 }).addTo(footprintMap);
        bounds.push(line.getBounds());
      });
      if (bounds.length) {
        const b = bounds[0];
        bounds.slice(1).forEach((x) => b.extend(x));
        footprintMap.fitBounds(b, { padding: [24, 24] });
      }
      setTimeout(() => footprintMap.invalidateSize(), 150);
    }

    const member = TW.getMemberAuth && TW.getMemberAuth();
    document.getElementById("settingsName").value = (member && (member.name || member.displayName)) || TW.user.name;
    document.getElementById("settingsEmail").value = (member && member.email) || TW.user.email;
    document.getElementById("settingsNickname").value = TW.user.nickname || "";

    document.getElementById("settingsLogout").addEventListener("click", () => {
      TW.logoutMember();
      location.href = "index.html";
    });
  </script>
</body>
</html>
