<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor’s Choice — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=20260828c" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container route-share">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="explore.html" data-i18n="explore_view_editors"></a>
        <span>›</span>
        <span id="crumbTitle"></span>
        <span>›</span>
        <a href="plan.html" data-i18n="nav_plan"></a>
      </nav>
      <h1 class="page-title" id="recTitle"></h1>
      <div class="route-share-byline">
        <strong id="recAuthor">TrailWatch</strong>
        <span id="recDate"></span>
      </div>
      <div id="recMap" class="route-share-map"></div>
      <p class="route-share-story" id="recDesc"></p>
      <p class="route-share-itinerary" id="recItinerary"></p>
      <section class="route-share-block">
        <h2 id="lblPlanData"></h2>
        <div class="route-share-stats" id="planStats"></div>
      </section>
      <section class="route-share-block">
        <h2 id="lblElev"></h2>
        <div id="elevChart"></div>
      </section>
      <section class="route-share-block">
        <h2 id="lblPhotos"></h2>
        <div class="rec-photo-grid" id="photoGrid"></div>
      </section>
      <div class="detail-next-steps">
        <button type="button" class="btn btn-secondary bookmark-btn icon-only" id="recBookmark" aria-label="Bookmark" title=""></button>
        <button type="button" class="btn btn-primary dup-btn" id="recDup" data-i18n="rec_duplicate_edit"></button>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js?v=20260828c"></script>
  <script src="js/data.js?v=20260828c"></script>
  <script src="js/live-routes.js?v=20260828c"></script>
  <script src="js/cms-store.js?v=20260828c"></script>
  <script src="js/app.js?v=20260828c"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("explore");
    const t = TW.t;
    document.getElementById("lblPlanData").textContent = t("rec_planned_data");
    document.getElementById("lblElev").textContent = t("rec_elev_stat");
    document.getElementById("lblPhotos").textContent = t("rec_photos");

    const id = new URLSearchParams(location.search).get("id");
    const r =
      (typeof TW.getRecommendedTrail === "function" && TW.getRecommendedTrail(id)) ||
      (typeof TW.resolveTrailSource === "function" && TW.resolveTrailSource(id)) ||
      (TW.trails || []).find((x) => x.id === id);
    if (!r) {
      location.href = "explore.html";
    } else {
      const title = TW.tt(r, "title");
      document.title = title + " — TrailWatch HK";
      document.getElementById("recTitle").textContent = title;
      document.getElementById("crumbTitle").textContent = title;
      document.getElementById("recDesc").textContent = TW.tt(r, "desc") || "";
      const it = TW.getLang() === "zh" ? r.itineraryZh || r.itinerary : r.itinerary || r.itineraryZh;
      document.getElementById("recItinerary").textContent = it ? t("rec_itinerary") + "：" + it : "";
      document.getElementById("recAuthor").textContent = r.author || "TrailWatch";
      document.getElementById("recDate").textContent = r.date || "";

      const dist = r.distanceKm != null ? Number(r.distanceKm).toFixed(2) : (r.distance || "—");
      const dur = r.durationClock || r.duration || "—";
      const elev = r.elevChange != null ? r.elevChange : r.elevation || "—";
      document.getElementById("planStats").innerHTML = [
        [dur, t("rec_duration_lbl")],
        [dist, t("rec_distance_km")],
        [elev, t("rec_elev_changes")],
      ].map((s) => `<div><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("");

      document.getElementById("elevChart").innerHTML = TW.elevChartHtml({
        elevMax: r.elevMax,
        elevMin: r.elevMin,
        elevProfile: r.elevProfile,
        showPace: false,
      });

      const photos = r.photos && r.photos.length ? r.photos : r.image ? [r.image] : [];
      document.getElementById("photoGrid").innerHTML = photos
        .map((p) => `<img src="${p}" alt="" loading="lazy" />`)
        .join("");

      const planId = r.trailId || r.id;
      const bm = document.getElementById("recBookmark");
      bm.dataset.trail = planId;
      bm.setAttribute("aria-label", t("rec_bookmark"));
      bm.title = t("rec_bookmark");
      bm.innerHTML = typeof twIcon === "function" ? twIcon("bookmarks") : "🔖";
      if (TW.isBookmarked(planId)) {
        bm.classList.add("active");
        bm.setAttribute("aria-pressed", "true");
      } else {
        bm.setAttribute("aria-pressed", "false");
      }
      document.getElementById("recDup").dataset.trail = planId;

      const path = (r.path && r.path.length ? r.path : TW.demoPathAround ? TW.demoPathAround(r.lat, r.lng) : [[22.32, 114.17]])
        .map((p) => [Number(p[0]), Number(p[1])]);
      const map = L.map("recMap").setView(path[0], 13);
      TW.addMapTiles(map);
      if (path.length > 1) {
        const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
        map.fitBounds(line.getBounds().pad(0.15));
        if (typeof TW.addRouteEndpoints === "function") TW.addRouteEndpoints(map, path);
      }
    }
  </script>
</body>
</html>
