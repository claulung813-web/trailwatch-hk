<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container" style="max-width:520px">
      <h1 class="page-title" id="regTitle">Create an account</h1>
      <p class="page-sub" id="regSub"></p>

      <form class="card" id="regForm" style="padding:1.35rem">
        <div class="form-group">
          <label for="regFirstName" id="regFirstLabel">First name *</label>
          <input class="form-input" id="regFirstName" name="firstName" type="text" required autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label for="regLastName" id="regLastLabel">Last name *</label>
          <input class="form-input" id="regLastName" name="lastName" type="text" required autocomplete="family-name" />
        </div>
        <div class="form-group">
          <label for="regEmail" id="regEmailLabel">Email *</label>
          <input class="form-input" id="regEmail" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="regPhone" id="regPhoneLabel">Phone number (optional)</label>
          <input class="form-input" id="regPhone" name="phone" type="tel" autocomplete="tel" />
        </div>
        <div class="form-group">
          <label style="display:flex;gap:0.5rem;align-items:flex-start;font-weight:500">
            <input type="checkbox" id="regNews" checked style="margin-top:0.2rem" />
            <span id="regNewsLabel">Subscribe to our newsletter — culture, history and ecology of Hong Kong’s trails and Country Parks.</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="regCta">Sign up</button>
        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.75rem;text-align:center" id="regNote"></p>
        <p class="auth-switch">
          <span id="regHaveAccount">Already have an account?</span>
          <a href="login.html" id="regLoginLink">Log in</a>
        </p>
      </form>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("register");

    (function applyRegisterCopy() {
      const t = TW.t;
      document.getElementById("regTitle").textContent = t("register_title");
      document.getElementById("regSub").textContent = t("register_sub");
      document.getElementById("regFirstLabel").textContent = t("register_first_name");
      document.getElementById("regLastLabel").textContent = t("register_last_name");
      document.getElementById("regEmailLabel").textContent = t("register_email");
      document.getElementById("regPhoneLabel").textContent = t("register_phone");
      document.getElementById("regNewsLabel").textContent = t("register_newsletter");
      document.getElementById("regCta").textContent = t("register_cta");
      document.getElementById("regNote").textContent = t("register_note");
      document.getElementById("regHaveAccount").textContent = t("register_have_account");
      document.getElementById("regLoginLink").textContent = t("nav_login");
      document.getElementById("regFirstName").placeholder = t("register_first_ph");
      document.getElementById("regLastName").placeholder = t("register_last_ph");
      document.getElementById("regEmail").placeholder = t("login_email_placeholder");
      document.getElementById("regPhone").placeholder = t("register_phone_ph");
      document.getElementById("regNews").checked = true;
      const login = document.getElementById("regLoginLink");
      const next = new URLSearchParams(location.search).get("next");
      if (next) login.href = "login.html?next=" + encodeURIComponent(next);
    })();

    document.getElementById("regForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const firstName = document.getElementById("regFirstName").value.trim();
      const lastName = document.getElementById("regLastName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const newsletter = document.getElementById("regNews").checked;
      const name = [firstName, lastName].filter(Boolean).join(" ");
      if (typeof CMS !== "undefined" && CMS.submitMember) {
        CMS.submitMember({
          firstName: firstName,
          lastName: lastName,
          name: name,
          email: email,
          phone: phone,
          newsletter: newsletter,
        });
      }
      TW.loginMember({
        firstName: firstName,
        lastName: lastName,
        name: name,
        email: email,
        phone: phone,
        newsletter: newsletter,
      });
      showToast(TW.t("register_thanks"));
      e.target.reset();
      document.getElementById("regNews").checked = true;
      const dest = TW.authNextUrl("profile.html#overview");
      setTimeout(() => {
        location.href = dest;
      }, 900);
    });
  </script>
</body>
</html>
