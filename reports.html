<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Incident Reports — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=20260828d" />
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="container">
      <div class="section-head">
        <div>
          <h1 class="page-title" style="margin:0" data-i18n="reports_title"></h1>
          <p class="meta" style="margin:0.35rem 0 0" data-i18n="reports_sub"></p>
        </div>
      </div>

      <div class="search-bar explore-search" style="margin:1rem 0 0.75rem">
        <input type="search" id="reportSearch" data-i18n-placeholder="search_placeholder" />
      </div>

      <div class="reports-cat-wrap explore-inc-cats">
        <span class="reports-filter-label" data-i18n="reports_filter_category"></span>
        <div class="chip-row" id="reportCatFilter"></div>
      </div>

      <details class="tw-advanced" id="reportAdvanced" style="margin:0.85rem 0 1rem">
        <summary data-i18n="toolbar_advanced"></summary>
        <div class="tw-advanced-body">
          <div class="filter-bar reports-filters" style="margin-bottom:0">
            <div>
              <label for="reportDateFilter" data-i18n="reports_filter_date"></label>
              <select class="form-select" id="reportDateFilter">
                <option value="all" selected data-i18n="reports_date_all"></option>
                <option value="6m" data-i18n="reports_date_6m"></option>
                <option value="30d" data-i18n="reports_date_30d"></option>
                <option value="90d" data-i18n="reports_date_90d"></option>
                <option value="year" data-i18n="reports_date_year"></option>
              </select>
            </div>
            <div>
              <label for="reportStatusFilter" data-i18n="reports_filter_status"></label>
              <select class="form-select" id="reportStatusFilter">
                <option value="all" selected data-i18n="reports_status_all"></option>
                <option value="new" data-i18n="status_new"></option>
                <option value="update" data-i18n="status_updated"></option>
                <option value="closed" data-i18n="status_closed"></option>
              </select>
            </div>
          </div>
        </div>
      </details>

      <div class="explore-toolbar" style="margin-top:0.25rem">
        <h2 class="explore-count" id="reportCount"></h2>
        <span class="meta" data-i18n="reports_map_hint"></span>
      </div>

      <div class="report-map report-map--tall" id="reportMap"></div>
      <div class="report-list report-grid" id="reportList"></div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js?v=20260828d"></script>
  <script src="js/data.js?v=20260828d"></script>
  <script src="js/live-routes.js?v=20260828d"></script>
  <script src="js/cms-store.js?v=20260828d"></script>
  <script src="js/app.js?v=20260828d"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("reports");

    let dateRange = "all";
    let category = "all";
    let status = "all";
    let query = "";
    let mapMarkers = [];

    const map = L.map("reportMap", { scrollWheelZoom: false }).setView([22.32, 114.17], 11);
    TW.addMapTiles(map);
    if (TW.prepareLeafletMap) TW.prepareLeafletMap(map);

    const categories = [
      { id: "all", labelKey: "filter_all" },
      { id: "waste", labelKey: "cat_waste" },
      { id: "tree", labelKey: "cat_tree" },
      { id: "carcass", labelKey: "cat_carcass" },
      { id: "vandalism", labelKey: "cat_vandalism" },
      { id: "suspicious", labelKey: "cat_suspicious" },
      { id: "river", labelKey: "cat_river" },
      { id: "concrete", labelKey: "cat_concrete" },
      { id: "marine", labelKey: "cat_marine" },
      { id: "danger", labelKey: "cat_danger" },
      { id: "others", labelKey: "cat_others" },
    ];

    function filteredList() {
      let list = TW.getCommunityReports({ dateRange: dateRange, category: category, status: status });
      const q = query.trim().toLowerCase();
      if (!q) return list;
      return list.filter((r) => {
        const hay = (
          TW.tt(r, "title") +
          " " +
          TW.tt(r, "desc") +
          " " +
          (r.category || "") +
          " " +
          (r.categoryLabel || "") +
          " " +
          (r.reporter || "")
        ).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }

    function renderCatChips() {
      document.getElementById("reportCatFilter").innerHTML = categories
        .map((c) => {
          const n =
            c.id === "all"
              ? TW.getCommunityReports({ dateRange: dateRange, status: status }).length
              : TW.getCommunityReports({ dateRange: dateRange, category: c.id, status: status }).length;
          return `<button type="button" class="chip${category === c.id ? " active" : ""}" data-cat="${c.id}">${TW.t(c.labelKey)} (${n})</button>`;
        })
        .join("");
    }

    function refreshList() {
      const list = filteredList();
      document.getElementById("reportCount").textContent = list.length + " " + TW.t("reports_count");
      document.getElementById("reportList").innerHTML =
        list.map(renderReportItem).join("") ||
        TW.emptyStateHtml(TW.t("empty_incidents_district"), TW.t("empty_change_filter"), 'id="reportReset"');
      const reset = document.getElementById("reportReset");
      if (reset) {
        reset.addEventListener("click", () => {
          dateRange = "all";
          category = "all";
          status = "all";
          query = "";
          dateSel.value = "all";
          statusSel.value = "all";
          document.getElementById("reportSearch").value = "";
          refreshAll();
        });
      }
      return list;
    }

    function refreshMapPins(list) {
      mapMarkers.forEach((m) => map.removeLayer(m));
      mapMarkers = [];
      const bounds = [];
      list.forEach((r) => {
        if (r.lat == null || r.lng == null) return;
        const icon = L.divIcon({
          className: "",
          html: `<div style="background:#d64545;color:white;padding:4px 8px;border-radius:8px;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)">⚠</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
        });
        const reporter = TW.getLang() === "zh" ? r.reporterZh || r.reporter : r.reporter;
        const href = "incident-detail.html?id=" + encodeURIComponent(r.id || r.sourceId || "");
        const popup =
          `<a href="${href}"><strong>${TW.escapeHtml(TW.tt(r, "title"))}</strong></a><br/>` +
          `${TW.escapeHtml(r.date || "")}` +
          (reporter ? `<br/>👤 ${TW.escapeHtml(reporter)}` : "");
        mapMarkers.push(L.marker([r.lat, r.lng], { icon }).addTo(map).bindPopup(popup));
        bounds.push([r.lat, r.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
      else map.setView([22.32, 114.17], 11);
    }

    function refreshAll() {
      renderCatChips();
      refreshMapPins(refreshList());
    }

    const dateSel = document.getElementById("reportDateFilter");
    const statusSel = document.getElementById("reportStatusFilter");
    [dateSel, statusSel].forEach((sel) => {
      sel.querySelectorAll("option[data-i18n]").forEach((opt) => {
        opt.textContent = TW.t(opt.getAttribute("data-i18n"));
      });
    });
    dateSel.addEventListener("change", () => {
      dateRange = dateSel.value || "6m";
      refreshAll();
    });
    statusSel.addEventListener("change", () => {
      status = statusSel.value || "all";
      refreshAll();
    });
    document.getElementById("reportCatFilter").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      category = btn.dataset.cat;
      refreshAll();
    });
    document.getElementById("reportSearch").addEventListener("input", (e) => {
      query = e.target.value || "";
      refreshAll();
    });

    refreshAll();
  </script>
</body>
</html>
