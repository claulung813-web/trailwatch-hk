<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User route — TrailWatch HK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-header"></div>
  <main class="page">
    <div class="container route-share">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="explore.html" data-i18n="tab_records"></a>
        <span>›</span>
        <span id="crumbTitle"></span>
      </nav>
      <p class="route-share-privacy" id="recPrivacy"></p>
      <h1 class="page-title" id="recTitle"></h1>
      <p class="page-sub" id="recRegion"></p>
      <div class="route-share-byline">
        <strong id="recAuthor"></strong>
        <span id="recDate"></span>
      </div>
      <div id="recMap" class="route-share-map"></div>
      <section class="route-share-block">
        <h2 id="lblData"></h2>
        <div class="route-share-stats route-share-stats--6" id="recStats"></div>
      </section>
      <section class="route-share-block">
        <h2 id="lblElev"></h2>
        <p class="route-share-elev" id="elevLine"></p>
      </section>
      <div class="detail-next-steps">
        <button type="button" class="btn btn-primary dup-btn" id="recDup" data-i18n="rec_duplicate_edit"></button>
        <button type="button" class="btn btn-secondary bookmark-btn" id="recBookmark" data-i18n="rec_bookmark"></button>
      </div>
    </div>
  </main>
  <div id="app-footer"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/live-routes.js"></script>
  <script src="js/cms-store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.documentElement.lang = TW.getLang() === "zh" ? "zh-Hant" : "en";
    initShell("explore");
    const t = TW.t;
    document.getElementById("lblData").textContent = t("rec_record_data");
    document.getElementById("lblElev").textContent = t("rec_elev_stat_record");
    document.getElementById("recPrivacy").textContent = t("rec_public");

    const id = new URLSearchParams(location.search).get("id");
    const r =
      (typeof TW.getUserRoute === "function" && TW.getUserRoute(id)) ||
      (typeof TW.getRecord === "function" && TW.getRecord(id));
    if (!r) {
      location.href = "explore.html";
    } else {
      const title = TW.tt(r, "title") || r.date || id;
      document.title = title + " — TrailWatch HK";
      document.getElementById("recTitle").textContent = title;
      document.getElementById("crumbTitle").textContent = title;
      document.getElementById("recRegion").textContent =
        TW.getLang() === "zh" ? r.regionZh || r.region || TW.districtName(r.district) : r.region || TW.districtName(r.district);
      document.getElementById("recAuthor").textContent = r.author || r.user || "";
      document.getElementById("recDate").textContent = r.date || "";
      const dist = r.distanceKm != null ? Number(r.distanceKm).toFixed(2) : r.distance || "—";
      document.getElementById("recStats").innerHTML = [
        [r.durationClock || r.duration || "—", t("rec_duration_lbl")],
        [r.startTime || "—", t("rec_start_time")],
        [r.endTime || "—", t("rec_end_time")],
        [dist, t("rec_distance_km")],
        [r.paceKmh != null ? Number(r.paceKmh).toFixed(2) : "—", t("rec_avg_pace_kmh")],
        [r.elevChange != null ? r.elevChange : "—", t("rec_elev_changes")],
      ].map((s) => `<div><strong>${s[0]}</strong><span>${s[1]}</span></div>`).join("");
      document.getElementById("elevLine").textContent =
        t("rec_elev_max") + " " + (r.elevMax != null ? r.elevMax + "m" : "—") +
        " · " + t("rec_elev_min") + " " + (r.elevMin != null ? r.elevMin + "m" : "—");

      const planId = r.id;
      document.getElementById("recDup").dataset.trail = planId;
      const bm = document.getElementById("recBookmark");
      bm.dataset.trail = planId;
      if (TW.isBookmarked(planId)) {
        bm.classList.add("active");
        bm.textContent = TW.t("rec_bookmark") + " ✓";
      }

      const path = (r.path && r.path.length ? r.path : [[22.35, 114.12]]).map((p) => [Number(p[0]), Number(p[1])]);
      const map = L.map("recMap").setView(path[0], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      const line = L.polyline(path, { color: "#2563eb", weight: 5 }).addTo(map);
      map.fitBounds(line.getBounds().pad(0.15));
    }
  </script>
</body>
</html>
